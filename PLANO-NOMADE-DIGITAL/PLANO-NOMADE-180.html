<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano Nômade 180</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef1f5; --text:#17212b; --muted:#5a6775; --border:#d8dde4;
  --accent:#2f6fde; --accent-soft:#e1ebfc; --on-accent:#ffffff; --ok:#1f8a5b; --ok-soft:#dff3e9; --warn:#b7791f; --warn-soft:#fbefd9;
  --c-br:#2f6fde; --c-int:#1f8a5b; --radius:10px; --side:270px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --surface:#171e26; --surface-2:#202a35; --text:#e6ebf0; --muted:#9aa7b4; --border:#2d3843;
    --accent:#6c9cf0; --accent-soft:#1f3150; --on-accent:#0f141a; --ok:#45b884; --ok-soft:#173528; --warn:#d9a441; --warn-soft:#3a2d14;
    --c-br:#6c9cf0; --c-int:#45b884;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#171e26; --surface-2:#202a35; --text:#e6ebf0; --muted:#9aa7b4; --border:#2d3843;
  --accent:#6c9cf0; --accent-soft:#1f3150; --on-accent:#0f141a; --ok:#45b884; --ok-soft:#173528; --warn:#d9a441; --warn-soft:#3a2d14;
  --c-br:#6c9cf0; --c-int:#45b884;
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:.92em}
pre{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;font-size:13.5px;line-height:1.5;position:relative;white-space:pre-wrap}
pre code{background:none;padding:0}
blockquote{margin:12px 0;padding:8px 14px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0;position:relative}
.tbl{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface)}
th,td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--surface-2)}
h1{font-size:26px;line-height:1.25;margin:0 0 6px}
h2{font-size:20px;margin:28px 0 10px}
h3{font-size:17px;margin:22px 0 8px}
button,.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font:inherit;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
/* layout */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.top .brand{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
.layout{display:flex}
nav.side{width:var(--side);flex:0 0 var(--side);background:var(--surface);border-right:1px solid var(--border);height:calc(100vh - 55px);position:sticky;top:55px;overflow-y:auto;padding:12px 10px 40px}
nav.side a{display:block;padding:6px 10px;border-radius:7px;color:var(--text);text-decoration:none;font-size:14.5px}
nav.side a:hover{background:var(--surface-2)}
nav.side a.on{background:var(--accent-soft);font-weight:600}
nav.side .grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 10px 4px}
main{flex:1;min-width:0;padding:20px 16px 120px;overflow-wrap:break-word}
.page code{overflow-wrap:anywhere}
.page{max-width:880px;margin:0 auto}
@media (max-width:900px){
  .menu-btn{display:inline-flex}
  nav.side{position:fixed;left:0;top:55px;bottom:0;height:auto;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  nav.side.open{transform:none}
  .scrim{display:none;position:fixed;inset:55px 0 0 0;background:rgba(0,0,0,.35);z-index:25}
  .scrim.open{display:block}
}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--accent-soft);font-size:12.5px;margin:2px 4px 2px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
/* day */
.meta{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px}
.prog{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin:8px 0}
.prog>span{display:block;height:100%;background:var(--ok);transition:width .2s}
ol.blocks{list-style:none;padding:0;margin:0}
.blk{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:12px 14px;margin:10px 0}
.blk.on{background:var(--ok-soft);border-color:var(--ok)}
.blk .bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blk .bh label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;font-weight:600;min-width:200px}
.blk input[type=checkbox]{width:22px;height:22px;flex:0 0 22px;accent-color:var(--ok)}
.blk .task{margin:6px 0 0 32px}
.blk .mins{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
dl.info{display:grid;grid-template-columns:1fr;gap:10px;margin:0}
dl.info dt{font-weight:650}
dl.info dd{margin:0}
.callout{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.nav-days{display:flex;justify-content:space-between;gap:8px;margin:18px 0}
li.task{list-style:none;margin-left:-1.3em}
li.task input.tk{width:18px;height:18px;vertical-align:-3px;margin-right:6px;accent-color:var(--ok)}
.copy{position:absolute;top:6px;right:6px;font-size:12px;padding:3px 8px}
/* lists of days */
.daylist{list-style:none;padding:0;margin:0}
.daylist li a{display:grid;grid-template-columns:16px 70px 1fr;gap:10px;align-items:start;padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none}
.daylist li a:hover{background:var(--surface-2)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;border:1px solid var(--border);background:var(--surface)}
.dot.concluido{background:var(--ok);border-color:var(--ok)}
.dot.parcial,.dot.minimo{background:var(--warn);border-color:var(--warn)}
.dot.descanso{background:var(--surface-2)}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px}
.cal a{display:flex;align-items:center;justify-content:center;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);text-decoration:none;font-size:12px}
.cal a.concluido{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.cal a.parcial,.cal a.minimo{background:var(--warn);border-color:var(--warn);color:var(--on-accent)}
.cal a.descanso{background:var(--surface-2);color:var(--muted)}
.cal a.today{outline:2px solid var(--accent);outline-offset:1px}
.bar-row{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bar{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.num{text-align:right;font-variant-numeric:tabular-nums}
svg text{fill:var(--muted);font-size:11px}
details.toc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin:12px 0}
details.toc summary{cursor:pointer;font-weight:600}
/* timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,.2);border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:10px;max-width:calc(100% - 24px)}
.timer.show{display:flex}
.timer .t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.timer .lab{font-size:13px;color:var(--muted);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;right:14px;bottom:80px;z-index:50;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;margin:10px 0}
.saved{font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.sr{position:absolute;left:-9999px}
@media print{.top,nav.side,.timer,.nav-days,button{display:none!important} main{padding:0}}
</style>
</head>

 exporte, assista no celular, anote 3 problemas (ritmo, texto, áudio) na aba \"diário de aprendizado\"."}, {"n": 3, "wd": "Qua", "w": 1, "m": 1, "ph": "Fase 1 — Fundação", "tipo": "Comercial", "tag": "", "obj": "Criar a oferta \"Tráfego + Criativos com IA\" da MM e montar a primeira lista de 30 prospects em Goiânia.", "o": "Criar a oferta \"Tráfego + Criativos com IA\" da MM e montar a primeira lista de 30 prospects em Goiânia.", "tools": "Google Sheets, Google Maps, Instagram, Meta Ad Library (Biblioteca de Anúncios), WhatsApp Business", "mat": "<a href=\"#doc/prospeccao\">05-PROSPECCAO/estrategia-de-prospeccao.md<\/a> (seção \"Brasil — MM\") · scripts <a href=\"#doc/scripts/s19--prospecção-br-whatsappinstagram\">S19<\/a> e <a href=\"#doc/scripts/s20--upsell-para-clientes-atuais\">S20<\/a> em <a href=\"#doc/scripts\">05-PROSPECCAO/scripts-de-prospeccao.md<\/a>", "blocks": [{"min": 30, "label": "Inglês", "task": "Role-play por voz com IA (20 min, prompt <a href=\"#doc/ingles/prompts-de-ia-para-inglês\">P-ING-2<\/a>): você conhece o dono de uma marca num evento online e explica em 60 s o que faz. Revisão (10 min): anote 5 erros/expressões e a forma correta no seu caderno de erros."}, {"min": 45, "label": "Oferta", "task": "Escreva os 3 pacotes da MM: (1) Tráfego; (2) Tráfego + 4 criativos/mês; (3) Tráfego + 8 criativos/mês. Use os preços-guia da estratégia e ajuste ao seu mercado."}, {"min": 75, "label": "Lista de leads", "task": "Monte a aba \"Leads BR\" com 30 empresas de Goiânia em 4 segmentos, com sinais de compra anotados (detalhes no passo a passo)."}, {"min": 30, "label": "Abordagem", "task": "Envie o script <a href=\"#doc/scripts/s19--prospecção-br-whatsappinstagram\">S19<\/a> para os 5 leads de prioridade A. Registre data e canal."}], "steps": ["Pacotes (aba \"Oferta MM\"): para cada um escreva o que inclui, o que NÃO inclui, prazo de entrega dos criativos, nº de revisões e preço. Âncora: hoje você recebe ~R$ 750/cliente; o pacote 2 deve ficar visivelmente acima disso porque inclui produção.", "Segmentos para a lista: restaurantes/delivery, clínicas de estética, imobiliárias/corretores, academias/estúdios, lojas de moda/acessórios. Fonte: Google Maps (\"restaurante Setor Bueno\", \"clínica estética Goiânia\" etc.) + Instagram.", "Para cada lead, abra a Meta Ad Library (facebook.com/ads/library), país Brasil, busque o nome da empresa. Anote: tem anúncio ativo? (S/N) · quantos criativos · há quanto tempo o mesmo criativo roda · qualidade (1–5).", "Colunas: nome, segmento, bairro, Instagram, WhatsApp, seguidores, anúncios ativos (S/N), nº de criativos, observação específica (ex.: \"mesmo vídeo desde março, sem legenda\"), prioridade (A = anuncia mal ou pouco e tem ticket; B = não anuncia mas é ativo; C = resto).", "Envie <a href=\"#doc/scripts/s19--prospecção-br-whatsappinstagram\">S19<\/a> personalizado para os 5 \"A\". A primeira linha sempre cita algo real do perfil deles. Não envie áudio longo nem PDF na primeira mensagem."], "nota": "", "ex": "Lista com 30 leads qualificados com observação específica de cada um.", "ent": "Aba \"Oferta MM\" com 3 pacotes · aba \"Leads BR\" com 30 linhas · 5 mensagens enviadas.", "e": "Aba \"Oferta MM\" com 3 pacotes · aba \"Leads BR\" com 30 linhas · 5 mensagens enviadas.", "ver": "Para cada lead A você consegue dizer em 1 frase o que faria de diferente nos anúncios dele. Se não consegue, a observação está genérica demais.", "nx": "Dia <a href=\"#dia/4\">4<\/a>: Entender a estrutura dos anúncios que vendem e montar um swipe file com 20 anúncios classificados.", "foco": "", "tot": 180, "ing": 30, "s": "criar a oferta \"tráfego + criativos com ia\" da mm e montar a primeira lista de 30 prospects em goiânia. aba \"oferta mm\" com 3 pacotes · aba \"leads br\" com 30 linhas · 5 mensagens enviadas. google sheets, google maps, instagram, meta ad library (biblioteca de anúncios), whatsapp business 05-prospeccao/estrategia-de-prospeccao.md (seção \"brasil — mm\") · scripts s19 e s20 em 05-pros ique cada um nas colunas do passo a passo."}, {"min": 30, "label": "Síntese", "task": "Escolha 3 estruturas para \"copiar a estrutura, não o conteúdo\" nos Ads #2–#4 e escreva por quê."}], "steps": ["Na Ad Library filtre por \"Ativos\" e prefira anúncios que rodam há mais de 30 dias — anunciante raramente mantém por muito tempo o que não dá resultado (é um indício, não uma garantia).", "Colunas: marca, link, plataforma, formato, tipo de gancho (pergunta, afirmação polêmica, visual, dor, oferta, prova), texto do gancho em inglês (copie), estrutura (PAS, demo, lista...), duração, CTA, \"por que acho que funciona\" (1 frase em inglês).", "Escreva a coluna \"por que funciona\" em inglês, mesmo simples — é treino de vocabulário de trabalho.", "Ao final, filtre pelo tipo de gancho: qual aparece mais? Qual você nunca usou?"], "nota": "", "ex": "Classificar 20 anúncios reais por gancho, formato e estrutura.", "ent": "Aba \"Swipe File\" com 20 anúncios classificados + 3 estruturas escolhidas.", "e": "Aba \"Swipe File\" com 20 anúncios classificados + 3 estruturas escolhidas.", "ver": "Pegue 3 anúncios novos na Ad Library e classifique cada um em &lt; 2 min. Se demorar mais, revise as definições.", "nx": "Dia <a href=\"#dia/5\">5<\/a>: Aprender a estrutura de prompt de imagem e gerar um kit visual consistente de um produto fictício.", "foco": "", "tot": 180, "ing": 30, "s": "entender a estrutura dos anúncios que vendem e montar um swipe file com 20 anúncios classificados. aba \"swipe file\" com 20 anúncios classificados + 3 estruturas escolhidas. meta ad library, tiktok creative center (top ads), google sheets meta ad library (facebook.com/ads/library) · tiktok creative center → inspiration → top ads · youtube: busque \"dara denney ad hooks\" (inglês) inglês mensagem profissional (25 min): escreva um pedido de conexão no linkedin (300 caracteres) para um dono de marca de e-commerce; corrija com ia (p-ing-1) e salve a versão final no seu banco de mensagens. leia em voz alta 2x (5 min). conceito assista ao vídeo e anote: gancho (0–3 s), retenção, estrutura pas (problema-agitação-solução), demonstração, prova social, oferta, cta; e os formatos: ugc, demo, antes/depois, lista \"3 reasons\", história do fundador, comparação. prática swipe file: 10 anúncios da meta ad library (país: eua; buscas \"skincare\", \"coffee\", \"pet\", \"supplement\") + 10 top ads do tiktok. classifique cada um nas colunas do passo a passo. síntese escolha 3 estruturas para \"copiar a estrutura, não o conteúdo\" nos ads #2–#4 e escreva por quê."}, {"n": 5, "wd": "Sex", "w": 1, "m": 1, "ph": "Fase 1 — Fundação", "tipo": "Habilidade", "tag": "", "obj": "Aprender a estrutura de prompt de imagem e gerar um kit visual consistente de um produto fictício.", "o": "Aprender a estrutura de prompt de imagem e gerar um kit visual consistente de um produto fictício.", "tools": "Gemini (app/web — geração de imagem \"Nano Banana\", grátis com limite diário) ou Google Flow (créditos diários grátis), Google Sheets (Biblioteca de Prompts)", "mat": "<a href=\"#doc/prompts\">06-FERRAMENTAS/biblioteca-de-prompts.md<\/a> (estrutura <a href=\"#doc/prompts/p-img--imagem-de-produto\">P-IMG<\/a>) · Central de Ajuda do Gemini sobre geração de imagens", "blocks": [{"min": 30, "label": "Inglês", "task": "Listening (20 min): 1 episódio de '6 Minute English' (BBC Learning English) sobre trabalho/tecnologia. Resumo falado (10 min): grave 1 min resumindo em inglês no celular e ouça uma vez."}, {"min": 30, "label": "Conceito", "task": "Estude a estrutura <a href=\"#doc/prompts/p-img--imagem-de-produto\">P-IMG<\/a>: produto + cenário + iluminação + lente + composição + realismo + restrições. Aprenda 10 termos: softbox, golden hour, rim light, high-key, low-key, 35mm, 85mm, macro, flat lay, hero shot."}, {"min": 90, "label": "Prática", "task": "Gere o kit visual da lata \"North Brew\": 1 packshot + 6 cenas com o mesmo produto. Registre cada prompt e dê notas de realismo e consistência."}, {"min": 30, "label": "Registro", "task": "Crie a aba \"Biblioteca de Prompts\" (prompt, ferramenta, resultado, nota, o que mudar) e marque os 3 melhores."}], "steps": ["Packshot: \"A matte black aluminum can of iced coffee, minimalist white label with the word NORTH, on a seamless light grey background, soft studio lighting from the left, subtle reflection, shot on 85mm, photorealistic product photography, no extra text\". Gere 4 variações e escolha 1.", "Use a imagem escolhida como referência (anexe no Gemini/Flow) e peça as cenas: (1) mesa de café da manhã com luz de janela, (2) mão segurando a lata na rua, (3) cubos de gelo caindo ao redor, macro, (4) piquenique ao pôr do sol, (5) mesa de escritório com notebook, (6) close extremo de gotas de condensação.", "Repita no prompt os mesmos descritores do produto (\"the same matte black can with white NORTH label\") — a consistência vem de repetir a descrição exata.", "Notas 1–5: realismo (parece foto?) e consistência (é a mesma lata?). Anote falhas: rótulo deformado, mãos estranhas, gelo sem física.", "Se o limite gratuito acabar, continue amanhã cedo ou use os créditos diários do Google Flow."], "nota": "", "ex": "Gerar 7 imagens do mesmo produto em cenários diferentes.", "ent": "7 imagens salvas em 02-Assets/northbrew + 7 prompts com nota.", "e": "7 imagens salvas em 02-Assets/northbrew + 7 prompts com nota.", "ver": "Pelo menos 5 das 7 imagens mostram claramente a mesma lata (consistência ≥ 3/5).", "nx": "Dia <a href=\"#dia/6\">6<\/a>: Transformar imagens em vídeo com IA e montar o Anúncio #1 (15 s) com visual gerado por IA.", "foco": "", "tot": 180, "ing": 30, "s": "aprender a estrutura de prompt de imagem e gerar um kit visual consistente de um produto fictício. 7 imagens salvas em 02-assets/northbrew + 7 prompts com nota. gemini (app/web — geração de imagem \"nano banana\", grátis com limite diário) ou google flow (créditos diários grátis), google sheets (biblioteca de prompts) 06-ferramentas/biblioteca-de-prompts.md (estrutura p-img) · central de ajuda do gemini sobre geração de imagens inglês listening (20 min): 1 episódio de '6 minute english' (bbc learning english) sobre trabalho/tecnologia. resumo falado (10 min): grave 1 min resumindo em inglês no celular e ouça uma vez. conceito estude a estrutura p-img: produto + cenário + iluminação + lente + composição + realismo + restrições. aprenda 10 termos: softbox, golden hour, rim light, high-key, low-key, 35mm, 85mm, macro, flat lay, hero shot. prática gere o kit visual da lata \"north brew\": 1 packshot + 6 cenas com o mesmo produto. registre cada prompt e dê notas de realismo e consistência. registro crie a aba \"biblioteca de prompts\" (prompt, ferramenta, resultado, nota, o que mudar) e marque os 3 melhores."}, {"n": 6, "wd": "Sáb", "w": 1, "m": 1, "ph": "Fase 1 — Fundação", "tipo": "Projeto", "tag": "", "obj": "Transformar imagens em vídeo com IA e montar o Anúncio #1 (15 s) com visual gerado por IA.", "o": "Transformar imagens em vídeo com IA e montar o Anúncio #1 (15 s) com visual gerado por IA.", "tools": "Google Flow (Veo, créditos grátis diários) e/ou Kling (créditos grátis diários, com marca d'água), DaVinci Resolve", "mat": "Central de Ajuda do Google Flow · \"Veo prompt guide\" (documentação do Google Cloud/Vertex AI) · <a href=\"#doc/prompts\">06-FERRAMENTAS/biblioteca-de-prompts.md<\/a> (<a href=\"#doc/prompts/p-vid--image-to-video-ou-text-to-video\">P-VID<\/a>)", "blocks": [{"min": 30, "label": "Inglês", "task": "Pitch em vídeo (30 min): 'Who I am and what I do' — quem você é, o que faz, para quem. Grave 60–90 s, assista, regrave 1 vez. Guarde o melhor take (vira post ou peça do portfólio)."}, {"min": 120, "label": "Projeto", "task": "Anime as 4 melhores imagens de ontem (4 clipes de 5–8 s, 1 movimento de câmera simples por clipe) e monte o Ad #1 no DaVinci usando a estrutura do Dia <a href=\"#dia/2\">2<\/a>."}, {"min": 30, "label": "Portfólio", "task": "Exporte em 9:16, salve em 04-Portfolio/Ad01 e escreva a ficha em r, repetir ou ajustar. Escreva no máximo 3 mudanças para o próximo mês no topo do próximo arquivo mensal. Decisão de viagem: só marque data de partida se o marco 4 (\"preparado para viajar\") estiver cumprido ou com data realista nos próximos 90 dias. Se não, a decisão certa é \"ainda não\" + o que precisa acontecer. Comemore o que foi feito — você construiu um negócio, não só leu um plano."}], "steps": [], "nota": "", "ex": "Calcular os indicadores do mês e marcar cada critério de passagem como cumprido / não cumprido.", "ent": "Revisão mensal preenchida + decisão de passagem (sim/não) + até 3 ajustes escritos", "e": "Revisão mensal preenchida + decisão de passagem (sim/não) + até 3 ajustes escritos", "ver": "Se ≥ 80% dos critérios de passagem foram cumpridos, avance. Se não, use a primeira semana do mês seguinte para fechar as lacunas, sem conteúdo novo.", "nx": "Comece o ciclo 181–360 usando o plano criado no Dia <a href=\"#dia/176\">176<\/a>.", "foco": "revisão FINAL — compare a linha de base do Dia <a href=\"#dia/1\">1<\/a> com hoje (renda, % em moeda forte, clientes, portfólio, inglês, reserva). Avalie os 4 marcos financeiros do 07-FINANCEIRO.", "tot": 180, "ing": 30, "s": "revisão final dos 180 dias: o que você construiu, onde está nos marcos e qual é a decisão sobre a vida nômade. revisão mensal preenchida + decisão de passagem (sim/não) + até 3 ajustes escritos csv de acompanhamento, painel do plano-nomade-180.html, template de revisão mensal 08-revisoes/revisao-mensal-template.md + critérios de passagem no topo deste arquivo inglês listening (20 min): vídeo/podcast sobre nômades digitais e negócios remotos. resumo falado (10 min): grave 1 min resumindo em inglês no celular e ouça uma vez. revisão mensal abra 08-revisoes/revisao-mensal-template.md: some os números do mês no csv, compare com as metas (conservadora/realista/ambiciosa) e com os critérios de passagem deste arquivo. foco: revisão final — compare a linha de base do dia 1 com hoje (renda, % em moeda forte, clientes, portfólio, inglês, reserva). avalie os 4 marcos financeiros do 07-financeiro. ajuste do plano decida: avançar, repetir ou ajustar. escreva no máximo 3 mudanças para o próximo mês no topo do próximo arquivo mensal. decisão de viagem: só marque data de partida se o marco 4 (\"preparado para viajar\") estiver cumprido ou com data realista nos próximos 90 dias. se não, a decisão certa é \"ainda não\" + o que precisa acontecer. comemore o que foi feito — você construiu um negócio, não só leu um plano."}], "months": [{"m": 1, "title": "Mês 1 (Dias 1–30) — Fundação: sistema, editor, IA e primeiros criativos", "html": "<blockquote>\n<p><strong>Como usar este arquivo:<\/strong> abra só o dia de hoje. Faça os blocos na ordem. No fim, preencha a linha do dia em <code>08-REVISOES/acompanhamento-180-dias.csv<\/code> (ou no arquivo PLANO-NOMADE-180.html). Domingo é revisão + descanso — não é dia de recuperar conteúdo atrasado, é dia de decidir o que cortar.<\/p>\n<\/blockquote>\n<h2 id=\"visão-do-mês\">Visão do mês<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Definição<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Objetivo principal<\/strong><\/td>\n<td>Sair do zero para 4 anúncios em vídeo finalizados (com IA + edição profissional), um sistema diário funcionando e a MM vendendo um pacote \"tráfego + criativos\" no Brasil.<\/td>\n<\/tr>\n<tr>\n<td><strong>Habilidades<\/strong><\/td>\n<td>Edição de anúncio no DaVinci (corte, ritmo, legenda, áudio, exportação) · geração de imagem e image-to-video com IA · anatomia de anúncio de performance · framework de teste de criativos.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ferramentas<\/strong><\/td>\n<td>DaVinci Resolve (grátis) · Google Flow / Gemini (créditos grátis) · Kling (créditos grátis) · ElevenLabs (grátis, só treino) · Subtitle Edit ou MacWhisper (grátis) · Meta Ad Library · TikTok Creative Center · Google Sheets/Drive · Canva (grátis) · LinkedIn · Contra.<\/td>\n<\/tr>\n<tr>\n<td><strong>Projetos<\/strong><\/td>\n<td>Ad #1 café em lata (marca fictícia) · Ad #2 sérum (problema-solução) · Ad #3 restaurante (spec para prospect real de Goiânia) · Ad #4 hotel/pousada · 5 variações de gancho · Estudo de Caso 01 (cliente atual, PT/EN) · relatório de teste de criativo com dados reais.<\/td>\n<\/tr>\n<tr>\n<td><strong>Portfólio<\/strong><\/td>\n<td>v0: perfil no Contra com 4 projetos + LinkedIn em inglês com seção \"Featured\".<\/td>\n<\/tr>\n<tr>\n<td><strong>Inglês<\/strong><\/td>\n<td>30 min/dia (6 dias) + 1 conversa/semana. Linha de base EF SET no Dia 1. 4 pitches em vídeo gravados.<\/td>\n<\/tr>\n<tr>\n<td><strong>Prospecção<\/strong><\/td>\n<td>Brasil: 30 leads listados, ≥ 40 abordagens no mês, ≥ 2 calls de diagnóstico, upsell oferecido aos 2 clientes atuais. Internacional: só presença (LinkedIn EN + 20 conexões).<\/td>\n<\/tr>\n<tr>\n<td><strong>Meta de renda (estimativas, não promessas)<\/strong><\/td>\n<td>Conservadora: R$ 1.500 (mantém) · Realista: R$ 1.800–2.200 (1 upsell ou 1 cliente novo) · Ambiciosa: R$ 2.500+ (2 fechamentos). Internacional: US$ 0 (esperado).<\/td>\n<\/tr>\n<tr>\n<td><strong>Custo de ferramentas<\/strong><\/td>\n<td>R$ 0 (só planos gratuitos).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Indicadores do mês (registre no fim de cada dia):<\/strong> dias concluídos · minutos realizados · anúncios finalizados · abordagens BR · calls · respostas · tempo para produzir um anúncio de 15 s.<\/p>\n<p><strong>Critérios para passar para o Mês 2 (≥ 80% cumpridos):<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:1:1\"> 4 anúncios finalizados (Ad #1–#4) + 5 variações de gancho.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:1:2\"> Consegue produzir um anúncio de 15 s do zero em ≤ 2 h.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:1:3\"> LinkedIn em inglês e Contra publicados com 4 projetos.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:1:4\"> ≥ 40 abordagens BR registradas e ≥ 2 calls de diagnóstico realizadas.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:1:5\"> Upsell de criativos apresentado aos 2 clientes atuais.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:1:6\"> ≥ 22 dias com bloco de inglês feito + 4 pitches gravados.<\/li>\n<\/ul>\n<p><strong>Regras do mês:<\/strong> (1) plano gratuito primeiro — nada de assinatura até a revisão do Dia 30; (2) toda tarefa termina num arquivo exportado ou numa mensagem enviada; (3) se um dia estourar, corte a parte \"Registro/Portfólio\" e mantenha inglês + prática.<\/p>\n<p><strong>Feriados (Natal, Ano-Novo, Carnaval) ou dia ruim:<\/strong> use o <em>Modo Mínimo<\/em> — 30 min de inglês + 15 min de registro. Não compense no dia seguinte; o domingo absorve.<\/p>"}, {"m": 2, "title": "Mês 2 (Dias 31–60) — Produção comercial + mercado-ponte", "html": "<blockquote>\n<p><strong>Regra que começa agora:<\/strong> se você fechar um projeto pago, o bloco de prática do dia vira a entrega do cliente (mesma qualidade, mesmo checklist T05). Inglês e prospecção continuam. O plano se adapta ao dinheiro, não o contrário.<\/p>\n<\/blockquote>\n<h2 id=\"visão-do-mês\">Visão do mês<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Definição<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Objetivo principal<\/strong><\/td>\n<td>Elevar a qualidade dos anúncios ao nível \"entregável para cliente\", abrir o <strong>mercado-ponte<\/strong> (negócios que falam português e pagam em euro/dólar), ter perfil no Upwork e contas prontas para receber do exterior.<\/td>\n<\/tr>\n<tr>\n<td><strong>Habilidades<\/strong><\/td>\n<td>Correção de cor e igualar planos de IA · UGC híbrido (pessoa real + B-roll de IA) · tipografia animada e cartões finais · hero shots de produto · sound design nível 2 · copy de anúncio em inglês · entrega profissional · kit de produção rápida · proposta e call de diagnóstico.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ferramentas<\/strong><\/td>\n<td>DaVinci (Color, Fusion, Fairlight, Deliver) · <strong>1 plano pago: Google AI Pro<\/strong> (Flow/Veo + Gemini) — só se o critério do Dia 30 foi cumprido · Kling (grátis, complementar) · Framer/Carrd ou GitHub Pages · Upwork · Wise e/ou Payoneer · Loom (grátis).<\/td>\n<\/tr>\n<tr>\n<td><strong>Projetos<\/strong><\/td>\n<td>Ad #5 imobiliária · Ad #6 UGC híbrido · Ad #7 restaurante (spec para prospect em Portugal) · Ad #8 e-commerce pet (abre o Mês 3) · Conceito de campanha local (3 anúncios de funil) · hero reel 10 s · Estudo de Caso 02 (teste real com IA).<\/td>\n<\/tr>\n<tr>\n<td><strong>Portfólio<\/strong><\/td>\n<td>v1: site em inglês com 8 anúncios em 3 verticais + 2 estudos de caso · Contra e Upwork atualizados.<\/td>\n<\/tr>\n<tr>\n<td><strong>Inglês<\/strong><\/td>\n<td>30 min/dia + 1 conversa/semana · roteiros e copy em inglês · primeiras 3 simulações de call gravadas.<\/td>\n<\/tr>\n<tr>\n<td><strong>Prospecção<\/strong><\/td>\n<td>Brasil: ≥ 25 abordagens + fechamento de pelo menos 1 cliente ou upsell. Mercado-ponte: ≥ 40 abordagens, 5 Looms, 2 specs. Upwork: ≥ 9 propostas (se aprovado).<\/td>\n<\/tr>\n<tr>\n<td><strong>Meta de renda (estimativas)<\/strong><\/td>\n<td>Brasil — Conservadora: R$ 1.500–1.800 · Realista: R$ 2.200 · Ambiciosa: R$ 3.000. Internacional — Conservadora: US$ 0 · Realista: até US$/€ 100 (primeiro recebimento possível) · Ambiciosa: US$ 300.<\/td>\n<\/tr>\n<tr>\n<td><strong>Custo de ferramentas<\/strong><\/td>\n<td>~R$ 110–180/mês (Google AI Pro + alguns Connects). Confira o preço em reais no site do Google antes de assinar.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Indicadores:<\/strong> anúncios finalizados · tempo de produção de um anúncio de 15 s · abordagens por canal (BR / ponte / Upwork) · taxa de resposta por canal · calls · propostas enviadas · fechamentos · primeiro recebimento em moeda forte (S/N) · custo de ferramentas por segundo de vídeo aproveitado.<\/p>\n<p><strong>Critérios para passar para o Mês 3 (≥ 80%):<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:2:1\"> ≥ 8 anúncios no portfólio em ≥ 3 verticais + 2 estudos de caso (1 com dados de teste real).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:2:2\"> Site v1 no ar; perfil Upwork aprovado (ou reenviado com melhorias); Contra atualizado.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:2:3\"> Conta para receber do exterior verificada (Wise e/ou Payoneer).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:2:4\"> ≥ 40 abordagens no mercado-ponte e ≥ 2 calls com negócios fora do Brasil.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:2:5\"> Brasil: ≥ 1 cliente novo <strong>ou<\/strong> ≥ 1 upsell fechado.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:2:6\"> Anúncio de 15 s produzido em ≤ 90 min com o kit de produção.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:2:7\"> Inglês: 8 pitches gravados no total e 4 conversas com humanos.<\/li>\n<\/ul>"}, {"m": 3, "title": "Mês 3 (Dias 61–90) — Nicho e-commerce + prospecção em inglês", "html": "<blockquote>\n<p><strong>Mudança de chave:<\/strong> a partir de agora, todo dia tem pelo menos 30 min comerciais. Você não vai se sentir pronto para prospectar em inglês — ninguém se sente. Mensagem curta, específica e honesta funciona melhor que inglês perfeito.<\/p>\n<\/blockquote>\n<h2 id=\"visão-do-mês\">Visão do mês<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Definição<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Objetivo principal<\/strong><\/td>\n<td>Posicionar-se como criador de anúncios com IA para marcas de e-commerce (DTC) e agências, fazer prospecção diária em inglês e fechar o primeiro piloto internacional.<\/td>\n<\/tr>\n<tr>\n<td><strong>Habilidades<\/strong><\/td>\n<td>ICP e oferta · listas de leads a partir da Ad Library · cold e-mail com boa entregabilidade · teardown em vídeo (Loom) em inglês · anúncios estáticos com IA · iteração de vencedores · precificação em dólar · objeções e negociação · onboarding de cliente · produção em sprint.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ferramentas<\/strong><\/td>\n<td>Google AI Pro (Flow/Gemini) · DaVinci · Canva · Loom · LinkedIn · Upwork · Apollo (grátis) e Hunter (grátis) · domínio próprio + e-mail profissional (recomendado) · Google Forms.<\/td>\n<\/tr>\n<tr>\n<td><strong>Projetos<\/strong><\/td>\n<td>Sample Sprint \"Pawly\" (3 conceitos × 2 ganchos) · 4 specs para prospects reais (privados) · 6 estáticos · matriz de iteração · refresh do Ad #1 (antes/depois da sua evolução) · kit de onboarding.<\/td>\n<\/tr>\n<tr>\n<td><strong>Portfólio<\/strong><\/td>\n<td>v2: seção E-commerce com sprint completo, estáticos, iterações e 2–3 casos.<\/td>\n<\/tr>\n<tr>\n<td><strong>Inglês<\/strong><\/td>\n<td>30 min/dia + 1 conversa/semana + Looms e mensagens reais em inglês todos os dias. Meta: 1 call real em inglês até o Dia 90.<\/td>\n<\/tr>\n<tr>\n<td><strong>Prospecção<\/strong><\/td>\n<td>≥ 150 contatos personalizados em inglês no mês (e-mail + LinkedIn + Upwork + agências) · 6 Looms · 4 specs · Brasil em manutenção (45 min/semana).<\/td>\n<\/tr>\n<tr>\n<td><strong>Meta de renda (estimativas)<\/strong><\/td>\n<td>Internacional — Conservadora: US$ 0 · Realista: US$ 100–300 (1 piloto) · Ambiciosa: US$ 700. Brasil — Conservadora: R$ 1.800 · Realista: R$ 2.500 · Ambiciosa: R$ 3.500.<\/td>\n<\/tr>\n<tr>\n<td><strong>Custo de ferramentas<\/strong><\/td>\n<td>~R$ 200–350/mês (Google AI Pro + Connects + domínio/e-mail profissional). Regra: ferramenta nova só se pagar com o primeiro piloto.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Indicadores:<\/strong> contatos em inglês por canal · respostas · respostas positivas · calls · propostas · pilotos fechados · receita em US$/€ · tempo de produção por anúncio · custo de ferramentas ÷ receita.<\/p>\n<p><strong>Critérios para passar para o Mês 4 (≥ 80%):<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:3:1\"> ≥ 150 contatos personalizados em inglês no mês.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:3:2\"> ≥ 3 calls com prospects internacionais (qualquer canal, incluindo mercado-ponte).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:3:3\"> ≥ 1 projeto internacional pago <strong>ou<\/strong> ≥ 2 propostas com preço enviadas.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:3:4\"> 4 specs e 6 Looms em inglês enviados.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:3:5\"> Portfólio v2 publicado com seção E-commerce.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:3:6\"> ≥ 1 call real em inglês feita (ou 6 role-plays gravados, se nenhuma call aconteceu).<\/li>\n<\/ul>\n<p><strong>Se chegar o Dia 90 sem nenhum cliente internacional:<\/strong> não é fracasso, é dado. A revisão trimestral (Dia 90) tem a árvore de decisão: ajustar mensagem, trocar canal ou ativar a estratégia alternativa.<\/p>"}, {"m": 4, "title": "Mês 4 (Dias 91–120) — Primeiros contratos e recorrência", "html": "<blockquote>\n<p><strong>Regra do mês:<\/strong> cliente pago tem prioridade no bloco de prática, mas <strong>nunca<\/strong> zere a prospecção: mínimo de 45 min comerciais por dia útil. Freelancer que para de prospectar quando fecha o primeiro cliente fica sem nenhum dois meses depois.<\/p>\n<\/blockquote>\n<h2 id=\"visão-do-mês\">Visão do mês<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Definição<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Objetivo principal<\/strong><\/td>\n<td>Transformar pilotos em contratos recorrentes, entregar com processo profissional e subir o nível estratégico (pesquisa de ângulos, relatórios, cor e motion).<\/td>\n<\/tr>\n<tr>\n<td><strong>Habilidades<\/strong><\/td>\n<td>Pesquisa de ângulos (mineração de avaliações) · conceitos realmente diferentes · grading de marca (look consistente) · motion graphics leve no Fusion · relatório mensal de criativos · localização (EN/ES/PT) · negociação e controle de escopo · CRM e agendamento · captação real + IA.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ferramentas<\/strong><\/td>\n<td>DaVinci (Color avançado, Fusion) · Google AI Pro · ElevenLabs Starter (só quando houver cliente que precise de voz — licença comercial) · CRM em Google Sheets ou HubSpot grátis · Calendly grátis ou páginas de agendamento do Google Calendar · Loom.<\/td>\n<\/tr>\n<tr>\n<td><strong>Projetos<\/strong><\/td>\n<td>Matriz de ângulos + 5 conceitos · produto com callouts animados · relatório mensal (T03) apresentado em vídeo · anúncio localizado em 3 idiomas · UGC híbrido com pet · captação real + IA · lookbook de acessórios · 1 estudo de caso de processo.<\/td>\n<\/tr>\n<tr>\n<td><strong>Portfólio<\/strong><\/td>\n<td>Seção \"Process\" (como você pensa: pesquisa → conceitos → testes) + localização + motion.<\/td>\n<\/tr>\n<tr>\n<td><strong>Inglês<\/strong><\/td>\n<td>Calls reais semanais (meta: 2+ no mês) · relatório apresentado em inglês · negociação simulada.<\/td>\n<\/tr>\n<tr>\n<td><strong>Prospecção<\/strong><\/td>\n<td>≥ 120 contatos personalizados em inglês · follow-ups disciplinados · pedidos de indicação · proposta de retainer para todo piloto.<\/td>\n<\/tr>\n<tr>\n<td><strong>Meta de renda (estimativas)<\/strong><\/td>\n<td>Internacional — Conservadora: US$ 0–150 · Realista: US$ 300–600 · Ambiciosa: US$ 1.200. Brasil — Conservadora: R$ 2.000 · Realista: R$ 3.000 · Ambiciosa: R$ 4.000.<\/td>\n<\/tr>\n<tr>\n<td><strong>Custo de ferramentas<\/strong><\/td>\n<td>Teto: 15% da receita do mês (mínimo: Google AI Pro).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Indicadores:<\/strong> clientes internacionais ativos · receita em US$/€ · % da receita em moeda forte · propostas de retainer enviadas/aceitas · contatos em inglês · calls · tempo de produção por anúncio · revisões por entrega (meta ≤ 1,5).<\/p>\n<p><strong>Critérios para passar para o Mês 5 (≥ 80%):<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:4:1\"> ≥ 1 cliente internacional pago (incluindo mercado-ponte).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:4:2\"> ≥ 1 proposta de retainer enviada (ideal: 1 assinada).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:4:3\"> ≥ 120 contatos em inglês no mês e ≥ 4 calls.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:4:4\"> Relatório mensal T03 usado com ≥ 1 cliente.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:4:5\"> 3 templates de motion + PowerGrade de marca prontos.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:4:6\"> ≥ 2 calls reais em inglês no mês.<\/li>\n<\/ul>"}, {"m": 5, "title": "Mês 5 (Dias 121–150) — Escala de aquisição e posicionamento", "html": "<blockquote>\n<p><strong>Foco do mês:<\/strong> menos esforço por cliente conquistado. Indicação, agências, conteúdo e preço melhor rendem mais que mandar o dobro de e-mails. Habilidades opcionais (landing page, automação) entram com prazo fixo e decisão por dados: só ficam se tiverem demanda.<\/p>\n<\/blockquote>\n<h2 id=\"visão-do-mês\">Visão do mês<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Definição<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Objetivo principal<\/strong><\/td>\n<td>Aumentar a receita internacional com canais mais eficientes (agências, indicações, conteúdo, Upwork com taxa maior) e consolidar o posicionamento de nicho.<\/td>\n<\/tr>\n<tr>\n<td><strong>Habilidades<\/strong><\/td>\n<td>Anúncios nativos de TikTok · formatos de YouTube (skippable e bumper) · congruência anúncio × landing page (CRO básico) · teste de landing page com IA (opcional) · automação leve (opcional) · página de nicho e aumento de preço · conteúdo em inglês · parceria com agências · anúncio narrativo multi-planos · retenção de clientes · estrutura fiscal.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ferramentas<\/strong><\/td>\n<td>DaVinci (considerar o Studio, compra única de ~US$ 295, só se a receita do mês passar de ~US$ 1.000 e você precisar dos recursos de IA dele) · Google AI Pro · ElevenLabs Starter (com cliente) · Framer ou Claude Code + GitHub Pages (teste de LP) · n8n (teste opcional) · TikTok Creative Center · contador.<\/td>\n<\/tr>\n<tr>\n<td><strong>Projetos<\/strong><\/td>\n<td>2 anúncios nativos de TikTok · versão YouTube 30 s + bumper 6 s · auditoria \"Ad-to-Page\" · LP de teste · 1 automação (ou decisão de não automatizar) · página de nicho · 3 vídeos de bastidores · deck para agências + pacote de amostra sem marca · anúncio narrativo de 30 s.<\/td>\n<\/tr>\n<tr>\n<td><strong>Portfólio<\/strong><\/td>\n<td>v3: página de nicho, seção TikTok/YouTube, narrativo de 30 s, rascunho de showreel.<\/td>\n<\/tr>\n<tr>\n<td><strong>Inglês<\/strong><\/td>\n<td>Calls reais semanais · 2 posts/semana em inglês · apresentação para agências.<\/td>\n<\/tr>\n<tr>\n<td><strong>Prospecção<\/strong><\/td>\n<td>≥ 120 contatos em inglês · ≥ 25 agências contatadas · 8 posts · indicações pedidas a todo cliente satisfeito.<\/td>\n<\/tr>\n<tr>\n<td><strong>Meta de renda (estimativas)<\/strong><\/td>\n<td>Internacional — Conservadora: US$ 150–300 · Realista: US$ 500–1.000 · Ambiciosa: US$ 2.000. Brasil — Conservadora: R$ 2.200 · Realista: R$ 3.000 · Ambiciosa: R$ 4.500.<\/td>\n<\/tr>\n<tr>\n<td><strong>Custo de ferramentas<\/strong><\/td>\n<td>Teto de 15% da receita do mês.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Indicadores:<\/strong> receita em US$/€ · nº de clientes internacionais · % de receita recorrente · receita por hora trabalhada · contatos por canal e resposta por canal · posts e interações relevantes · agências em teste.<\/p>\n<p><strong>Critérios para passar para o Mês 6 (≥ 80%):<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:5:1\"> Receita internacional do mês ≥ US$ 500 <strong>ou<\/strong> ≥ 1 cliente recorrente.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:5:2\"> ≥ 2 clientes internacionais ativos (ou 1 retainer + 1 projeto).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:5:3\"> ≥ 1 agência em teste (projeto pago ou amostra aprovada).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:5:4\"> 8 posts publicados no mês.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:5:5\"> Página de nicho no ar e preço novo para clientes novos.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:5:6\"> Conversa com contador feita e estrutura de CNPJ definida.<\/li>\n<\/ul>"}, {"m": 6, "title": "Mês 6 (Dias 151–180) — Consolidação e prontidão nômade", "html": "<blockquote>\n<p><strong>Foco do mês:<\/strong> transformar o que funciona em sistema (ofertas fixas, processos escritos, finanças claras) e medir, com números, quão perto você está de trabalhar de qualquer lugar. Nada de comprar passagem neste mês — a decisão é no Dia 180, com os marcos do 07-FINANCEIRO.<\/p>\n<\/blockquote>\n<h2 id=\"visão-do-mês\">Visão do mês<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Definição<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Objetivo principal<\/strong><\/td>\n<td>Consolidar a renda internacional (recorrência e diversificação), documentar o negócio para funcionar de qualquer lugar e decidir, com critérios, o cronograma de vida nômade.<\/td>\n<\/tr>\n<tr>\n<td><strong>Habilidades<\/strong><\/td>\n<td>Produtização de ofertas · SOPs (processos documentados) · política de uso de IA e conformidade · infraestrutura de trabalho remoto · pesquisa de destinos e vistos · planejamento financeiro de transição · capacidade e precificação para tempo integral · coleta de prova social · showreel final.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ferramentas<\/strong><\/td>\n<td>Todas as do plano (sem novas assinaturas) · Google Docs/Loom para SOPs · Numbeo (custo de vida) · sites oficiais de imigração/consulados · backup em nuvem.<\/td>\n<\/tr>\n<tr>\n<td><strong>Projetos<\/strong><\/td>\n<td>3 ofertas fixas · SOP de produção · Política de IA (T06) · kit de trabalho remoto · comparativo de destinos · plano financeiro atualizado · plano de \"teste nômade\" · showreel final · plano dos Dias 181–360.<\/td>\n<\/tr>\n<tr>\n<td><strong>Portfólio<\/strong><\/td>\n<td>v4 final: showreel, 3 ofertas, casos com números, depoimentos, política de IA.<\/td>\n<\/tr>\n<tr>\n<td><strong>Inglês<\/strong><\/td>\n<td>Reteste EF SET (Dia 177) · calls reais semanais · pitch de 2 min gravado como vídeo de apresentação.<\/td>\n<\/tr>\n<tr>\n<td><strong>Prospecção<\/strong><\/td>\n<td>≥ 120 contatos em inglês · foco em diversificação (nenhum cliente &gt; 40% da receita internacional) · indicações.<\/td>\n<\/tr>\n<tr>\n<td><strong>Meta de renda (estimativas)<\/strong><\/td>\n<td>Internacional — Conservadora: US$ 300–500 · Realista: US$ 700–1.500 · Ambiciosa: US$ 3.000. Brasil — Conservadora: R$ 2.500 · Realista: R$ 3.500 · Ambiciosa: R$ 5.000.<\/td>\n<\/tr>\n<tr>\n<td><strong>Custo de ferramentas<\/strong><\/td>\n<td>Teto de 15% da receita.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Indicadores:<\/strong> receita total (BR + internacional) · % em moeda forte · receita recorrente internacional · concentração do maior cliente · reserva em meses de custo de vida · nota EF SET final × inicial · horas por semana de entrega × prospecção.<\/p>\n<p><strong>Critérios de conclusão do plano (Dia 180):<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:6:1\"> Habilidades comercializáveis: produz um sprint de 4 anúncios em ≤ 3 h com QA ≥ 85%.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:6:2\"> Portfólio profissional em inglês (v4) com showreel e ≥ 3 casos.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:6:3\"> Inglês funcional: ≥ 8 calls reais em inglês feitas no plano + nota EF SET acima da inicial.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:6:4\"> Experiência real de venda: ≥ 3 clientes internacionais pagos no plano (incluindo mercado-ponte).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:6:5\"> Renda internacional em construção: ≥ 1 cliente recorrente ou ≥ US$ 1.000 no último mês.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"mes:6:6\"> Situação fiscal regularizada ou em regularização com contador.<\/li>\n<\/ul>"}], "docs": {"diagnostico": {"title": "Diagnóstico estratégico", "group": "Estratégia", "html": "<blockquote>\n<p>Data da análise: 07/11/2026. Câmbio de referência: US$ 1 ≈ R$ 5,51 (fechamento de 06/11/2026) e € 1 ≈ R$ 6,13–6,16 (05/11/2026). Fontes e detalhes da pesquisa em <a href=\"#doc/pesquisa\">pesquisa-de-mercado.md<\/a>.<\/p>\n<\/blockquote>\n<h2 id=\"1-ponto-de-partida-fatos-que-você-me-deu\">1. Ponto de partida (fatos que você me deu)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Situação<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Local<\/td>\n<td>Goiânia (GO), Brasil<\/td>\n<\/tr>\n<tr>\n<td>Trabalho atual<\/td>\n<td>Gestor de tráfego pago — agência MM Gestão de Tráfego<\/td>\n<\/tr>\n<tr>\n<td>Clientes<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>Renda<\/td>\n<td>~R$ 1.500/mês (~R$ 750 por cliente; ≈ US$ 272/mês no câmbio atual)<\/td>\n<\/tr>\n<tr>\n<td>Tempo disponível<\/td>\n<td>3 h/dia, todos os dias<\/td>\n<\/tr>\n<tr>\n<td>Inglês<\/td>\n<td>Precisa evoluir (nível exato será medido no Dia 1 com o EF SET)<\/td>\n<\/tr>\n<tr>\n<td>Objetivo<\/td>\n<td>Renda remota em moeda forte, crescendo até permitir morar em diferentes países<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>O que ainda não sei e você mede no Dia 1:<\/strong> custo de vida mensal real, reserva atual, dívidas, nível de inglês (CEFR), capacidade da sua máquina (RAM/GPU), forma jurídica atual da MM (MEI, ME ou informal).<\/p>\n<h2 id=\"2-leitura-honesta-da-situação\">2. Leitura honesta da situação<\/h2>\n<p><strong>Forças<\/strong><\/p>\n<ul>\n<li>Você já sabe o que a maioria dos editores e \"artistas de IA\" não sabe: <strong>o que faz um anúncio vender e como medir isso<\/strong> (CTR, custo por resultado, ROAS, testes). Isso é o seu diferencial competitivo.<\/li>\n<li>Já tem clientes reais → dá para testar criativos com dinheiro real e gerar estudos de caso desde o Mês 1.<\/li>\n<li>3 h/dia todos os dias = ~540 h em 180 dias. É suficiente para atingir nível comercial em <strong>uma<\/strong> pilha de habilidades, não em cinco.<\/li>\n<\/ul>\n<p><strong>Fraquezas<\/strong><\/p>\n<ul>\n<li>Renda baixa (R$ 1.500) → orçamento de ferramentas mínimo e pouca margem para erro.<\/li>\n<li>Inglês em desenvolvimento → limita calls ao vivo no começo (por isso começamos com mercado-ponte em português e comunicação escrita/assíncrona).<\/li>\n<li>Sem portfólio internacional nem avaliações em plataformas.<\/li>\n<li>Dependência de 2 clientes (perder um = perder 50% da renda).<\/li>\n<\/ul>\n<p><strong>Oportunidades (com dados)<\/strong><\/p>\n<ul>\n<li>No Upwork, \"AI video generation &amp; editing\" foi a habilidade de IA que mais cresceu: <strong>+329% em 2025 vs. 2024<\/strong> (medido em ganhos de freelancers nos EUA, dado da própria plataforma). O Upwork também diz que as ferramentas de IA <strong>não reduziram<\/strong> a demanda por edição de vídeo.<\/li>\n<li>O Fiverr reporta alta de demanda em vídeo com IA e em <strong>anúncios UGC feitos com IA<\/strong> (dados da própria plataforma; os números divergem entre páginas do Fiverr).<\/li>\n<li>No Meta, a mudança para o sistema Andromeda fez a <strong>diversidade de criativos<\/strong> virar uma das principais alavancas de performance (consenso de especialistas; Meta comunica isso como \"creative diversification\"). Marcas precisam de <strong>mais conceitos de anúncio por mês<\/strong> → demanda recorrente por quem produz criativos rápido e entende de teste.<\/li>\n<li>Mercado lusófono e diáspora brasileira (Portugal e comunidades brasileiras nos EUA) permitem receber em € e US$ <strong>sem barreira de idioma<\/strong> no começo.<\/li>\n<\/ul>\n<p><strong>Ameaças<\/strong><\/p>\n<ul>\n<li>Barreira de entrada baixa em IA → muita concorrência de baixa qualidade e preço baixo (editores offshore cobram US$ 8–40/h segundo blogs de preços).<\/li>\n<li>Ferramentas mudam rápido: o <strong>Sora (OpenAI) foi descontinuado em 2026<\/strong> (app fechou em abril, API em setembro). Depender de uma ferramenta só é risco.<\/li>\n<li>Regras de transparência de IA ficando mais rígidas: <strong>EU AI Act, art. 50<\/strong>, aplicável desde 02/08/2026 (rotulagem de deepfakes); regras de plataformas de anúncios; regra da FTC (EUA) contra depoimentos falsos.<\/li>\n<li>Impostos e câmbio: receber do exterior exige estrutura correta (MEI não serve para gestão de tráfego, segundo as fontes consultadas).<\/li>\n<\/ul>\n<h2 id=\"3-conclusões-do-diagnóstico\">3. Conclusões do diagnóstico<\/h2>\n<ol>\n<li><strong>Não aprenda uma profissão nova — monte uma pilha sobre a que você já tem.<\/strong> Tráfego pago + produção de criativos com IA + edição de anúncio forma um perfil raro: alguém que <em>cria<\/em> o anúncio e <em>entende<\/em> por que ele performa.<\/li>\n<li><strong>O gargalo não é técnico, é comercial e de idioma.<\/strong> Por isso o plano coloca prospecção desde o Dia 3 e inglês aplicado a trabalho todos os dias.<\/li>\n<li><strong>A renda brasileira é a sua bolsa de estudos.<\/strong> Aumentar a MM no Brasil (vendendo \"tráfego + criativos\") paga as ferramentas e dá dados reais para os casos internacionais.<\/li>\n<li><strong>Mercado-ponte antes do mercado em inglês.<\/strong> Portugal e negócios brasileiros nos EUA pagam em moeda forte e falam português: primeiro dinheiro internacional com menos fricção.<\/li>\n<li><strong>Nicho único no inglês:<\/strong> marcas de e-commerce (DTC) e agências que precisam de volume de criativos. Um nicho, uma mensagem, um portfólio.<\/li>\n<\/ol>\n<h2 id=\"4-respostas-diretas\">4. Respostas diretas<\/h2>\n<h3 id=\"41-a-carreira-internacional-mais-indicada\">4.1 A carreira internacional mais indicada<\/h3>\n<p><strong>Especialista em criativos de performance com IA para e-commerce (AI Performance Creative Specialist)<\/strong> — você cria anúncios em vídeo e estáticos com IA + edição profissional, entregues em \"sprints\" para teste no Meta e no TikTok, e usa sua experiência de tráfego para planejar e analisar os testes. Começa como freelancer, evolui para micro-agência de criativos + tráfego.\nEstratégia alternativa: <strong>gestor de tráfego internacional com criativos inclusos<\/strong> (detalhes e gatilhos em <a href=\"#doc/estrategia\">01-ESTRATEGIA/estrategia.md<\/a>).<\/p>\n<h3 id=\"42-as-3-habilidades-prioritárias\">4.2 As 3 habilidades prioritárias<\/h3>\n<ol>\n<li><strong>Produção de criativos com IA<\/strong> (imagem → vídeo, consistência de produto, hero shots, UGC híbrido) — é o que tem demanda crescente.<\/li>\n<li><strong>Edição de anúncio de resposta direta no DaVinci Resolve<\/strong> (ritmo, ganchos, legendas, som, cor, formatos) — é o que transforma clipes de IA em anúncio vendável.<\/li>\n<li><strong>Inglês comercial + venda internacional<\/strong> (mensagens, Looms, calls, propostas, negociação) — é o multiplicador de tudo.<\/li>\n<\/ol>\n<p>A sua habilidade de tráfego não entra como \"aprender\" — entra como <strong>diferencial<\/strong>: framework de teste, métricas, relatório.<\/p>\n<h3 id=\"43-o-que-ignorar-temporariamente-e-por-quê\">4.3 O que ignorar temporariamente (e por quê)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Ignorar por agora<\/th>\n<th>Por quê<\/th>\n<th>Quando reavaliar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>After Effects<\/td>\n<td>O Fusion do DaVinci resolve o motion leve que anúncios pedem; AE é outra assinatura e outra curva<\/td>\n<td>Depois do Dia 180, se clientes pedirem motion avançado<\/td>\n<\/tr>\n<tr>\n<td>Programação / Claude Code como carreira<\/td>\n<td>Não é o seu produto. Use só para coisas pontuais (ex.: site estático do portfólio no Dia 41 e LP de teste no Dia 128)<\/td>\n<td>Se landing pages virarem pedido recorrente<\/td>\n<\/tr>\n<tr>\n<td>Agentes de IA e n8n avançado<\/td>\n<td>Automação só faz sentido com volume. Teste com prazo no Dia 130<\/td>\n<td>Quando lidar com &gt; 50 leads/semana<\/td>\n<\/tr>\n<tr>\n<td>Google Ads aprofundado<\/td>\n<td>Mantenha para clientes BR; não é o foco internacional<\/td>\n<td>Se a estratégia alternativa for ativada<\/td>\n<\/tr>\n<tr>\n<td>Edição de vídeos longos (YouTube)<\/td>\n<td>Mercado diferente, ticket e cliente diferentes<\/td>\n<td>Fase 181–360, se houver demanda<\/td>\n<\/tr>\n<tr>\n<td>Produto digital / curso próprio<\/td>\n<td>Exige audiência que você ainda não tem<\/td>\n<td>Depois de 12+ meses com casos<\/td>\n<\/tr>\n<tr>\n<td>Fiverr, Freelancer.com, várias plataformas ao mesmo tempo<\/td>\n<td>Dispersa esforço; taxas maiores<\/td>\n<td>Fiverr opcional no Mês 5 se Upwork não engrenar<\/td>\n<\/tr>\n<tr>\n<td>3D, animação de personagem, color grading de cinema<\/td>\n<td>Não é o que o mercado de anúncios de performance compra<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"5-riscos-do-plano-e-como-estão-tratados\">5. Riscos do plano e como estão tratados<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Risco<\/th>\n<th>Mitigação no plano<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Não conseguir cliente internacional em 90 dias<\/td>\n<td>Revisão trimestral (Dia 90) com árvore de decisão e estratégia alternativa<\/td>\n<\/tr>\n<tr>\n<td>Perder um cliente brasileiro<\/td>\n<td>Prospecção BR desde o Dia 3; meta de +1 cliente no Mês 1–2<\/td>\n<\/tr>\n<tr>\n<td>Burnout<\/td>\n<td>Domingo leve (máx. 2 h), Dia 91 de descanso total, Modo Mínimo, revisões semanais<\/td>\n<\/tr>\n<tr>\n<td>Ferramenta descontinuada/cara<\/td>\n<td>Fluxo \"multi-ferramenta\"; 1 assinatura por vez; teto de 15% da receita<\/td>\n<\/tr>\n<tr>\n<td>Problema fiscal<\/td>\n<td>Contador especializado no Dia 148 (antes, se a receita externa começar antes)<\/td>\n<\/tr>\n<tr>\n<td>Problema legal com IA<\/td>\n<td>Política de IA (Dia 156), regras de transparência no portfólio desde o Dia 6<\/td>\n<\/tr>\n<tr>\n<td>Inglês travar vendas<\/td>\n<td>Mercado-ponte em português + comunicação escrita + Looms gravados (dá para regravar)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, "pesquisa": {"title": "Pesquisa de mercado", "group": "Estratégia", "html": "<blockquote>\n<p><strong>Como ler este documento:<\/strong> cada informação está marcada como\n<strong>[FATO]<\/strong> = dado publicado por fonte primária (empresa, governo, lei) ·\n<strong>[DADO DE PLATAFORMA]<\/strong> = número divulgado pela própria plataforma (real, mas com interesse comercial) ·\n<strong>[SECUNDÁRIO]<\/strong> = blog/comparador, útil como referência, pode estar desatualizado ·\n<strong>[ESTIMATIVA]<\/strong> = minha estimativa a partir dos dados acima.\nPesquisa feita em 07/11/2026. Preços de ferramentas e regras mudam — confira no site oficial antes de pagar.<\/p>\n<\/blockquote>\n<h2 id=\"1-demanda-por-vídeo-com-ia-e-edição\">1. Demanda por vídeo com IA e edição<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Informação<\/th>\n<th>Tipo<\/th>\n<th>Fonte<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"AI Video Generation &amp; Editing\" cresceu <strong>+329%<\/strong> (2025 vs. 2024), a maior alta entre as habilidades de IA do Upwork; IA em geral +109%. Medido por ganhos de freelancers nos EUA.<\/td>\n<td>[DADO DE PLATAFORMA]<\/td>\n<td><a href=\"https://www.upwork.com/press/releases/upworks-in-demand-skills-2026-demand-for-top-ai-skills-more-than-doubles-as-ai-is-embedded-into-everyday-work\" target=\"_blank\" rel=\"noopener\">Upwork — In-Demand Skills 2026<\/a> · <a href=\"https://upwork.com/research/in-demand-skills-2026\" target=\"_blank\" rel=\"noopener\">relatório<\/a><\/td>\n<\/tr>\n<tr>\n<td>O Upwork afirma que ferramentas de imagem/vídeo com IA <strong>não reduziram<\/strong> a demanda por edição de vídeo, edição de imagem ou ilustração.<\/td>\n<td>[DADO DE PLATAFORMA]<\/td>\n<td>mesmas fontes<\/td>\n<\/tr>\n<tr>\n<td>Fiverr reporta altas em \"AI video &amp; animation\" e em <strong>\"AI UGC video ads\"<\/strong>, e diz que empresas combinam vídeo com IA com <strong>mais<\/strong> edição humana. Os percentuais variam entre páginas do Fiverr.<\/td>\n<td>[DADO DE PLATAFORMA]<\/td>\n<td><a href=\"https://www.fiverr.com/resources/guides/reports/business-trends-index-june-2026\" target=\"_blank\" rel=\"noopener\">Fiverr Business Trends Index (jun/2026)<\/a> · <a href=\"https://www.fiverr.com/resources/guides/reports/freelancing-and-future-of-work-statistics\" target=\"_blank\" rel=\"noopener\">Fiverr — Freelancing statistics<\/a><\/td>\n<\/tr>\n<tr>\n<td>No Meta, especialistas convergem: depois do Andromeda, <strong>diversidade de conceitos<\/strong> pesa mais que variações quase iguais; isso aumenta a necessidade de produção de criativos.<\/td>\n<td>[SECUNDÁRIO] (consenso de especialistas; números específicos não confirmados pela Meta)<\/td>\n<td><a href=\"https://www.jonloomer.com/meta-andromeda-creative-diversification/\" target=\"_blank\" rel=\"noopener\">Jon Loomer — creative diversification<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Conclusão [ESTIMATIVA]:<\/strong> existe demanda crescente e mensurável por quem combina IA + edição + entendimento de performance. A demanda é maior do que a oferta de <strong>qualidade<\/strong>, mas a oferta de baixa qualidade e baixo preço também cresce rápido — por isso o posicionamento precisa ser \"criativo de performance\", não \"vídeo com IA barato\".<\/p>\n<h2 id=\"2-faixas-de-preço-praticadas-referência-não-garantia\">2. Faixas de preço praticadas (referência, não garantia)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Serviço<\/th>\n<th>Faixa encontrada<\/th>\n<th>Tipo<\/th>\n<th>Fonte<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Edição de vídeo freelance (geral, EUA)<\/td>\n<td>~US$ 20–75/h típico; sênior US$ 100–150+/h<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://www.cutjamm.com/blog/video-editing-rates\" target=\"_blank\" rel=\"noopener\">CutJamm<\/a> · <a href=\"https://pixflow.net/blog/freelance-video-editing-rates/\" target=\"_blank\" rel=\"noopener\">Pixflow<\/a><\/td>\n<\/tr>\n<tr>\n<td>Edição short-form básica no Upwork<\/td>\n<td>~US$ 15–40/h<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://www.cutjamm.com/blog/video-editing-rates\" target=\"_blank\" rel=\"noopener\">CutJamm<\/a><\/td>\n<\/tr>\n<tr>\n<td>Vídeo curto para redes/anúncio (por peça)<\/td>\n<td>~US$ 20–300 por vídeo (ads: até US$ 150–1.000 em fontes mais antigas)<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://adsnipper.com/blog/video-editing-cost/\" target=\"_blank\" rel=\"noopener\">AdSnipper<\/a> · <a href=\"https://pixflow.net/blog/freelance-video-editing-rates/\" target=\"_blank\" rel=\"noopener\">Pixflow<\/a><\/td>\n<\/tr>\n<tr>\n<td>Editores offshore<\/td>\n<td>~US$ 8–40/h (pressiona preços de volume)<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://floowitalent.com/tips/video-editor-hourly-rate\" target=\"_blank\" rel=\"noopener\">Floowi<\/a><\/td>\n<\/tr>\n<tr>\n<td>Gestor de Meta Ads freelancer (Upwork)<\/td>\n<td>US$ 15–40/h, mediana ~US$ 25; vagas vistas a US$ 10–45/h<\/td>\n<td>[SECUNDÁRIO] + vagas reais<\/td>\n<td><a href=\"https://superscale.ai/learn/meta-ads-management-cost/\" target=\"_blank\" rel=\"noopener\">Superscale<\/a> · <a href=\"https://www.upwork.com/jobs/~022066307282889099942\" target=\"_blank\" rel=\"noopener\">vaga Upwork<\/a><\/td>\n<\/tr>\n<tr>\n<td>Agência de Meta Ads (América do Norte)<\/td>\n<td>US$ 100–149/h<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://superscale.ai/learn/meta-ads-management-cost/\" target=\"_blank\" rel=\"noopener\">Superscale<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Leitura [ESTIMATIVA]:<\/strong> um iniciante internacional sem avaliações costuma entrar na faixa de US$ 20–30/h ou US$ 50–150 por anúncio. Com casos e nicho, US$ 800–1.500/mês por cliente em pacote recorrente é uma meta plausível para o fim do plano — não garantida.<\/p>\n<h2 id=\"3-comparação-das-carreiras-avaliadas\">3. Comparação das carreiras avaliadas<\/h2>\n<p>Notas de 1 (ruim) a 5 (ótimo). <strong>Todas as notas são [ESTIMATIVA]<\/strong> baseadas nos dados acima e no seu ponto de partida.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Opção<\/th>\n<th>Demanda<\/th>\n<th>Concorrência (5 = pouca)<\/th>\n<th>Facilidade de entrada p/ você<\/th>\n<th>Potencial de faturamento<\/th>\n<th>Tempo para nível comercial<\/th>\n<th>Total<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gestor de tráfego internacional<\/td>\n<td>4<\/td>\n<td>2<\/td>\n<td>3 (exige confiança + calls em inglês)<\/td>\n<td>4<\/td>\n<td>1–2 meses (já sabe; falta inglês)<\/td>\n<td>13<\/td>\n<\/tr>\n<tr>\n<td>Editor de vídeos publicitários<\/td>\n<td>4<\/td>\n<td>1 (muito saturado, offshore)<\/td>\n<td>4<\/td>\n<td>2<\/td>\n<td>2–3 meses<\/td>\n<td>11<\/td>\n<\/tr>\n<tr>\n<td>Especialista em vídeos comerciais com IA<\/td>\n<td>5<\/td>\n<td>3<\/td>\n<td>4<\/td>\n<td>4<\/td>\n<td>1–3 meses<\/td>\n<td>16<\/td>\n<\/tr>\n<tr>\n<td>Criador de anúncios com IA para e-commerce<\/td>\n<td>5<\/td>\n<td>3<\/td>\n<td>4<\/td>\n<td>4<\/td>\n<td>2–3 meses<\/td>\n<td>16<\/td>\n<\/tr>\n<tr>\n<td>Especialista em criativos para Meta Ads (creative strategist)<\/td>\n<td>4<\/td>\n<td>3<\/td>\n<td>3 (estratégia em inglês)<\/td>\n<td>5<\/td>\n<td>3–6 meses<\/td>\n<td>15<\/td>\n<\/tr>\n<tr>\n<td>Agência de criativos + tráfego<\/td>\n<td>4<\/td>\n<td>3<\/td>\n<td>2 (vendas + operação)<\/td>\n<td>5<\/td>\n<td>6–12 meses<\/td>\n<td>14<\/td>\n<\/tr>\n<tr>\n<td>Audiovisual genérico para empresas estrangeiras<\/td>\n<td>3<\/td>\n<td>1<\/td>\n<td>2 (muito amplo)<\/td>\n<td>3<\/td>\n<td>4–6 meses<\/td>\n<td>9<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Decisão:<\/strong> combinar as três melhores (vídeo com IA + anúncios para e-commerce + pensamento de creative strategist) numa oferta só, usando o tráfego como diferencial, e deixar a agência como evolução natural. Detalhes em <a href=\"#doc/estrategia\">01-ESTRATEGIA/estrategia.md<\/a>.<\/p>\n<h2 id=\"4-serviços-que-um-brasileiro-pode-vender-para-empresas-estrangeiras-com-entrada-possível-em-até-6-meses\">4. Serviços que um brasileiro pode vender para empresas estrangeiras (com entrada possível em até 6 meses)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Serviço<\/th>\n<th>Entrada em 6 meses?<\/th>\n<th>Observação<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pacotes de anúncios em vídeo com IA + edição (sprints mensais)<\/td>\n<td>Sim<\/td>\n<td>Núcleo da estratégia<\/td>\n<\/tr>\n<tr>\n<td>Variações de gancho / iterações de anúncios vencedores<\/td>\n<td>Sim<\/td>\n<td>Venda de entrada (barata de produzir, fácil de comprar)<\/td>\n<\/tr>\n<tr>\n<td>Anúncios estáticos com IA<\/td>\n<td>Sim<\/td>\n<td>Complemento de pacote<\/td>\n<\/tr>\n<tr>\n<td>Localização de anúncios (EN/ES/PT)<\/td>\n<td>Sim<\/td>\n<td>Upsell natural para quem é brasileiro<\/td>\n<\/tr>\n<tr>\n<td>Edição white-label para agências<\/td>\n<td>Sim<\/td>\n<td>Canal recorrente; comunicação mais escrita<\/td>\n<\/tr>\n<tr>\n<td>Gestão de Meta Ads<\/td>\n<td>Sim, com ressalvas<\/td>\n<td>Exige confiança e acesso à conta; melhor como estratégia alternativa ou add-on<\/td>\n<\/tr>\n<tr>\n<td>Landing pages<\/td>\n<td>Talvez<\/td>\n<td>Testado com prazo no Dia 128<\/td>\n<\/tr>\n<tr>\n<td>Automação (n8n) / agentes<\/td>\n<td>Não como foco<\/td>\n<td>Precisa de outra pilha de habilidades<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"5-ferramentas--situação-atual-resumo-tabela-completa-em-06-ferramentas\">5. Ferramentas — situação atual (resumo; tabela completa em <a href=\"#doc/ferramentas\">06-FERRAMENTAS<\/a>)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Informação<\/th>\n<th>Tipo<\/th>\n<th>Fonte<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Sora foi descontinuado<\/strong>: anúncio em 24/03/2026; app encerrado em 26/04/2026; API em 24/09/2026.<\/td>\n<td>[FATO] (imprensa)<\/td>\n<td><a href=\"https://the-decoder.com/openai-sets-two-stage-sora-shutdown-with-app-closing-april-2026-and-api-following-in-september/\" target=\"_blank\" rel=\"noopener\">The Decoder<\/a> · <a href=\"https://engadget.com/ai/openai-is-shutting-down-its-sora-video-generation-app-211023358.html\" target=\"_blank\" rel=\"noopener\">Engadget<\/a><\/td>\n<\/tr>\n<tr>\n<td>Google AI Pro (EUA): US$ 19,99/mês com ~1.000 créditos/mês do Flow; Veo 3.1 Lite ~10 créditos, Fast ~20, Quality ~100 por geração; ~50 créditos grátis/dia para não assinantes (resolução menor). Preço em reais varia por região.<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://costgoat.com/pricing/google-flow\" target=\"_blank\" rel=\"noopener\">CostGoat<\/a> · <a href=\"https://toyboxai.io/blog/veo-3-pricing/\" target=\"_blank\" rel=\"noopener\">ToyboxAI<\/a><\/td>\n<\/tr>\n<tr>\n<td>Kling: créditos grátis diários (com marca d'água, uso não comercial); planos pagos a partir de ~US$ 7–10/mês; Kling 3.0 cobra por segundo. Valores divergem entre fontes.<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://eesel.ai/blog/kling-ai-pricing\" target=\"_blank\" rel=\"noopener\">eesel<\/a> · <a href=\"https://www.heygen.com/blog/kling-ai-pricing\" target=\"_blank\" rel=\"noopener\">HeyGen blog<\/a><\/td>\n<\/tr>\n<tr>\n<td>Runway: grátis com 125 créditos únicos; Standard ~US$ 15/mês; Pro ~US$ 35; Max ~US$ 95.<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://rangy.ai/blog/ai-video-generators-compared-2026/\" target=\"_blank\" rel=\"noopener\">Rangy<\/a><\/td>\n<\/tr>\n<tr>\n<td>Higgsfield (agregador de vários modelos): planos ~US$ 15–129/mês, mudam com frequência e por país.<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://pricingsaas.com/companies/higgsfield\" target=\"_blank\" rel=\"noopener\">PricingSaaS<\/a><\/td>\n<\/tr>\n<tr>\n<td>Seedance 2.0 (ByteDance): acesso internacional via Dreamina; planos pagos ~US$ 18–84/mês (fonte concorrente).<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://dreamina.capcut.com/seedance/seedance-2-0-pricing\" target=\"_blank\" rel=\"noopener\">Dreamina<\/a> · <a href=\"https://www.atlabs.ai/blog/higgsfield-vs-atlabs-vs-dreamina-where-should-you-actually-run-seedance-2.0-in-2026\" target=\"_blank\" rel=\"noopener\">Atlabs<\/a><\/td>\n<\/tr>\n<tr>\n<td>DaVinci Resolve: versão grátis profissional (exporta até UHD, sem marca d'água); Studio ~US$ 295 compra única.<\/td>\n<td>[SECUNDÁRIO] (consistente entre fontes)<\/td>\n<td><a href=\"https://fluxnote.io/guides/davinci-resolve-pricing-guide-2026\" target=\"_blank\" rel=\"noopener\">Fluxnote<\/a> · <a href=\"https://www.miracamp.com/learn/davinci-resolve/davinci-resolve-pricing\" target=\"_blank\" rel=\"noopener\">Miracamp<\/a><\/td>\n<\/tr>\n<tr>\n<td>CapCut: plano grátis restringe uso comercial nos termos; preço do Pro varia por região (US$ 8–20/mês nas fontes).<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://eesel.ai/blog/capcut-pricing\" target=\"_blank\" rel=\"noopener\">eesel<\/a> · <a href=\"https://fluxnote.io/guides/capcut-questions-answered\" target=\"_blank\" rel=\"noopener\">Fluxnote<\/a><\/td>\n<\/tr>\n<tr>\n<td>ElevenLabs: grátis sem licença comercial; Starter ~US$ 6/mês com licença comercial; Creator ~US$ 22/mês.<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://dupple.com/pricing/elevenlabs\" target=\"_blank\" rel=\"noopener\">Dupple<\/a> · <a href=\"https://bigvu.tv/blog/elevenlabs-pricing-2026-plans-credits-commercial-rights-api-costs/\" target=\"_blank\" rel=\"noopener\">BIGVU<\/a><\/td>\n<\/tr>\n<tr>\n<td>Midjourney: sem plano grátis; Basic ~US$ 10/mês.<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://dupple.com/learn/is-midjourney-free\" target=\"_blank\" rel=\"noopener\">Dupple<\/a><\/td>\n<\/tr>\n<tr>\n<td>n8n: Community Edition grátis (self-hosted); nuvem Starter ~€ 20–24/mês.<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://sliplane.io/blog/n8n-pricing\" target=\"_blank\" rel=\"noopener\">Sliplane<\/a> · <a href=\"https://toolradar.com/blog/n8n-pricing-2026\" target=\"_blank\" rel=\"noopener\">Toolradar<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"6-plataformas-de-freelance\">6. Plataformas de freelance<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Plataforma<\/th>\n<th>Custo para o freelancer<\/th>\n<th>Tipo<\/th>\n<th>Fonte<\/th>\n<th>Avaliação para você<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Upwork<\/td>\n<td>Taxa variável de 0–15% por contrato (desde 01/05/2025); 10 Connects grátis/mês; extra ~US$ 0,15 cada<\/td>\n<td>[DADO DE PLATAFORMA] + [SECUNDÁRIO]<\/td>\n<td><a href=\"https://www.upwork.com/resources/is-upwork-free\" target=\"_blank\" rel=\"noopener\">Upwork<\/a> · <a href=\"https://golance.com/blogs/upwork-fees-explained-2026\" target=\"_blank\" rel=\"noopener\">GoLance<\/a><\/td>\n<td><strong>Usar<\/strong> — maior volume de vagas de vídeo/IA; proteção de pagamento<\/td>\n<\/tr>\n<tr>\n<td>Fiverr<\/td>\n<td>20% sobre o pedido<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://hireinsouth.com/post/fiverr-pricing\" target=\"_blank\" rel=\"noopener\">HireInSouth<\/a><\/td>\n<td><strong>Opcional depois<\/strong> — taxa alta, guerra de preço; serve para \"gigs\" de entrada<\/td>\n<\/tr>\n<tr>\n<td>Contra<\/td>\n<td>0% de comissão para o freelancer (cliente paga taxa)<\/td>\n<td>[SECUNDÁRIO] (blog da própria Contra)<\/td>\n<td><a href=\"https://contra.com/blog/contra-vs-fiverr-what-s-the-difference\" target=\"_blank\" rel=\"noopener\">Contra<\/a><\/td>\n<td><strong>Usar como portfólio<\/strong> + vitrine; volume menor<\/td>\n<\/tr>\n<tr>\n<td>LinkedIn<\/td>\n<td>Grátis (Premium opcional)<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td><strong>Usar<\/strong> — prospecção direta, conteúdo, agências<\/td>\n<\/tr>\n<tr>\n<td>Prospecção direta (e-mail/Loom)<\/td>\n<td>Custo de domínio/e-mail<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td><strong>Canal principal<\/strong> a partir do Mês 3 — sem taxa e com ticket maior<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"7-câmbio-impostos-e-regras-resumo-detalhe-em-07-financeiro\">7. Câmbio, impostos e regras (resumo; detalhe em <a href=\"#doc/financeiro\">07-FINANCEIRO<\/a>)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Informação<\/th>\n<th>Tipo<\/th>\n<th>Fonte<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dólar comercial fechou a ~R$ 5,51 em 06/11/2026; euro ~R$ 6,13–6,16 em 05/11/2026<\/td>\n<td>[FATO] (imprensa)<\/td>\n<td><a href=\"https://infomoney.com.br/mercados/ibovespa-hoje-bolsa-de-valores-ao-vivo-06112026\" target=\"_blank\" rel=\"noopener\">InfoMoney<\/a> · <a href=\"https://diariodosudoeste.com.br/ibovespa-sobe-139-e-tem-semana-de-alta-dolar-a-r-551\" target=\"_blank\" rel=\"noopener\">Diário do Sudoeste<\/a> · <a href=\"https://www.bonitoinforma.com.br/economia/cotacao-do-dia-dolar-fecha-em-alta-a-r-5-50/1001633/\" target=\"_blank\" rel=\"noopener\">Bonito Informa<\/a><\/td>\n<\/tr>\n<tr>\n<td>Exportação de serviços: não incidência de ISS (LC 116/2003, art. 2º, I) quando o resultado ocorre no exterior; no Simples, PIS/Cofins não incidem na receita de exportação com entrada de divisas<\/td>\n<td>[SECUNDÁRIO] citando lei<\/td>\n<td><a href=\"https://agilize.com.br/blog/gestao-contabil-e-fiscal/exportacao-de-servicos/\" target=\"_blank\" rel=\"noopener\">Agilize<\/a> · <a href=\"https://www.contabilizei.com.br/contabilidade-online/tributacao-sobre-exportacao-de-servicos-o-que-e-e-quais-os-impostos-incidem/\" target=\"_blank\" rel=\"noopener\">Contabilizei<\/a><\/td>\n<\/tr>\n<tr>\n<td>Gestor de tráfego <strong>não<\/strong> pode ser MEI; \"editor(a) de vídeo independente\" consta como ocupação permitida (fontes divergem sobre o alcance)<\/td>\n<td>[SECUNDÁRIO]<\/td>\n<td><a href=\"https://contabileasy.com.br/gestor-de-trafego-mei-ou-me/\" target=\"_blank\" rel=\"noopener\">ContabilEasy<\/a> · <a href=\"https://qipu.com.br/mei/profissoes/editor-de-video/\" target=\"_blank\" rel=\"noopener\">Qipu<\/a><\/td>\n<\/tr>\n<tr>\n<td>EU AI Act, art. 50 (transparência e rotulagem de deepfakes) aplicável desde 02/08/2026<\/td>\n<td>[FATO] (lei da UE; guias jurídicos)<\/td>\n<td><a href=\"https://artificialintelligenceact.eu/transparency-rules-article-50/\" target=\"_blank\" rel=\"noopener\">AI Act — guia art. 50<\/a> · <a href=\"https://connectontech.bakermckenzie.com/new-eu-guidance-on-ai-transparency-what-should-companies-be-doing-from-2-august-2026\" target=\"_blank\" rel=\"noopener\">Baker McKenzie<\/a><\/td>\n<\/tr>\n<tr>\n<td>Meta exige declarar conteúdo realista criado/alterado digitalmente em anúncios de temas sociais, eleitorais e políticos<\/td>\n<td>[FATO] (política da Meta, cobertura de imprensa)<\/td>\n<td><a href=\"https://www.socialmediatoday.com/news/metas-new-disclosure-requirements-digitally-altered-ad-content/704266/\" target=\"_blank\" rel=\"noopener\">Social Media Today<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"8-o-que-eu-não-consegui-confirmar-e-você-deve-checar\">8. O que eu <strong>não<\/strong> consegui confirmar (e você deve checar)<\/h2>\n<ul>\n<li>Preço em <strong>reais<\/strong> do Google AI Pro e de outras assinaturas (preços regionais).<\/li>\n<li>Se a isenção de IR até R$ 5 mil (Lei 15.270/2025) se aplica do mesmo jeito a rendimentos do exterior no carnê-leão — fontes divergem.<\/li>\n<li>Alíquota de IOF na entrada de recursos do exterior (a maioria das fontes indica 0,38%, uma cita 1,1%).<\/li>\n<li>Data de início do ETIAS (autorização de viagem para a Europa) — estimada para o fim de 2026 ou 2027.<\/li>\n<li>Se o CNAE da MM está sujeito ao Fator R (fontes divergem para 7319-0/03).<\/li>\n<li>Regras do Acordo de Residência do Mercosul para cada país (não pesquisado em detalhe; confira nos consulados).<\/li>\n<\/ul>"}, "estrategia": {"title": "Estratégia de carreira", "group": "Estratégia", "html": "<h2 id=\"1-estratégia-principal--ai-performance-creative-specialist\">1. Estratégia principal — \"AI Performance Creative Specialist\"<\/h2>\n<p><strong>Em uma frase (PT):<\/strong> eu crio anúncios em vídeo e imagem com IA + edição profissional para marcas de e-commerce testarem no Meta e no TikTok — e uso minha experiência de gestor de tráfego para planejar e ler esses testes.<\/p>\n<p><strong>Em inglês (posicionamento):<\/strong><\/p>\n<blockquote>\n<p><em>I help e-commerce brands test more ad concepts every month — AI-powered video and static ads, edited for performance, built by someone who actually runs paid traffic.<\/em><\/p>\n<\/blockquote>\n<p><strong>Por que essa e não outra:<\/strong><\/p>\n<ul>\n<li><strong>Demanda comprovada e crescente<\/strong> (Upwork: +329% em vídeo com IA; Fiverr: alta em anúncios UGC com IA; Meta favorecendo diversidade de criativos).<\/li>\n<li><strong>Seu diferencial é real e difícil de copiar:<\/strong> a maioria dos \"artistas de IA\" não sabe o que é hook rate nem custo por resultado; a maioria dos gestores de tráfego não produz criativos. Você vai fazer os dois.<\/li>\n<li><strong>Compra recorrente:<\/strong> criativo \"cansa\" — marcas que anunciam precisam de novos conceitos todo mês. Isso permite pacote mensal (retainer), que é o que sustenta vida nômade.<\/li>\n<li><strong>Entrega 100% assíncrona:<\/strong> briefing escrito, entrega em pasta, feedback por comentário. O inglês falado deixa de ser bloqueio no começo.<\/li>\n<li><strong>Começa a pagar no Brasil já:<\/strong> o mesmo serviço vira o pacote \"tráfego +
