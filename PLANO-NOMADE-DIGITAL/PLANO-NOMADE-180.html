 criativos\" da MM.<\/li>\n<\/ul>\n<h3 id=\"11-para-quem-vender-icp\">1.1 Para quem vender (ICP)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Segmento<\/th>\n<th>Quem decide<\/th>\n<th>Sinais de que precisa<\/th>\n<th>Prioridade<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Marcas DTC<\/strong> (loja própria, muitas vezes Shopify) nos EUA, Reino Unido, Canadá, Austrália — beleza (sem alegações de saúde), pet, casa e cozinha, bebidas, acessórios<\/td>\n<td>Fundador, head of growth, performance marketer<\/td>\n<td>5–50 anúncios ativos na Ad Library; poucos conceitos; mesmo criativo rodando há meses; só estáticos ou só UGC<\/td>\n<td>Alta (Mês 3+)<\/td>\n<\/tr>\n<tr>\n<td><strong>Agências pequenas de paid social<\/strong> (2–10 pessoas) nos EUA/Reino Unido<\/td>\n<td>Fundador / diretor de criação<\/td>\n<td>Vagas de \"video editor\", portfólio fraco em vídeo, clientes e-commerce<\/td>\n<td>Alta (Mês 3+) — compra recorrente, comunicação escrita<\/td>\n<\/tr>\n<tr>\n<td><strong>Mercado-ponte<\/strong>: negócios em Portugal e negócios de brasileiros nos EUA (restaurantes, alojamento local, clínicas, imobiliárias, serviços)<\/td>\n<td>Dono<\/td>\n<td>Instagram ativo, anúncio fraco ou inexistente<\/td>\n<td>Alta (Mês 2) — sem barreira de idioma, paga em €/US$<\/td>\n<\/tr>\n<tr>\n<td><strong>Brasil (MM)<\/strong>: restaurantes, clínicas de estética, imobiliárias, academias, lojas em Goiânia<\/td>\n<td>Dono<\/td>\n<td>Anúncio fraco/repetido<\/td>\n<td>Base de renda (sempre)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Evite<\/strong> (risco regulatório ou reputacional alto para iniciante): suplementos com promessas de saúde, CBD, finanças/cripto, apostas, política, saúde com alegações médicas.<\/p>\n<h3 id=\"12-ofertas-e-preços-guia\">1.2 Ofertas e preços-guia<\/h3>\n<blockquote>\n<p>Preços-guia <strong>[ESTIMATIVA]<\/strong> para quem está começando, ancorados nas faixas de mercado da <a href=\"#doc/pesquisa\">pesquisa<\/a>. Ajuste depois de 3 vendas: se todo mundo aceita rápido, está barato; se ninguém aceita, revise valor percebido antes de baixar preço.<\/p>\n<\/blockquote>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Oferta<\/th>\n<th>O que inclui<\/th>\n<th>Prazo<\/th>\n<th>Preço de entrada<\/th>\n<th>Preço após casos/avaliações<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Pilot<\/strong> (porta de entrada)<\/td>\n<td>3 anúncios em vídeo de 15–30 s × 2 ganchos (6 arquivos), formatos 9:16 e 4:5, 1 rodada de revisão<\/td>\n<td>5 dias úteis<\/td>\n<td>US$ 250–400<\/td>\n<td>US$ 450–600<\/td>\n<\/tr>\n<tr>\n<td><strong>Creative Sprint<\/strong> (mensal)<\/td>\n<td>8–12 anúncios/mês (3–4 conceitos × variações), estáticos opcionais, relatório mensal de testes<\/td>\n<td>Entregas quinzenais<\/td>\n<td>US$ 800–1.200/mês<\/td>\n<td>US$ 1.500–2.500/mês<\/td>\n<\/tr>\n<tr>\n<td><strong>Sprint + Media<\/strong> (alternativa)<\/td>\n<td>Sprint + gestão das campanhas no Meta<\/td>\n<td>Mensal<\/td>\n<td>US$ 1.200–1.800/mês + verba do cliente<\/td>\n<td>US$ 2.000–3.000/mês<\/td>\n<\/tr>\n<tr>\n<td><strong>Hook pack<\/strong> (upsell)<\/td>\n<td>5 ganchos novos para um anúncio vencedor<\/td>\n<td>48 h<\/td>\n<td>US$ 100–150<\/td>\n<td>US$ 200<\/td>\n<\/tr>\n<tr>\n<td><strong>Localização<\/strong> (upsell)<\/td>\n<td>Mesmo anúncio em EN/ES/PT (voz + legenda)<\/td>\n<td>3 dias<\/td>\n<td>US$ 50–80 por versão<\/td>\n<td>US$ 100+<\/td>\n<\/tr>\n<tr>\n<td><strong>Mercado-ponte (Portugal/EUA, em português)<\/strong><\/td>\n<td>Tráfego + 4 criativos/mês para negócio local<\/td>\n<td>Mensal<\/td>\n<td>€ 300–600 / US$ 350–700<\/td>\n<td>€ 700+<\/td>\n<\/tr>\n<tr>\n<td><strong>MM Brasil<\/strong><\/td>\n<td>Pacote 1: tráfego · Pacote 2: tráfego + 4 criativos · Pacote 3: tráfego + 8 criativos<\/td>\n<td>Mensal<\/td>\n<td>Pacote 2 ≈ R$ 1.200–1.800 (vs. ~R$ 750 hoje)<\/td>\n<td>Reajuste anual<\/td>\n<\/tr>\n<tr>\n<td><strong>Upwork por hora<\/strong><\/td>\n<td>Quando o job for por hora<\/td>\n<td>—<\/td>\n<td>US$ 25/h<\/td>\n<td>+US$ 5 a cada 3 avaliações 5★<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Regras de preço:<\/strong><\/p>\n<ol>\n<li>Pagamento <strong>50% antes<\/strong> em clientes diretos (100% antes no Pilot de clientes novos). No Upwork, contrato com <em>milestone<\/em> financiado.<\/li>\n<li>Desconto só em troca de algo: escopo menor, prazo maior, pagamento antecipado, depoimento/caso autorizado.<\/li>\n<li>Custo de ferramentas por projeto ≤ 10–15% do preço.<\/li>\n<li>Suba preço para clientes <strong>novos<\/strong> quando: agenda &gt; 80% ocupada, ≥ 3 depoimentos, ou taxa de fechamento &gt; 40%.<\/li>\n<li>Converta (US$ 1 ≈ R$ 5,51 em 06/11/2026): US$ 400 ≈ R$ 2.200; US$ 1.000 ≈ R$ 5.500 — antes de impostos e taxas.<\/li>\n<\/ol>\n<h3 id=\"13-escada-de-valor\">1.3 Escada de valor<\/h3>\n<pre><code>Conteúdo grátis / Loom de diagnóstico / spec\n        ↓\nHook pack ou Pilot (pago, risco baixo)\n        ↓\nCreative Sprint mensal (recorrente)\n        ↓\nSprint + Media / Localização / Landing page (ticket maior)\n        ↓\nMicro-agência: você + 1–2 editores freelancers (fase 181–360+)\n<\/code><\/pre>\n<h2 id=\"2-estratégia-alternativa--gestor-de-tráfego-internacional-com-criativos-inclusos\">2. Estratégia alternativa — gestor de tráfego internacional com criativos inclusos<\/h2>\n<p><strong>O que é:<\/strong> vender gestão de Meta Ads (o que você já faz) para negócios fora do Brasil, com criativos com IA inclusos no pacote. Público: mercado-ponte (Portugal e negócios brasileiros nos EUA) e pequenos negócios locais em inglês (restaurantes, serviços, imobiliárias), além de white-label para agências.<\/p>\n<p><strong>Por que é a alternativa (e não a principal):<\/strong> exige mais confiança do cliente (acesso à conta e verba), mais calls ao vivo e responsabilidade por resultado — mais difícil com inglês em desenvolvimento e sem casos internacionais. Mas usa sua habilidade mais madura.<\/p>\n<h3 id=\"21-gatilhos-para-ativar-a-alternativa\">2.1 Gatilhos para ativar a alternativa<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Momento<\/th>\n<th>Situação<\/th>\n<th>Ação<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dia 90<\/td>\n<td>≥ 150 contatos em inglês/mês e <strong>zero<\/strong> respostas positivas<\/td>\n<td>Problema de mensagem/oferta: reescreva S03 e oferta; teste 2 semanas<\/td>\n<\/tr>\n<tr>\n<td>Dia 90<\/td>\n<td>Respostas positivas, mas ninguém compra criativo avulso; pedem \"quem cuide de tudo\"<\/td>\n<td><strong>Ative a alternativa<\/strong> (Sprint + Media)<\/td>\n<\/tr>\n<tr>\n<td>Dia 90<\/td>\n<td>Mercado-ponte responde muito mais que o inglês<\/td>\n<td>Dobre o mercado-ponte por 30 dias com a alternativa, mantendo 30% do tempo no inglês<\/td>\n<\/tr>\n<tr>\n<td>Dia 120<\/td>\n<td>Zero clientes internacionais pagos<\/td>\n<td><strong>Ative a alternativa<\/strong> + revise preço do Pilot (oferta de risco menor)<\/td>\n<\/tr>\n<tr>\n<td>Dia 120<\/td>\n<td>1–2 clientes de criativo, mas pouco recorrente<\/td>\n<td>Mantenha a principal; adicione \"Sprint + Media\" como upgrade<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"3-por-que-combinar-em-vez-de-aprender-várias-profissões\">3. Por que combinar em vez de aprender várias profissões<\/h2>\n<ol>\n<li><strong>Juros compostos de habilidade:<\/strong> cada hora de edição melhora seus anúncios com IA, que melhoram seus casos de tráfego, que melhoram suas vendas. Profissões separadas não se somam.<\/li>\n<li><strong>Um portfólio, uma mensagem, um cliente ideal:<\/strong> quem vende \"edição + tráfego + automação + landing page + IA\" parece não ser especialista em nada.<\/li>\n<li><strong>Tempo é o seu recurso mais escasso:<\/strong> 540 h em 6 meses dão nível comercial em uma pilha; divididas em cinco, dão nível iniciante em cinco.<\/li>\n<li><strong>Preço:<\/strong> especialista em \"anúncios com IA para e-commerce\" cobra mais que \"freelancer de vídeo\".<\/li>\n<li><strong>Renda recorrente:<\/strong> a pilha escolhida gera pacote mensal, que é o que permite liberdade geográfica.<\/li>\n<\/ol>\n<h2 id=\"4-papel-da-mm-durante-a-transição\">4. Papel da MM durante a transição<\/h2>\n<ul>\n<li><strong>Mês 1–6:<\/strong> a MM é sua base de renda e seu laboratório. Venda o pacote \"tráfego + criativos com IA\" no Brasil, teste criativos com IA em campanhas reais (com autorização) e transforme resultados em casos.<\/li>\n<li><strong>Marca internacional:<\/strong> \"MM Gestão de Tráfego\" não funciona fora do Brasil. Opções: (a) seu nome pessoal + especialidade (\"[Seu Nome] — AI Performance Creative\"), (b) \"MM Creative Studio\" ou similar, mantendo o \"MM\" por continuidade. Recomendo <strong>nome pessoal<\/strong> no LinkedIn/Upwork (freelancer vende confiança pessoal) e uma marca curta para o site se quiser evoluir para agência. Confira disponibilidade de domínio e marca antes de decidir.<\/li>\n<li><strong>Dia 178:<\/strong> decisão formal sobre o futuro da MM. Regra: <strong>não corte renda-base brasileira antes de atingir o Marco 3<\/strong> do <a href=\"#doc/financeiro\">plano financeiro<\/a>.<\/li>\n<\/ul>\n<h2 id=\"5-fases-resumo--detalhe-diário-em-02-cronograma\">5. Fases (resumo — detalhe diário em <a href=\"#cronograma\">02-CRONOGRAMA<\/a>)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Fase<\/th>\n<th>Dias<\/th>\n<th>Foco<\/th>\n<th>Resultado esperado<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Fundação<\/td>\n<td>1–30<\/td>\n<td>Editor, IA, anatomia de anúncio, MM vendendo criativos<\/td>\n<td>4 anúncios, LinkedIn EN, Contra, Caso 01<\/td>\n<\/tr>\n<tr>\n<td>2. Produção + mercado-ponte<\/td>\n<td>31–60<\/td>\n<td>Qualidade de entrega, Portugal/EUA em português, Upwork, contas<\/td>\n<td>8 anúncios, site, primeiros €/US$<\/td>\n<\/tr>\n<tr>\n<td>3. Nicho + inglês<\/td>\n<td>61–90<\/td>\n<td>DTC e agências, outbound em inglês, specs, Looms<\/td>\n<td>Primeiro piloto internacional<\/td>\n<\/tr>\n<tr>\n<td>4. Contratos + recorrência<\/td>\n<td>91–120<\/td>\n<td>Relatórios, estratégia criativa, retenção<\/td>\n<td>Primeiro retainer<\/td>\n<\/tr>\n<tr>\n<td>5. Escala + posicionamento<\/td>\n<td>121–150<\/td>\n<td>Agências, conteúdo, nicho, preço, fiscal<\/td>\n<td>US$ 500–1.000/mês (realista)<\/td>\n<\/tr>\n<tr>\n<td>6. Consolidação + prontidão<\/td>\n<td>151–180<\/td>\n<td>Ofertas fixas, SOPs, finanças, destinos<\/td>\n<td>Decisão de viagem com critério<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"6-o-que-significa-sucesso-no-dia-180\">6. O que significa \"sucesso\" no Dia 180<\/h2>\n<p>Não é estar viajando. É ter: (1) uma pilha de habilidades que o mercado compra, (2) portfólio profissional em inglês, (3) inglês funcional para trabalho, (4) experiência real de venda internacional, (5) uma fonte de renda internacional em construção, com números para decidir quando viajar.<\/p>"}, "portfolio": {"title": "Plano de portfólio", "group": "Execução", "html": "<h2 id=\"1-onde-publicar-e-por-quê\">1. Onde publicar (e por quê)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Canal<\/th>\n<th>Papel<\/th>\n<th>Custo<\/th>\n<th>Quando<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Site próprio<\/strong> (Framer grátis com subdomínio, Carrd, ou página estática feita com Claude Code no GitHub Pages)<\/td>\n<td>Endereço principal que vai em todo e-mail e proposta<\/td>\n<td>R$ 0 (domínio próprio opcional, ~US$ 10–15/ano)<\/td>\n<td>v1 no Dia 41<\/td>\n<\/tr>\n<tr>\n<td><strong>Contra<\/strong><\/td>\n<td>Portfólio + perfil de freelancer sem comissão para você<\/td>\n<td>Grátis<\/td>\n<td>v0 no Dia 26<\/td>\n<\/tr>\n<tr>\n<td><strong>LinkedIn (em inglês)<\/strong><\/td>\n<td>Prova social, conteúdo, prospecção; seção <em>Featured<\/em> com os 3 melhores trabalhos<\/td>\n<td>Grátis<\/td>\n<td>Dia 25<\/td>\n<\/tr>\n<tr>\n<td><strong>Upwork<\/strong><\/td>\n<td>Portfólio dentro da plataforma + Project Catalog<\/td>\n<td>Grátis (Connects para propor)<\/td>\n<td>Dia 39<\/td>\n<\/tr>\n<tr>\n<td><strong>YouTube (não listado) ou Vimeo<\/strong><\/td>\n<td>Hospedagem dos vídeos (o site só incorpora)<\/td>\n<td>Grátis<\/td>\n<td>Dia 6 em diante<\/td>\n<\/tr>\n<tr>\n<td><strong>Google Drive<\/strong><\/td>\n<td>Pasta de amostras para enviar em propostas (download rápido)<\/td>\n<td>Grátis<\/td>\n<td>Dia 1<\/td>\n<\/tr>\n<tr>\n<td>Behance<\/td>\n<td>Opcional — mais forte para design do que para performance<\/td>\n<td>Grátis<\/td>\n<td>Não prioritário<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"2-estrutura-do-site\">2. Estrutura do site<\/h2>\n<pre><code>HOME\n ├─ Hero: 1 frase de posicionamento + showreel (ou melhor anúncio) + botão &quot;Book a 15-min call&quot;\n ├─ Work (filtros): E-commerce · UGC/Hybrid · Local business &amp; Hospitality · Static ads\n ├─ Case studies (2–4): problema → processo → resultado (números)\n ├─ Services: Pilot · Creative Sprint · Add-ons (hooks, localization, statics)\n ├─ Process: research → concepts → production → testing → report\n ├─ About: sua história em 5 linhas (gestor de tráfego → criativos com IA), foto real\n ├─ AI Use Policy (a partir do Dia 156)\n └─ Contact: e-mail profissional + link de agendamento + LinkedIn\n<\/code><\/pre>\n<p><strong>Texto-modelo para o hero (ajuste com suas palavras):<\/strong><\/p>\n<blockquote>\n<p><strong>AI-powered ad creatives for e-commerce brands.<\/strong>\nMore concepts to test every month — video and static ads, edited for performance by someone who runs paid traffic.\n[See work] [Book a 15-min call]<\/p>\n<\/blockquote>\n<h2 id=\"3-como-organizar-cada-projeto-ficha-de-projeto\">3. Como organizar cada projeto (\"ficha de projeto\")<\/h2>\n<p>Cada peça no portfólio tem:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Campo<\/th>\n<th>Exemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Title<\/td>\n<td>\"Pawly — Creative Sprint sample (3 concepts × 2 hooks)\"<\/td>\n<\/tr>\n<tr>\n<td>Type<\/td>\n<td>Spec project · fictional brand <strong>ou<\/strong> Client work (com autorização)<\/td>\n<\/tr>\n<tr>\n<td>Brief<\/td>\n<td>\"Pet grooming brush brand needs fresh concepts for Meta and TikTok.\"<\/td>\n<\/tr>\n<tr>\n<td>Concept<\/td>\n<td>Problem-solution · Demo · \"3 reasons\"<\/td>\n<\/tr>\n<tr>\n<td>What's AI / what's real<\/td>\n<td>\"Product shots and B-roll generated with AI (Veo via Flow, Kling). Voiceover: AI voice. Edit, sound design and color: human (DaVinci Resolve).\"<\/td>\n<\/tr>\n<tr>\n<td>Formats<\/td>\n<td>9:16, 4:5<\/td>\n<\/tr>\n<tr>\n<td>Turnaround<\/td>\n<td>\"6 ads in 2 days\"<\/td>\n<\/tr>\n<tr>\n<td>Result<\/td>\n<td>Métrica real (se houver) <strong>ou<\/strong> \"Spec — not run with ad spend\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"4-como-apresentar-vídeos-feitos-com-ia-com-transparência\">4. Como apresentar vídeos feitos com IA com transparência<\/h2>\n<p>Regras do seu portfólio (e argumento de venda — transparência gera confiança):<\/p>\n<ol>\n<li><strong>Rotule sempre:<\/strong> \"AI-generated visuals + human editing\" ou \"Hybrid: real footage + AI B-roll\".<\/li>\n<li><strong>Spec com marca fictícia:<\/strong> \"Spec project — fictional brand, created for portfolio\".<\/li>\n<li><strong>Spec com marca real:<\/strong> só envie privado ao prospect. No portfólio público, <strong>só com autorização<\/strong> da marca; nunca dê a entender que foi contratado se não foi.<\/li>\n<li><strong>Nunca<\/strong> apresente pessoa gerada por IA como cliente real dando depoimento — nos EUA, a regra da FTC sobre avaliações e depoimentos (2024) proíbe depoimentos falsos, inclusive gerados por IA. Avatar de IA só como \"apresentador\", com aviso.<\/li>\n<li><strong>Não gere pessoas reais/famosas<\/strong> nem imite marca de terceiros.<\/li>\n<li><strong>Produto e imóvel reais não podem ser \"melhorados\" pela IA<\/strong> além do que são.<\/li>\n<li><strong>União Europeia:<\/strong> desde 02/08/2026, o art. 50 do EU AI Act exige que deepfakes (conteúdo que parece real e não é) sejam identificados ao público, com exceções para obras claramente artísticas/fictícias. Para clientes que anunciam na UE, inclua o aviso quando o conteúdo puder passar por real.<\/li>\n<li><strong>Plataformas de anúncio:<\/strong> a Meta exige declarar conteúdo realista criado/alterado digitalmente em anúncios de temas sociais, eleitorais e políticos; confira a política atual de cada plataforma para outros tipos de anúncio.<\/li>\n<\/ol>\n<h2 id=\"5-como-demonstrar-resultados-sem-clientes-internacionais\">5. Como demonstrar resultados sem clientes internacionais<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Fonte de prova<\/th>\n<th>Como gerar<\/th>\n<th>Quando<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Resultados dos clientes brasileiros<\/strong><\/td>\n<td>Estudo de caso com números (anonimizado se preciso), traduzido para inglês. Mercado diferente, mesma competência.<\/td>\n<td>Dia 19<\/td>\n<\/tr>\n<tr>\n<td><strong>Teste A/B real com criativo de IA<\/strong><\/td>\n<td>Criativo com IA rodando na campanha de um cliente BR vs. criativo atual.<\/td>\n<td>Dias 24–31, caso no Dia 53<\/td>\n<\/tr>\n<tr>\n<td><strong>Retenção orgânica<\/strong><\/td>\n<td>Postar anúncios como Reels/TikTok e medir retenção média e % que assistiu até o fim.<\/td>\n<td>A partir do Mês 2<\/td>\n<\/tr>\n<tr>\n<td><strong>Métricas de produção<\/strong><\/td>\n<td>\"6 ads in 48h\", \"15-s ad in 90 min\" — velocidade é valor para marcas.<\/td>\n<td>Dias 51, 86<\/td>\n<\/tr>\n<tr>\n<td><strong>Processo visível<\/strong><\/td>\n<td>Matriz de ângulos, storyboard, antes/depois. Mostra raciocínio.<\/td>\n<td>Dias 92, 116, 146<\/td>\n<\/tr>\n<tr>\n<td><strong>Depoimentos<\/strong><\/td>\n<td>Clientes BR (traduzidos, com autorização) e qualquer cliente internacional.<\/td>\n<td>Dias 110, 159<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"6-template-t02--estudo-de-caso\">6. Template T02 — estudo de caso<\/h2>\n<pre><code>TITLE: [Resultado em números] for [tipo de negócio] in [lugar]\n   ex.: &quot;38% lower cost per lead for a restaurant in Goiânia, Brazil&quot;\n\nCONTEXT (2–3 lines): who the client is, what they sell, where.\nCHALLENGE: the problem in numbers (CPA, few creatives, fatigue...).\nWHAT I DID: 3–5 bullets (research, concepts, production, testing setup).\nRESULTS: table with before/after (period, spend, results, CPA/ROAS, CTR, hook rate).\nWHAT I LEARNED: 1–2 insights you can apply to other brands.\nCREATIVES: thumbnails or embedded videos (labeled AI/real).\nCLIENT QUOTE: (if available, with permission)\n<\/code><\/pre>\n<p>Versão PT para clientes brasileiros: mesmo esqueleto. Sempre peça autorização (script S16, versão PT).<\/p>\n<h2 id=\"7-como-transformar-projetos-de-estudo-em-oportunidades-comerciais\">7. Como transformar projetos de estudo em oportunidades comerciais<\/h2>\n<ol>\n<li><strong>Toda peça de estudo nasce de um briefing realista<\/strong> (produto, oferta, público) — vira amostra de venda.<\/li>\n<li><strong>Specs para prospects reais<\/strong> (Dias 20, 40, 54, 69, 76, 83, 97, 104, 125...) são estudo <strong>e<\/strong> prospecção ao mesmo tempo.<\/li>\n<li><strong>Cada projeto vira conteúdo:<\/strong> bastidor no LinkedIn (\"how I made this\"), antes/depois, comparação de ganchos.<\/li>\n<li><strong>Cada projeto vira oferta:<\/strong> o \"Sample Sprint\" do Dia 62 é literalmente o produto que você vende.<\/li>\n<\/ol>\n<h2 id=\"8-marca-pessoal-internacional\">8. Marca pessoal internacional<\/h2>\n<ul>\n<li><strong>Nome:<\/strong> seu nome real + especialidade. Freelancer vende confiança; pessoas compram de pessoas.<\/li>\n<li><strong>Headline do LinkedIn (modelo):<\/strong> <code>AI-Powered Video Ads for E-commerce Brands | Performance Creative + Meta Ads | Brazil → Worldwide<\/code><\/li>\n<li><strong>About (estrutura):<\/strong> problema das marcas (fadiga de criativos) → como você resolve (IA + edição + tráfego) → prova (números) → como trabalhar com você (CTA).<\/li>\n<li><strong>Foto:<\/strong> real, luz de janela, fundo neutro. Não use foto gerada por IA que não pareça você.<\/li>\n<li><strong>Conteúdo (2 posts/semana a partir do Mês 4):<\/strong><ol>\n<li>Bastidor: \"How I made this AI ad in 90 minutes\"<\/li>\n<li>Comparação: \"Hook A vs. Hook B — which would you test?\"<\/li>\n<li>Teardown: análise de um anúncio famoso (o que funciona e por quê)<\/li>\n<li>Aprendizado de teste: \"What I learned testing AI creatives vs. UGC\"<\/li>\n<li>Processo: \"From customer reviews to 5 ad concepts\"<\/li>\n<li>História: sua trajetória (Mês 3 e Mês 6)<\/li>\n<\/ol>\n<\/li>\n<li><strong>Regra:<\/strong> cada post ensina algo. Zero post de \"motivação\".<\/li>\n<\/ul>\n<h2 id=\"9-versões-do-portfólio-e-checklist\">9. Versões do portfólio e checklist<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Versão<\/th>\n<th>Dia<\/th>\n<th>Conteúdo mínimo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>v0<\/td>\n<td>26<\/td>\n<td>Contra + LinkedIn EN, 4 anúncios, 1 caso<\/td>\n<\/tr>\n<tr>\n<td>v1<\/td>\n<td>41<\/td>\n<td>Site EN, 6–8 anúncios em 3 verticais, 1–2 casos, oferta Pilot<\/td>\n<\/tr>\n<tr>\n<td>v2<\/td>\n<td>88<\/td>\n<td>Seção E-commerce (sprint, estáticos, iterações), 2–3 casos, depoimentos BR<\/td>\n<\/tr>\n<tr>\n<td>v3<\/td>\n<td>149<\/td>\n<td>Página de nicho, TikTok/YouTube, narrativo 30 s, rascunho de showreel<\/td>\n<\/tr>\n<tr>\n<td>v4<\/td>\n<td>174<\/td>\n<td>Showreel final, 3 pacotes, página Results, política de IA, casos com números<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Checklist do portfólio final (Dia 174):<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:portfolio:1\"> Abre no celular em &lt; 3 s e o hero diz quem você ajuda e como.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:portfolio:2\"> Showreel de 45–60 s no topo.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:portfolio:3\"> Só trabalho que você venderia hoje (nada \"datado\").<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:portfolio:4\"> Toda peça com ficha e rótulo de IA.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:portfolio:5\"> ≥ 3 estudos de caso com números.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:portfolio:6\"> ≥ 3 depoimentos reais.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:portfolio:7\"> Preço \"a partir de\" ou pacotes claros.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:portfolio:8\"> Botão de agendamento funcionando (com fuso horário).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:portfolio:9\"> Política de uso de IA publicada.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:portfolio:10\"> Revisado por alguém de fora (idealmente falante nativo de inglês).<\/li>\n<\/ul>"}, "ingles": {"title": "Plano de inglês", "group": "Execução", "html": "<h2 id=\"objetivo\">Objetivo<\/h2>\n<p>Não é \"estudar inglês\". É conseguir, até o Dia 180:<\/p>\n<ul>\n<li>escrever e-mails, propostas e mensagens profissionais sem travar;<\/li>\n<li>gravar Looms e vídeos de apresentação explicando seu trabalho;<\/li>\n<li>conduzir uma call de descoberta e uma call de apresentação de resultados;<\/li>\n<li>negociar preço e escopo com educação e firmeza;<\/li>\n<li>entender tutoriais, cursos e clientes falando em velocidade normal.<\/li>\n<\/ul>\n<p><strong>Linha de base:<\/strong> EF SET no Dia 1. <strong>Reteste:<\/strong> EF SET no Dia 177. Além da nota, compare o pitch gravado na Semana 1 com o do Dia 177.<\/p>\n<h2 id=\"método-inglês-aplicado-ao-trabalho-todo-dia\">Método: inglês aplicado ao trabalho, todo dia<\/h2>\n<ul>\n<li><strong>30 min/dia<\/strong> no bloco de inglês (6 dias por semana) + <strong>30 min de conversa com humano<\/strong> no domingo.<\/li>\n<li><strong>Imersão dupla:<\/strong> os tutoriais técnicos (DaVinci, IA, anúncios) são vistos em inglês com legenda em inglês — é listening de verdade, com vocabulário de trabalho.<\/li>\n<li><strong>Tudo o que você escreve em inglês é real:<\/strong> fichas de projeto, posts, propostas, e-mails de prospecção. A partir do Mês 3, você usa inglês em situações reais todo dia (mensagens e Looms), além do bloco de 30 min.<\/li>\n<\/ul>\n<h3 id=\"exercício-de-cada-dia-da-semana\">Exercício de cada dia da semana<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dia<\/th>\n<th>Exercício (30 min)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Segunda<\/td>\n<td><strong>Shadowing<\/strong> (15 min) + <strong>vocabulário da semana<\/strong> em flashcards (15 min)<\/td>\n<\/tr>\n<tr>\n<td>Terça<\/td>\n<td><strong>Escrita<\/strong>: 8 frases sobre o seu trabalho com o vocabulário da semana → correção com IA (P-ING-1) → reescrita; <strong>pronúncia<\/strong> no YouGlish<\/td>\n<\/tr>\n<tr>\n<td>Quarta<\/td>\n<td><strong>Role-play por voz com IA<\/strong> (P-ING-2) no cenário da semana + revisão de erros<\/td>\n<\/tr>\n<tr>\n<td>Quinta<\/td>\n<td><strong>Mensagem profissional<\/strong> da semana (e-mail, proposta, post) → correção → Banco de Mensagens<\/td>\n<\/tr>\n<tr>\n<td>Sexta<\/td>\n<td><strong>Listening<\/strong> (vídeo da área) + <strong>resumo falado<\/strong> de 1 min gravado<\/td>\n<\/tr>\n<tr>\n<td>Sábado<\/td>\n<td><strong>Pitch em vídeo<\/strong> de 60–90 s sobre o projeto da semana (vira post/portfólio)<\/td>\n<\/tr>\n<tr>\n<td>Domingo<\/td>\n<td><strong>Conversa com humano<\/strong> (Tandem/HelloTalk grátis, ou Cambly/Preply pago se couber no orçamento)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Material de shadowing por fase: Semanas 1–8 BBC Learning English (\"English at Work\", \"6 Minute English\"); Semanas 9–17 vídeos de criativos de performance (Dara Denney, Motion); Semanas 18–26 calls de vendas e entrevistas de negócios em inglês.<\/p>\n<h2 id=\"prompts-de-ia-para-inglês\">Prompts de IA para inglês<\/h2>\n<p><strong>P-ING-1 — correção que ensina (cole depois do seu texto):<\/strong><\/p>\n<pre><code>You are my English coach. I'm a Brazilian freelancer who makes AI video ads for e-commerce brands.\n1) Correct my text below, keeping my meaning and a natural, professional but friendly tone (US English).\n2) Show a table: my phrase | corrected | why (short explanation in Portuguese).\n3) Give me 3 more natural alternatives for the most important sentence.\n4) List max 5 words/expressions I should memorize from this.\nText: &quot;&quot;&quot;[cole aqui]&quot;&quot;&quot;\n<\/code><\/pre>\n<p><strong>P-ING-2 — role-play por voz (ChatGPT Voice ou Gemini Live):<\/strong><\/p>\n<pre><code>Let's role-play. You are [persona: e.g., the founder of a US pet brand who is busy and skeptical].\nI am a freelance AI ad creative specialist. Scenario: [cenário da semana].\nRules: speak at natural speed, interrupt me sometimes, raise 1–2 objections.\nAfter 10 minutes, stop and give me feedback in Portuguese: 5 mistakes with corrections,\n3 phrases I should use next time, and a score from 1–10 for clarity and confidence.\n<\/code><\/pre>\n<p><strong>P-ING-3 — preparar uma call real:<\/strong><\/p>\n<pre><code>I have a call with [cargo] at [empresa], a [tipo de negócio] in [país]. Goal: [objetivo].\nGive me: 6 discovery questions, 3 likely objections with short answers I can say,\nand 5 phrases to ask for clarification politely if I don't understand something.\nKeep everything simple (B1–B2 level) but professional.\n<\/code><\/pre>\n<h2 id=\"frases-de-sobrevivência-inglês-ainda-em-evolução\">Frases de sobrevivência (inglês ainda em evolução)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Situação<\/th>\n<th>Em inglês<\/th>\n<th>Tradução<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Não entendeu<\/td>\n<td>\"Sorry, could you say that again a bit slower?\"<\/td>\n<td>Desculpe, pode repetir um pouco mais devagar?<\/td>\n<\/tr>\n<tr>\n<td>Confirmar entendimento<\/td>\n<td>\"Just to make sure I got it right: you need… correct?\"<\/td>\n<td>Só para confirmar: você precisa de… certo?<\/td>\n<\/tr>\n<tr>\n<td>Ganhar tempo<\/td>\n<td>\"Good question — let me think about that for a second.\"<\/td>\n<td>Boa pergunta — deixa eu pensar um segundo.<\/td>\n<\/tr>\n<tr>\n<td>Levar para o escrito<\/td>\n<td>\"I'll send you a written summary after the call so nothing gets lost.\"<\/td>\n<td>Vou te mandar um resumo por escrito depois da call para nada se perder.<\/td>\n<\/tr>\n<tr>\n<td>Admitir sotaque com confiança<\/td>\n<td>\"English is my second language, so I always confirm details in writing.\"<\/td>\n<td>Inglês é minha segunda língua, então sempre confirmo detalhes por escrito.<\/td>\n<\/tr>\n<tr>\n<td>Pedir para soletrar<\/td>\n<td>\"Could you spell that for me?\"<\/td>\n<td>Pode soletrar para mim?<\/td>\n<\/tr>\n<tr>\n<td>Encerrar com próximo passo<\/td>\n<td>\"So the next step is… Does [day] work for you?\"<\/td>\n<td>Então o próximo passo é… [dia] funciona para você?<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Mais frases para vendas e objeções em <a href=\"#doc/scripts\">05-PROSPECCAO/scripts-de-prospeccao.md<\/a> (S21).<\/p>\n<h2 id=\"recursos\">Recursos<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Recurso<\/th>\n<th>Para quê<\/th>\n<th>Custo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>EF SET (efset.org)<\/td>\n<td>Teste de nível (Dia 1 e Dia 177)<\/td>\n<td>Grátis<\/td>\n<\/tr>\n<tr>\n<td>BBC Learning English (\"English at Work\", \"6 Minute English\")<\/td>\n<td>Shadowing e listening<\/td>\n<td>Grátis<\/td>\n<\/tr>\n<tr>\n<td>VOA Learning English<\/td>\n<td>Listening mais lento, alternativo<\/td>\n<td>Grátis<\/td>\n<\/tr>\n<tr>\n<td>YouGlish<\/td>\n<td>Pronúncia real de palavras em vídeos<\/td>\n<td>Grátis<\/td>\n<\/tr>\n<tr>\n<td>ChatGPT Voice / Gemini Live<\/td>\n<td>Role-play e correção<\/td>\n<td>Planos grátis com limite (Gemini já incluso no Google AI Pro)<\/td>\n<\/tr>\n<tr>\n<td>Tandem / HelloTalk<\/td>\n<td>Conversa com nativos (troca de idiomas)<\/td>\n<td>Grátis (recursos pagos opcionais)<\/td>\n<\/tr>\n<tr>\n<td>Cambly / Preply<\/td>\n<td>Aula com professor<\/td>\n<td>Pago, preço varia por professor — opcional a partir do Mês 3<\/td>\n<\/tr>\n<tr>\n<td>Anki<\/td>\n<td>Flashcards com repetição espaçada<\/td>\n<td>Grátis (desktop/Android)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"indicadores-de-inglês-no-csv\">Indicadores de inglês (no CSV)<\/h2>\n<ul>\n<li>Minutos de inglês por dia (meta: ≥ 30 em 6 dias/semana).<\/li>\n<li>Pitches gravados (meta: 1/semana → 25 no plano).<\/li>\n<li>Conversas com humanos (meta: 1/semana).<\/li>\n<li>Calls reais em inglês (meta: ≥ 1 até o Dia 90; ≥ 8 no plano).<\/li>\n<li>Mensagens reais enviadas em inglês (vem do comercial).<\/li>\n<li>EF SET: Dia 1 × Dia 177.<\/li>\n<\/ul>\n<h2 id=\"os-26-temas-semanais\">Os 26 temas semanais<\/h2>\n<p>Cada semana tem um tema de trabalho; os exercícios diários usam o tema (o cronograma já traz a tarefa exata de cada dia).<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Sem.<\/th>\n<th>Dias<\/th>\n<th>Tema<\/th>\n<th>Vocabulário-chave<\/th>\n<th>Role-play (qua)<\/th>\n<th>Mensagem (qui)<\/th>\n<th>Pitch em vídeo (sáb)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>1–7<\/td>\n<td>Apresentar-se e explicar o que você faz<\/td>\n<td>ad campaign, ad spend, client, results, leads, budget, I help [businesses] to..., I specialize in...<\/td>\n<td>você conhece o dono de uma marca num evento online e explica em 60 s o que faz<\/td>\n<td>um pedido de conexão no LinkedIn (300 caracteres) para um dono de marca de e-commerce<\/td>\n<td>'Who I am and what I do' — quem você é, o que faz, para quem<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>8–14<\/td>\n<td>Descrever um processo passo a passo<\/td>\n<td>first, then, after that, finally, footage, cut, timeline, render, export, draft<\/td>\n<td>o cliente pergunta 'How do you make your videos?' — explique seu processo em 5 passos<\/td>\n<td>um e-mail curto enviando um rascunho e pedindo feedback (com prazo)<\/td>\n<td>'How I made Ad #1' — o processo do seu primeiro anúncio<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>15–21<\/td>\n<td>Números e métricas<\/td>\n<td>click-through rate, cost per acquisition, return on ad spend, increased by, dropped by, doubled, a 30% lift<\/td>\n<td>explique os resultados de uma campanha (números reais de um cliente seu) para um gestor americano<\/td>\n<td>um update semanal de resultados para um cliente (5 linhas: números, insight, próximo passo)<\/td>\n<td>o estudo de caso do seu cliente brasileiro em 60 s, com números<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>22–28<\/td>\n<td>Descrever visuais: luz, câmera e clima<\/td>\n<td>soft light, golden hour, close-up, wide shot, slow push-in, moody, vibrant, premium look<\/td>\n<td>descreva para um cliente o conceito visual de um anúncio antes de produzi-lo<\/td>\n<td>um resumo de conceito criativo (5 linhas) para aprovação do cliente<\/td>\n<td>tour pelo seu portfólio: 3 trabalhos e o porquê de cada escolha visual<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>29–35<\/td>\n<td>Fazer perguntas (descoberta)<\/td>\n<td>What's your main goal?, Who is your ideal customer?, What has worked before?, budget range, timeline, decision-maker<\/td>\n<td>call de descoberta com o dono de um restaurante em Lisboa que só fala inglês<\/td>\n<td>um follow-up educado para quem não respondeu sua primeira mensagem<\/td>\n<td>o anúncio de hotel que você produziu: objetivo, público, solução<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>36–42<\/td>\n<td>Ofertas e preços<\/td>\n<td>package, deliverables, turnaround time, revisions, flat fee, retainer, upfront payment<\/td>\n<td>o cliente pergunta 'How much do you charge?' — apresente 3 pacotes sem pedir desculpas<\/td>\n<td>uma proposta no Upwork (até 150 palavras) para um job de edição de anúncios<\/td>\n<td>sua oferta piloto: o que inclui, prazo, preço<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>43–49<\/td>\n<td>Feedback e revisões<\/td>\n<td>Could you clarify...?, I'd suggest..., Based on your feedback..., round of revisions, final version, minor tweaks<\/td>\n<td>o cliente pede mudanças demais fora do escopo — responda com educação e firmeza<\/td>\n<td>a entrega de um rascunho com 3 perguntas objetivas de feedback<\/td>\n<td>antes e depois: um anúncio que você refez e por quê<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>50–56<\/td>\n<td>Agenda, prazos e fusos horários<\/td>\n<td>EST/PST/GMT, Does Tuesday at 10am EST work?, deadline, ETA, reschedule, calendar invite<\/td>\n<td>marque uma call com um cliente de Nova York e um de Londres na mesma semana<\/td>\n<td>uma confirmação de reunião com agenda em 3 tópicos<\/td>\n<td>como você trabalha com clientes de outro fuso (processo, comunicação, prazos)<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>57–63<\/td>\n<td>Prospecção fria: proposta de valor<\/td>\n<td>I noticed that..., quick idea, worth a look?, no strings attached, creative fatigue, fresh angles<\/td>\n<td>elevator pitch de 30 s para um dono de marca DTC que diz 'I have 2 minutes'<\/td>\n<td>um cold e-mail (até 90 palavras) com 1 observação real do Ad Library da marca<\/td>\n<td>sua oferta para marcas de e-commerce em 45 s<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>64–70<\/td>\n<td>Apresentar ideias e recomendações<\/td>\n<td>I recommend..., because..., the idea is..., this angle targets..., we could test..., the hypothesis is...<\/td>\n<td>apresente 3 conceitos de anúncio para uma marca e recomende 1<\/td>\n<td>o roteiro (falado) de um Loom de 2 min analisando os anúncios de uma marca<\/td>\n<td>um teardown de 60 s de um anúncio famoso: o que funciona e por quê<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>71–77<\/td>\n<td>Lidar com objeções<\/td>\n<td>I understand, That's a fair point, What if we..., To be transparent..., low-risk pilot<\/td>\n<td>o cliente diz 'AI videos look fake' e 'We already have an in-house editor'<\/td>\n<td>uma resposta por e-mail à objeção 'your price is too high'<\/td>\n<td>por que vídeo com IA + edição humana + dados de tráfego é diferente<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>78–84<\/td>\n<td>Negociação<\/td>\n<td>Would you be open to...?, If we reduce the scope..., That works for me, meet halfway, non-negotiable<\/td>\n<td>negocie o preço de um piloto: o cliente quer 40% de desconto<\/td>\n<td>um e-mail de proposta com 2 opções de preço e prazo de validade<\/td>\n<td>o seu processo de trabalho em 4 etapas, com garantias claras<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>85–91<\/td>\n<td>Contar sua história (passado)<\/td>\n<td>I started..., I used to..., I realized..., over the last 3 months, since then, now I...<\/td>\n<td>o entrevistador de um podcast pergunta 'How did you get into AI ads?'<\/td>\n<td>um post de LinkedIn em inglês sobre seus primeiros 90 dias (150–200 palavras)<\/td>\n<td>sua história em 90 s: de gestor de tráfego no Brasil a criativos para marcas globais<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>92–98<\/td>\n<td>Kickoff e onboarding<\/td>\n<td>kickoff call, brief, assets, brand guidelines, point of contact, timeline, sign-off<\/td>\n<td>conduza a call de kickoff de um cliente novo (15 min) com agenda<\/td>\n<td>o e-mail de boas-vindas/onboarding pedindo os materiais (S22)<\/td>\n<td>o que um cliente recebe na primeira semana com você<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>99–105<\/td>\n<td>Relatórios: resultados, insights, próximos passos<\/td>\n<td>winning creative, underperformed, statistically, insight, next round of tests, iterate<\/td>\n<td>apresente um relatório mensal de criativos ao cliente (5 min)<\/td>\n<td>o resumo executivo (6 linhas) de um relatório de testes<\/td>\n<td>o relatório de testes que você criou: estrutura e decisões<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>106–112<\/td>\n<td>Resolver problemas e pedir desculpas<\/td>\n<td>I apologize for..., Here's what happened, Here's how I'll fix it, new ETA, it won't happen again<\/td>\n<td>você vai atrasar uma entrega em 24 h — avise o cliente por call<\/td>\n<td>um aviso de atraso profissional (S24)<\/td>\n<td>seu checklist de qualidade (QA) e por que ele evita retrabalho<\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>113–119<\/td>\n<td>Upsell e contratos recorrentes<\/td>\n<td>monthly retainer, ongoing, scale up, add-on, priority turnaround, long-term partnership<\/td>\n<td>proponha a um cliente piloto passar para um retainer mensal<\/td>\n<td>uma proposta de retainer com 2 níveis<\/td>\n<td>por que um pacote mensal de criativos dá mais resultado que pedidos avulsos<\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>120–126<\/td>\n<td>Small talk e relacionamento<\/td>\n<td>How's your week going?, Any plans for the weekend?, How's business?, I appreciate it, Thanks for the referral<\/td>\n<td>os 3 primeiros minutos de uma call (small talk) com um cliente americano<\/td>\n<td>um agradecimento + pedido de depoimento/indicação (S16)<\/td>\n<td>um 'day in the life' de 60 s do seu trabalho<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>127–133<\/td>\n<td>Parcerias com agências<\/td>\n<td>white-label, overflow work, capacity, turnaround, NDA, rate card, scalable<\/td>\n<td>pitch para o dono de uma agência que precisa de mais capacidade criativa<\/td>\n<td>o e-mail de parceria para agências (S09)<\/td>\n<td>como você trabalha como parceiro invisível de uma agência<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>134–140<\/td>\n<td>Defender ideias e discordar com educação<\/td>\n<td>I see your point, however..., The data suggests..., I'd push back on..., Let's test both<\/td>\n<td>o cliente quer um anúncio que você sabe que vai performar mal — proponha um teste<\/td>\n<td>uma recomendação escrita baseada em dados (com 2 opções)<\/td>\n<td>um aprendizado de teste que contraria o senso comum<\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td>141–147<\/td>\n<td>Conteúdo em inglês (marca pessoal)<\/td>\n<td>behind the scenes, breakdown, here's how I..., lesson learned, swipe this<\/td>\n<td>entrevista estilo podcast: 'What's the future of AI in advertising?'<\/td>\n<td>um post 'How I made this AI ad' (150 palavras)<\/td>\n<td>o breakdown de um dos seus anúncios em 60 s (vira post)<\/td>\n<\/tr>\n<tr>\n<td>22<\/td>\n<td>148–154<\/td>\n<td>Contratos, faturas e pagamentos<\/td>\n<td>invoice, net 15, due date, overdue, deposit, milestone, payment link, wire transfer<\/td>\n<td>cobrar com educação um pagamento atrasado há 10 dias<\/td>\n<td>o envio de fatura + lembrete de vencimento (S15)<\/td>\n<td>seus termos de trabalho: pagamento, revisões, prazos (claro e confiante)<\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>155–161<\/td>\n<td>Conduzir reuniões<\/td>\n<td>Let's get started, The agenda today is..., To recap..., Action items, Who owns this?, Let's wrap up<\/td>\n<td>conduza uma call semanal de 15 min com um cliente (agenda → resultados → próximos passos)<\/td>\n<td>o recap de reunião com action items<\/td>\n<td>como são suas reuniões semanais com clientes<\/td>\n<\/tr>\n<tr>\n<td>24<\/td>\n<td>162–168<\/td>\n<td>Call de vendas completa<\/td>\n<td>pain points, success looks like, Based on what you told me..., next steps, Does that sound fair?<\/td>\n<td>call de vendas completa de 20 min (descoberta → proposta → objeção → próximo passo)<\/td>\n<td>o follow-up pós-call com proposta (S12)<\/td>\n<td>seu pitch completo de 2 min (gravado como vídeo de apresentação)<\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>169–175<\/td>\n<td>Clientes difíceis e reclamações<\/td>\n<td>I hear you, Let me look into it, What would a good outcome look like?, As agreed in the scope...<\/td>\n<td>o cliente reclama que o anúncio 'não vendeu' após 3 dias<\/td>\n<td>resposta a uma reclamação com dados e plano de ação<\/td>\n<td>como você protege o resultado do cliente (processo de testes)<\/td>\n<\/tr>\n<tr>\n<td>26<\/td>\n<td>176–180<\/td>\n<td>Avaliação final e próximos objetivos<\/td>\n<td>over the past six months, my goal is..., I'm looking for..., I'd love to..., long-term<\/td>\n<td>'Tell me about your business and where it's going' (entrevista com investidor/parceiro)<\/td>\n<td>seu 'About' do LinkedIn reescrito com tudo o que você conquistou<\/td>\n<td>seu showreel narrado: quem você é, o que entrega, para quem<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, "prospeccao": {"title": "Estratégia de prospecção", "group": "Vendas", "html": "<h2 id=\"0-princípios\">0. Princípios<\/h2>\n<ol>\n<li><strong>Vender antes de estar pronto.<\/strong> Prospecção começa no Dia 3 (Brasil), Dia 33 (mercado-ponte) e Dia 64 (inglês).<\/li>\n<li><strong>Mostrar em vez de falar.<\/strong> Loom de diagnóstico e spec personalizado convertem mais do que \"I'm a video editor, let me know if you need anything\".<\/li>\n<li><strong>Uma observação real por mensagem.<\/strong> Se a frase serve para qualquer empresa, reescreva.<\/li>\n<li><strong>Volume com qualidade.<\/strong> Poucos contatos excelentes &gt; muitos genéricos. Meta: ~30–40 contatos personalizados em inglês por semana a partir do Mês 3.<\/li>\n<li><strong>Follow-up é onde está o dinheiro.<\/strong> A maioria das respostas vem depois do 1º ou 2º follow-up.<\/li>\n<li><strong>Não dependa de plataforma.<\/strong> Upwork é um canal, não o plano. O canal principal é a prospecção direta.<\/li>\n<\/ol>\n<h2 id=\"1-brasil--aumentar-a-mm-base-de-renda\">1. Brasil — aumentar a MM (base de renda)<\/h2>\n<p><strong>Oferta:<\/strong> \"Tráfego + criativos com IA\" (pacotes em <a href=\"#doc/estrategia/12-ofertas-e-preços-guia\">01-ESTRATEGIA<\/a>).<\/p>\n<p><strong>Segmentos em Goiânia (prioridade):<\/strong> restaurantes e delivery · clínicas de estética (cuidado com regras de publicidade de saúde) · imobiliárias e corretores · academias/estúdios · lojas de moda e acessórios.<\/p>\n<p><strong>Como montar a lista (Dia 3):<\/strong> Google Maps por bairro + Instagram + Meta Ad Library (país Brasil, busca pelo nome). Colunas: nome, segmento, bairro, Instagram, WhatsApp, seguidores, anúncios ativos (S/N), nº de criativos, observação específica, prioridade A/B/C.<\/p>\n<p><strong>Cadência BR:<\/strong> Dia 0 mensagem (S19) → Dia 2 follow-up curto → Dia 5 envia criativo-isca ou Loom → Dia 10 último contato. Canal: WhatsApp Business ou DM do Instagram (o que o negócio usa mais).<\/p>\n<p><strong>Clientes atuais (Dia 10, S20):<\/strong> revisão de resultados + oferta de criativos com IA + pedido de teste + pedido de autorização para estudo de caso + pedido de indicação.<\/p>\n<p><strong>Metas BR:<\/strong> Mês 1: ≥ 40 abordagens, ≥ 2 calls, ≥ 1 fechamento (upsell ou cliente). Mês 2: ≥ 25 abordagens e ≥ 1 fechamento. Meses 3–6: manutenção (≈ 45 min/semana) + indicações; meta de R$ 3.000–3.500/mês até o Mês 6 (realista, não garantido).<\/p>\n<h2 id=\"2-mercado-ponte--primeiro-dinheiro-em--e-us-em-português\">2. Mercado-ponte — primeiro dinheiro em € e US$ em português<\/h2>\n<p><strong>Por que funciona:<\/strong> sem barreira de idioma, você vende o que já sabe (tráfego + criativos), o cliente paga em moeda forte e você ganha casos \"internacionais\".<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mercado<\/th>\n<th>Onde<\/th>\n<th>Segmentos<\/th>\n<th>Observações<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Portugal<\/strong><\/td>\n<td>Lisboa, Porto, Algarve<\/td>\n<td>Restaurantes, alojamento local/guest houses, clínicas estéticas e dentárias, imobiliárias, ginásios<\/td>\n<td>Português de Portugal: \"telemóvel\", \"equipa\", \"marcação\", \"anúncios\"; trate pelo nome, tom cordial e mais formal; evite gírias<\/td>\n<\/tr>\n<tr>\n<td><strong>Negócios de brasileiros nos EUA<\/strong><\/td>\n<td>Orlando e Pompano Beach/Miami (FL), Boston/Framingham (MA), Newark (NJ)<\/td>\n<td>Restaurantes, salões/barbearias, limpeza e construção, imobiliárias, escolas de idiomas<\/td>\n<td>Muitos anunciam para a comunidade em português; pagam em US$<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Como achar:<\/strong> Google Maps (\"restaurante brasileiro Orlando\", \"clínica dentária Lisboa\"), Instagram (hashtags da comunidade), Meta Ad Library com filtro de país (Portugal / Estados Unidos).<\/p>\n<p><strong>Scripts:<\/strong> S17 (Portugal) e S18 (brasileiros nos EUA). <strong>Metas Mês 2:<\/strong> ≥ 40 abordagens, 5 Looms, 2 specs, ≥ 2 calls.<\/p>\n<h2 id=\"3-internacional-em-inglês--marcas-dtc-e-agências\">3. Internacional em inglês — marcas DTC e agências<\/h2>\n<h3 id=\"31-como-montar-a-lista-de-marcas-método-da-ad-library\">3.1 Como montar a lista de marcas (método da Ad Library)<\/h3>\n<ol>\n<li>Meta Ad Library → país: Estados Unidos (ou Reino Unido) → categoria \"Todos os anúncios\" → palavra-chave da categoria (\"dog brush\", \"vitamin c serum\", \"tumbler\", \"skincare\").<\/li>\n<li>Filtre \"Ativos\". Abra a página do anunciante: conte anúncios ativos, veja há quanto tempo rodam e quais formatos usam.<\/li>\n<li>Abra o site: é loja própria? (muitas usam Shopify) Qual a oferta principal?<\/li>\n<li>Encontre o decisor: fundador, \"Head of Growth\", \"Performance Marketing Manager\" (LinkedIn).<\/li>\n<li>E-mail: página de contato/sobre, Hunter (plano grátis ~50 créditos/mês) ou Apollo (plano grátis ~75 créditos/mês) — valores segundo fontes de 2026; confira.<\/li>\n<\/ol>\n<p><strong>Colunas da aba \"Leads INT\":<\/strong> marca · site · país · categoria · nº de anúncios ativos · formatos usados · observação específica · decisor · cargo · e-mail · LinkedIn · prioridade · estágio · última ação · próxima ação (data).<\/p>\n<p><strong>Observações que geram resposta (exemplos):<\/strong> \"only static ads running, no video\" · \"the same UGC video has been running since May\" · \"great product demos on the site, but none in the ads\" · \"running on Meta but not on TikTok\".<\/p>\n<h3 id=\"32-agências-canal-recorrente\">3.2 Agências (canal recorrente)<\/h3>\n<p>Clutch.co (filtros: paid social/social media marketing, 2–10 funcionários, EUA/Reino Unido) + LinkedIn (\"performance marketing agency founder\"). Sinais: vaga de editor, clientes e-commerce, portfólio fraco em vídeo. Pitch: S09. Oferta: white-label, prazo fixo, projeto-teste pequeno.<\/p>\n<h3 id=\"33-avaliação-dos-canais\">3.3 Avaliação dos canais<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Canal<\/th>\n<th>Vale a pena?<\/th>\n<th>Como usar<\/th>\n<th>Quando<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Cold e-mail + Loom<\/strong><\/td>\n<td><strong>Sim — canal principal<\/strong><\/td>\n<td>8–10 e-mails/dia útil de outbound; Loom para os leads A<\/td>\n<td>Mês 3+<\/td>\n<\/tr>\n<tr>\n<td><strong>LinkedIn<\/strong><\/td>\n<td><strong>Sim<\/strong><\/td>\n<td>Conexão sem pitch → mensagem com valor → conteúdo 2x/semana<\/td>\n<td>Mês 1 (perfil), Mês 3+ (ativo)<\/td>\n<\/tr>\n<tr>\n<td><strong>Upwork<\/strong><\/td>\n<td><strong>Sim, como canal secundário<\/strong><\/td>\n<td>Perfil de nicho, 3 propostas por dia de prospecção, vagas &lt; 24 h com pagamento verificado<\/td>\n<td>Mês 2+<\/td>\n<\/tr>\n<tr>\n<td><strong>Contra<\/strong><\/td>\n<td>Como portfólio/vitrine<\/td>\n<td>Perfil completo, serviços publicados<\/td>\n<td>Mês 1+<\/td>\n<\/tr>\n<tr>\n<td><strong>Agências<\/strong><\/td>\n<td><strong>Sim<\/strong><\/td>\n<td>5–15 contatos/semana, amostra white-label<\/td>\n<td>Mês 3+<\/td>\n<\/tr>\n<tr>\n<td><strong>Indicações<\/strong><\/td>\n<td><strong>Sim — o melhor canal no longo prazo<\/strong><\/td>\n<td>Pedir a todo cliente satisfeito (S16)<\/td>\n<td>Mês 4+<\/td>\n<\/tr>\n<tr>\n<td><strong>Fiverr<\/strong><\/td>\n<td>Opcional<\/td>\n<td>Só se Upwork não engrenar até o Dia 120; \"gig\" de hook pack<\/td>\n<td>Mês 5, opcional<\/td>\n<\/tr>\n<tr>\n<td>Comprar listas / disparo em massa<\/td>\n<td><strong>Não<\/strong><\/td>\n<td>Risco de spam, de reputação do domínio e de violar regras de privacidade (GDPR/PECR, CAN-SPAM)<\/td>\n<td>Nunca<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"34-cadência-de-outbound-marcas-e-agências\">3.4 Cadência de outbound (marcas e agências)<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dia<\/th>\n<th>Ação<\/th>\n<th>Script<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>E-mail com 1 observação real (ou Loom para leads A) + conexão no LinkedIn (sem pitch)<\/td>\n<td>S03 / S07 + S01<\/td>\n<\/tr>\n<tr>\n<td>3 (úteis)<\/td>\n<td>Follow-up 1: curto, com uma ideia<\/td>\n<td>S04<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Follow-up 2: entrega de valor (spec, ideia de gancho, insight)<\/td>\n<td>S05 / S08<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>Break-up: educado, porta aberta<\/td>\n<td>S06<\/td>\n<\/tr>\n<tr>\n<td>Após aceite no LinkedIn<\/td>\n<td>Mensagem leve, sem link<\/td>\n<td>S02<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Lead \"morto\" = sequência completa sem resposta → arquive e reative em 90 dias com algo novo.<\/p>\n<h3 id=\"35-regras-de-cold-e-mail-entregabilidade-e-legislação\">3.5 Regras de cold e-mail (entregabilidade e legislação)<\/h3>\n<ul>\n<li>Domínio próprio com <strong>SPF, DKIM e DMARC<\/strong> configurados (o provedor de e-mail tem tutoriais). Comece com ≤ 20 envios manuais/dia.<\/li>\n<li>Texto puro, ≤ 90 palavras, no máximo 1 link, sem anexo no primeiro e-mail.<\/li>\n<li><strong>EUA (CAN-SPAM):<\/strong> identifique-se de verdade, assunto não enganoso, endereço físico na assinatura e opção clara de não receber mais.<\/li>\n<li><strong>Reino Unido/UE (GDPR/PECR):<\/strong> prefira e-mails corporativos, mensagem relevante ao cargo, opção fácil de sair, registre de onde veio o contato; não compre listas.<\/li>\n<li>Não use rastreamento agressivo nem falsos \"Re:\" no assunto.<\/li>\n<\/ul>\n<h3 id=\"36-upwork--táticas\">3.6 Upwork — táticas<\/h3>\n<ul>\n<li>Perfil de nicho (\"AI Video Ads for E-commerce\"), não \"Video Editor\".<\/li>\n<li>Proposta: primeira frase responde ao problema do job; 1 amostra relevante; pergunta no final (S10).<\/li>\n<li>Filtros: vaga recente (&lt; 24 h), pagamento verificado, cliente com histórico de contratação, orçamento compatível.<\/li>\n<li>Connects: 10 grátis/mês; extras ~US$ 0,15 cada (fontes de 2026); orçamento de ~US$ 5–15/mês nos Meses 2–4.<\/li>\n<li>Taxa do Upwork: variável de 0% a 15% por contrato (desde maio de 2025) — inclua isso no preço.<\/li>\n<li>Primeiras avaliações valem mais que margem: aceite 2–3 jobs pequenos bem escolhidos e entregue acima do esperado.<\/li>\n<\/ul>\n<h3 id=\"37-specs-amostras-grátis--regras\">3.7 Specs (amostras grátis) — regras<\/h3>\n<ul>\n<li>Só para leads A (bom encaixe, sinal de compra).<\/li>\n<li>Tempo máximo: 2 h por spec.<\/li>\n<li>Enviado <strong>privado<\/strong>; não publique, não rode como anúncio, não use a marca real no portfólio sem autorização.<\/li>\n<li>Sempre com proposta de próximo passo pago (Pilot).<\/li>\n<\/ul>\n<h2 id=\"4-matemática-do-funil-estimativa--substitua-pelos-seus-números\">4. Matemática do funil (ESTIMATIVA — substitua pelos seus números)<\/h2>\n<p>Não há dado confiável e universal de taxa de resposta; varia por nicho, oferta e qualidade. Use estas hipóteses só para planejar volume e <strong>troque pelos seus números reais a partir do Dia 70<\/strong>:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Etapa<\/th>\n<th>Hipótese conservadora<\/th>\n<th>Hipótese realista<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Contatos personalizados → respostas<\/td>\n<td>3%<\/td>\n<td>6–8%<\/td>\n<\/tr>\n<tr>\n<td>Respostas → calls/conversas sérias<\/td>\n<td>30%<\/td>\n<td>40%<\/td>\n<\/tr>\n<tr>\n<td>Calls → piloto pago<\/td>\n<td>15%<\/td>\n<td>25%<\/td>\n<\/tr>\n<tr>\n<td>Piloto → recorrente<\/td>\n<td>30%<\/td>\n<td>50%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Com 150 contatos/mês: conservador ≈ 4–5 respostas, ~1 call, ~0,2 piloto (ou seja, pode passar um mês sem fechar); realista ≈ 9–12 respostas, 4–5 calls, ~1 piloto. <strong>Por isso specs, Looms, agências e o mercado-ponte existem: para melhorar essas taxas.<\/strong><\/p>\n<h2 id=\"5-como-lidar-com-clientes-que-não-falam-português\">5. Como lidar com clientes que não falam português<\/h2>\n<ul>\n<li><strong>Assíncrono primeiro:<\/strong> briefing por formulário (T04), entregas com Loom, feedback por comentário.<\/li>\n<li><strong>Sempre resumo escrito<\/strong> depois de qualquer call (\"recap\" com action items — tema da Semana 23).<\/li>\n<li><strong>Prepare cada call<\/strong> com P-ING-3 (04-INGLES) e tenha as frases de sobrevivência à mão (S21).<\/li>\n<li><strong>Fuso horário:<\/strong> proponha horários no fuso do cliente (EST/PST/GMT) e use link de agendamento que converte automaticamente.<\/li>\n<li><strong>Ferramentas de apoio:<\/strong> DeepL/IA para revisar textos importantes; legenda automática ligada nas calls (Google Meet tem legenda ao vivo).<\/li>\n<li><strong>Honestidade sem pedir desculpa:<\/strong> \"English is my second language, so I always confirm details in writing.\" Vira sinal de profissionalismo.<\/li>\n<\/ul>\n<h2 id=\"6-propostas-e-primeiros-contratos\">6. Propostas e primeiros contratos<\/h2>\n<ol>\n<li><strong>Pilot de risco baixo:<\/strong> escopo pequeno, preço claro, prazo curto, 1 revisão.<\/li>\n<li><strong>Proposta em 1 página<\/strong> (T01) enviada em até 24 h após a call, com 2 opções (Pilot e Sprint) e validade de 7 dias.<\/li>\n<li><strong>Garantia de processo, não de resultado:<\/strong> \"If the first draft misses the brief, I'll redo it\" — nunca prometa ROAS.<\/li>\n<li><strong>Pagamento antes:<\/strong> 100% do Pilot para cliente novo direto; Upwork com milestone financiado.<\/li>\n<li><strong>Depois do Pilot:<\/strong> relatório curto + proposta de Sprint mensal em 48 h (S25).<\/li>\n<\/ol>\n<h2 id=\"7-como-receber-resumo--detalhes-em-07-financeiro\">7. Como receber (resumo — detalhes em <a href=\"#doc/financeiro\">07-FINANCEIRO<\/a>)<\/h2>\n<ul>\n<li><strong>Upwork:<\/strong> saque para Payoneer ou transferência bancária, conforme opções disponíveis para o Brasil na sua conta.<\/li>\n<li><strong>Clientes diretos:<\/strong> Wise (dados de conta em USD/EUR para receber como se fosse transferência local) ou Payoneer (cobrança). Evite cartão/PayPal para valores altos (taxas e risco de estorno).<\/li>\n<li><strong>Fatura em inglês<\/strong> com: seus dados, dados do cliente, descrição do serviço, valor e moeda, vencimento, forma de pagamento.<\/li>\n<li><strong>Guarde contrato, fatura e comprovante<\/strong> de cada recebimento: serve para provar exportação de serviço (efeito tributário) e para o contador.<\/li>\n<\/ul>\n<h2 id=\"8-as-primeiras-tarefas-comerciais-para-aumentar-a-renda-já\">8. As primeiras tarefas comerciais (para aumentar a renda já)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Tarefa<\/th>\n<th>Dia<\/th>\n<th>Resultado esperado<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Listar os 2 clientes atuais com resultados de 90 dias e agendar conversa<\/td>\n<td>1<\/td>\n<td>2 conversas agendadas<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Escrever os 3 pacotes da MM (\"tráfego + criativos\")<\/td>\n<td>3<\/td>\n<td>Oferta com ticket maior<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Montar lista de 30 prospects em Goiânia com observação específica<\/td>\n<td>3<\/td>\n<td>Pipeline BR<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Enviar S19 para os 5 prospects A<\/td>\n<td>3<\/td>\n<td>Primeiras conversas<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Conversa de upsell + pedido de teste de criativo com IA + pedido de caso<\/td>\n<td>10<\/td>\n<td>1 upsell e dados reais<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>10 abordagens BR + criativo-isca para o melhor lead<\/td>\n<td>10<\/td>\n<td>Mostrar em vez de falar<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>One-pager da MM e 1 call de diagnóstico<\/td>\n<td>17<\/td>\n<td>Proposta enviada<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Spec de anúncio de restaurante para um prospect real<\/td>\n<td>20–24<\/td>\n<td>Fechamento local<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Teste real de criativo com IA na campanha de um cliente<\/td>\n<td>24<\/td>\n<td>Caso com números<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>LinkedIn em inglês + 20 conexões<\/td>\n<td>25<\/td>\n<td>Presença internacional<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"9-metas-comerciais-por-mês-resumo\">9. Metas comerciais por mês (resumo)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mês<\/th>\n<th>Brasil<\/th>\n<th>Mercado-ponte<\/th>\n<th>Inglês (e-mail + LinkedIn + Upwork + agências)<\/th>\n<th>Calls (todas)<\/th>\n<th>Fechamentos esperados (realista)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>≥ 40 abordagens<\/td>\n<td>—<\/td>\n<td>20 conexões<\/td>\n<td>≥ 2<\/td>\n<td>1 BR<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>≥ 25<\/td>\n<td>≥ 40 + 5 Looms<\/td>\n<td>≥ 9 propostas Upwork<\/td>\n<td>≥ 3<\/td>\n<td>1 BR, 0–1 ponte<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>manutenção<\/td>\n<td>follow-ups<\/td>\n<td>≥ 150<\/td>\n<td>≥ 3<\/td>\n<td>1 piloto<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>manutenção<\/td>\n<td>follow-ups<\/td>\n<td>≥ 120<\/td>\n<td>≥ 4<\/td>\n<td>1 cliente + 1 retainer proposto<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>manutenção<\/td>\n<td>follow-ups<\/td>\n<td>≥ 120 + 25 agências<\/td>\n<td>≥ 4<\/td>\n<td>1–2 clientes<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>decisão da MM<\/td>\n<td>follow-ups<\/td>\n<td>≥ 120<\/td>\n<td>≥ 4<\/td>\n<td>1–2 clientes, diversificação<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, "scripts": {"title": "Scripts (inglês + tradução)", "group": "Vendas", "html": "<blockquote>\n<p><strong>Como usar:<\/strong> os textos em <code>[colchetes]<\/code> são obrigatórios de personalizar. Se a mensagem continuar fazendo sentido para qualquer empresa depois de personalizada, reescreva a observação. Leia em voz alta antes de enviar. Corrija com o prompt P-ING-1 (04-INGLES) até soar como você.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"internacional--prospecção\">Internacional — prospecção<\/h2>\n<h3 id=\"s01--pedido-de-conexão-no-linkedin--300-caracteres\">S01 — Pedido de conexão no LinkedIn (≤ 300 caracteres)<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name] — I work on ad creatives for e-commerce brands and I've been following [Brand]'s ads. Love the [specific thing]. Would be great to connect.<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome] — eu trabalho com criativos de anúncio para marcas de e-commerce e tenho acompanhado os anúncios da [Marca]. Gosto muito de [coisa específica]. Seria ótimo me conectar.<\/p>\n<\/blockquote>\n<h3 id=\"s02--mensagem-depois-que-aceitou-a-conexão-sem-link\">S02 — Mensagem depois que aceitou a conexão (sem link)<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Thanks for connecting, [Name]. Quick question out of curiosity: how many new ad concepts is [Brand] testing per month right now? I'm seeing a lot of DTC brands struggle to keep up with creative fatigue on Meta.<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Obrigado por aceitar, [Nome]. Uma pergunta por curiosidade: quantos conceitos novos de anúncio a [Marca] está testando por mês hoje? Tenho visto muitas marcas DTC com dificuldade de acompanhar a fadiga de criativos no Meta.<\/p>\n<\/blockquote>\n<h3 id=\"s03--cold-e-mail-para-marca-dtc--90-palavras\">S03 — Cold e-mail para marca DTC (≤ 90 palavras)<\/h3>\n<p><strong>Assunto:<\/strong> <code>[Brand] ads — quick idea<\/code> ou <code>new angles for [product]<\/code><\/p>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name],<\/p>\n<p>I was looking at [Brand]'s ads in the Meta Ad Library and noticed [specific observation — e.g., \"most of your active ads are statics, and the one video ad has been running since May\"].<\/p>\n<p>I make AI-powered video ads for e-commerce brands — fast to produce, built to test new angles. I also run paid traffic, so I build them around hook rate and CPA, not just looks.<\/p>\n<p>Would it be useful if I sent you 2 hook ideas for [product]? No strings attached.<\/p>\n<p>[Your name]\n[Portfolio link]\n[Physical address] · Reply \"no thanks\" and I won't follow up.<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome],<\/p>\n<p>Eu estava olhando os anúncios da [Marca] na Biblioteca de Anúncios do Meta e percebi [observação específica — ex.: \"a maioria dos anúncios ativos é estática e o único vídeo está rodando desde maio\"].<\/p>\n<p>Eu faço anúncios em vídeo com IA para marcas de e-commerce — rápidos de produzir e pensados para testar novos ângulos. Também faço gestão de tráfego, então construo pensando em hook rate e CPA, não só na estética.<\/p>\n<p>Seria útil se eu te mandasse 2 ideias de gancho para [produto]? Sem compromisso.<\/p>\n<p>[Seu nome] · [Link do portfólio] · [Endereço] · Responda \"não, obrigado\" e eu não sigo mais.<\/p>\n<\/blockquote>\n<h3 id=\"s04--follow-up-1-3-dias-úteis-depois\">S04 — Follow-up 1 (3 dias úteis depois)<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], just bumping this up. Here's one of the ideas, so you can judge: open with [hook idea in 1 line — e.g., \"a close-up of dog hair on a black sofa, text: 'Your lint roller isn't the problem'\"]. Want me to send the second one?<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome], só trazendo isso de volta. Aqui vai uma das ideias, para você avaliar: abrir com [ideia de gancho em 1 linha]. Quer que eu mande a segunda?<\/p>\n<\/blockquote>\n<h3 id=\"s05--follow-up-2-valor-7-dias-depois\">S05 — Follow-up 2 (valor, 7 dias depois)<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], I went ahead and made a quick concept for [Brand] — [15-second video / 2 hooks]. Here it is: [link]. If it's useful, I can turn it into a small test pack. If not, no worries at all.<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome], resolvi fazer um conceito rápido para a [Marca] — [vídeo de 15 s / 2 ganchos]. Está aqui: [link]. Se for útil, posso transformar num pacote pequeno de teste. Se não, tudo bem.<\/p>\n<\/blockquote>\n<h3 id=\"s06--break-up-14-dias-depois\">S06 — Break-up (14 dias depois)<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], I don't want to clutter your inbox, so this is my last note. If fresh ad concepts become a priority later, I'm one reply away. Wishing [Brand] a great quarter.<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome], não quero lotar sua caixa de entrada, então esta é minha última mensagem. Se novos conceitos de anúncio virarem prioridade mais para frente, é só responder. Desejo um ótimo trimestre para a [Marca].<\/p>\n<\/blockquote>\n<h3 id=\"s07--e-mail-com-loom-de-diagnóstico\">S07 — E-mail com Loom de diagnóstico<\/h3>\n<p><strong>Assunto:<\/strong> <code>2-min video on [Brand]'s ads<\/code><\/p>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], I recorded a 2-minute video looking at [Brand]'s current ads — what's working, two opportunities I see, and one concrete ad idea: [Loom link]. Happy to make the idea for you if you'd like to test it.<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome], gravei um vídeo de 2 minutos analisando os anúncios atuais da [Marca] — o que está funcionando, duas oportunidades que vejo e uma ideia concreta de anúncio: [link do Loom]. Posso produzir a ideia para você testar, se quiser.<\/p>\n<\/blockquote>\n<p><strong>Roteiro do Loom (2 min):<\/strong> quem você é (10 s) → o que está funcionando (30 s) → 2 oportunidades (50 s) → 1 ideia concreta (20 s) → convite (10 s).<\/p>\n<h3 id=\"s08--envio-de-spec-anúncio-feito-para-o-prospect\">S08 — Envio de spec (anúncio feito para o prospect)<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], I made this for [Brand] — a 15-second ad with two different hooks, using your [product]: [link]. It's yours to keep, no strings attached. If you like the direction, I can produce a pilot pack (3 ads × 2 hooks) in 5 business days. Want me to send the details?<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome], fiz isto para a [Marca] — um anúncio de 15 segundos com dois ganchos diferentes, usando o seu [produto]: [link]. É seu, sem compromisso. Se gostar da direção, posso produzir um pacote piloto (3 anúncios × 2 ganchos) em 5 dias úteis. Quer que eu mande os detalhes?<\/p>\n<\/blockquote>\n<h3 id=\"s09--pitch-de-parceria-para-agências-white-label\">S09 — Pitch de parceria para agências (white-label)<\/h3>\n<p><strong>Assunto:<\/strong> <code>extra creative capacity for [Agency]<\/code><\/p>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name],<\/p>\n<p>I noticed [Agency] works with e-commerce clients on paid social [and you're hiring a video editor / your case studies show mostly statics].<\/p>\n<p>I'm a performance creative specialist (AI-powered video + editing, and I run Meta ads myself). I work white-label: your brand, your client relationship, my production — with fixed turnaround times.<\/p>\n<p>Here are 3 unbranded samples: [link]. Would a small paid test project make sense, so you can see how I work?<\/p>\n<p>[Your name]<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome],<\/p>\n<p>Vi que a [Agência] atende clientes de e-commerce em mídia paga [e está contratando editor de vídeo / os cases mostram principalmente estáticos].<\/p>\n<p>Sou especialista em criativos de performance (vídeo com IA + edição, e eu mesmo faço gestão de Meta Ads). Trabalho em white-label: a marca é sua, a relação com o cliente é sua, a produção é minha — com prazos fixos.<\/p>\n<p>Aqui estão 3 amostras sem marca: [link]. Faria sentido um pequeno projeto-teste pago para você ver como eu trabalho?<\/p>\n<\/blockquote>\n<h3 id=\"s10--proposta-no-upwork--150-palavras\">S10 — Proposta no Upwork (≤ 150 palavras)<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Client name, if available],<\/p>\n<p>You need [repeat the job's goal in your words — e.g., \"5 short video ads for your skincare launch on TikTok and Reels\"]. Here's how I'd approach it:<\/p>\n<ol>\n<li>3 different angles (not just 3 edits of the same idea): [angle 1], [angle 2], [angle 3].<\/li>\n<li>2 hooks per angle, so you can test what stops the scroll.<\/li>\n<li>Delivered in 9:16 and 4:5, with captions, in [X] days.<\/li>\n<\/ol>\n<p>Most relevant sample: [one link]. I also manage Meta ads, so I'll build these around hook rate and cost per purchase.<\/p>\n<p>Quick question: [smart question about the job — e.g., \"Do you already have product footage, or should I create the product shots with AI?\"]<\/p>\n<p>[Your name]<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome do cliente],<\/p>\n<p>Você precisa de [objetivo do job com suas palavras]. Minha abordagem: (1) 3 ângulos diferentes (não 3 edições da mesma ideia); (2) 2 ganchos por ângulo para testar o que para a rolagem; (3) entrega em 9:16 e 4:5, com legenda, em [X] dias. Amostra mais relevante: [1 link]. Também faço gestão de Meta Ads, então construo pensando em hook rate e custo por compra. Pergunta rápida: [pergunta inteligente sobre o job].<\/p>\n<\/blockquote>\n<h3 id=\"s11--roteiro-de-call-de-descoberta-20-min--rubrica\">S11 — Roteiro de call de descoberta (20 min) + rubrica<\/h3>\n<p><strong>Estrutura<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tempo<\/th>\n<th>Etapa<\/th>\n<th>Frases (EN)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–2<\/td>\n<td>Rapport e agenda<\/td>\n<td>\"Thanks for taking the time. My plan: I ask a few questions about your ads, then I share how I'd approach it, and we see if it makes sense. Sound good?\"<\/td>\n<\/tr>\n<tr>\n<td>2–5<\/td>\n<td>Objetivo<\/td>\n<td>\"What would a great next 90 days look like for [Brand]'s ads?\"<\/td>\n<\/tr>\n<tr>\n<td>5–10<\/td>\n<td>Situação atual<\/td>\n<td>\"How many new concepts do you test per month?\" · \"Who makes your ads today?\" · \"What's your current CPA or ROAS trend?\" · \"Which ad has worked best so far, and why do you think it worked?\"<\/td>\n<\/tr>\n<tr>\n<td>10–15<\/td>\n<td>Obstáculos<\/td>\n<td>\"What's stopping you from testing more?\" · \"What happened last time you worked with a freelancer or agency?\" · \"Who else is involved in the decision?\"<\/td>\n<\/tr>\n<tr>\n<td>15–20<\/td>\n<td>Próximo passo<\/td>\n<td>\"Based on what you told me, I'd suggest a pilot: [scope]. It's [price], delivered in [X] days. Does that sound fair?\" · \"I'll send a one-page proposal today. When could you review it?\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Rubrica (0–2 cada; meta ≥ 8/12):<\/strong> fez ≥ 6 perguntas · falou ≤ 30% do tempo · repetiu o problema do cliente com as palavras dele · apresentou 1 proposta clara · tratou 1 objeção · terminou com próximo passo e data.<\/p>\n<h3 id=\"s12--e-mail-de-proposta-após-a-call\">S12 — E-mail de proposta (após a call)<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], great talking today. As promised, here's the proposal: [link/PDF].<\/p>\n<p>Summary: you want [goal]. I suggest starting with the <strong>Pilot<\/strong> — [scope] for [price], delivered in [X] business days. If it performs, the <strong>Creative Sprint<\/strong> keeps new concepts coming every month ([price]/month).<\/p>\n<p>The proposal is valid until [date]. If it looks good, reply \"go\" and I'll send the invoice and the brief form.<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome], ótima conversa hoje. Como combinado, aqui está a proposta: [link/PDF]. Resumo: você quer [objetivo]. Sugiro começar pelo <strong>Piloto<\/strong> — [escopo] por [preço], entregue em [X] dias úteis. Se performar, o <strong>Creative Sprint<\/strong> mantém novos conceitos chegando todo mês ([preço]/mês). A proposta vale até [data]. Se estiver ok, responda \"go\" e eu envio a fatura e o formulário de briefing.<\/p>\n<\/blockquote>\n<h3 id=\"s13--objeções\">S13 — Objeções<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Objeção<\/th>\n<th>Resposta (EN)<\/th>\n<th>Tradução<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"Your price is too high.\"<\/td>\n<td>\"I understand. What budget did you have in mind? If we need to stay there, I can reduce the scope — for example, 2 concepts instead of 3 — so the quality stays the same.\"<\/td>\n<td>Entendo. Qual orçamento você tinha em mente? Se precisarmos ficar nele, posso reduzir o escopo — por exemplo, 2 conceitos em vez de 3 — para manter a qualidade.<\/td>\n<\/tr>\n<tr>\n<td>\"AI videos look fake.\"<\/td>\n<td>\"That's a fair concern — a lot of them do. That's why I combine AI with real product footage when possible, keep shots short, and do all the editing, sound and color by hand. Here's an example where [real × AI]. Want to test one against your current best ad?\"<\/td>\n<td>É uma preocupação justa — muitos parecem. Por isso combino IA com filmagem real do produto quando possível, uso planos curtos e faço edição, som e cor manualmente. Aqui um exemplo... Quer testar um contra o seu melhor anúncio atual?<\/td>\n<\/tr>\n<tr>\n<td>\"We already have an in-house editor.\"<\/td>\n<td>\"Great — then I can be extra capacity for new concepts, so your editor focuses on iterations of winners. Many teams use me for volume weeks or launches.\"<\/td>\n<td>Ótimo — então posso ser capacidade extra para novos conceitos, e o seu editor foca nas iterações dos vencedores.<\/td>\n<\/tr>\n<tr>\n<td>\"Send me more info.\"<\/td>\n<td>\"Sure. To send the right thing: is your priority more video concepts, faster turnaround, or better results from what you already run?\"<\/td>\n<td>Claro. Para mandar a coisa certa: sua prioridade é mais conceitos em vídeo, prazo menor ou melhorar o resultado do que já roda?<\/td>\n<\/tr>\n<tr>\n<td>\"Not now.\"<\/td>\n<td>\"No problem. When would be a better time to revisit — after [launch/season]? I'll make a note and check back then.\"<\/td>\n<td>Sem problema. Quando seria melhor retomar — depois de [lançamento/temporada]? Anoto e volto a falar.<\/td>\n<\/tr>\n<tr>\n<td>\"Can you guarantee results?\"<\/td>\n<td>\"No one honest can guarantee ad results. What I guarantee is the process: distinct concepts, built to test, delivered on time, and a clear report on what worked.\"<\/td>\n<td>Ninguém honesto garante resultado de anúncio. O que eu garanto é o processo: conceitos diferentes, feitos para teste, no prazo, e um relatório claro do que funcionou.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"s14--frases-de-negociação\">S14 — Frases de negociação<\/h3>\n<ul>\n<li>\"Would you be open to a smaller first project, so we can both see if it's a fit?\" — <em>Você toparia um primeiro projeto menor para vermos se encaixa?<\/em><\/li>\n<li>\"I can do that price if we reduce the scope to [X].\" — <em>Consigo esse preço se reduzirmos o escopo para [X].<\/em><\/li>\n<li>\"If you can pay upfront for 3 months, I can offer [Y]% off.\" — <em>Se pagar 3 meses adiantado, consigo [Y]% de desconto.<\/em><\/li>\n<li>\"That's outside the current scope, but happy to add it: it would be [price] and [time].\" — <em>Isso está fora do escopo atual, mas adiciono com prazer: seria [preço] e [prazo].<\/em><\/li>\n<li>\"Let me think about it and get back to you by [day].\" — <em>Deixa eu pensar e te respondo até [dia].<\/em><\/li>\n<\/ul>\n<h3 id=\"s15--fatura-e-lembrete-de-pagamento\">S15 — Fatura e lembrete de pagamento<\/h3>\n<p><strong>Envio<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], here's the invoice for [project]: [link]. Amount: [value + currency]. Due date: [date]. Payment via [Wise/bank transfer details]. Thanks!<\/p>\n<p><em>Oi [Nome], segue a fatura de [projeto]: [link]. Valor: [valor + moeda]. Vencimento: [data]. Pagamento via [Wise/transferência]. Obrigado!<\/em><\/p>\n<\/blockquote>\n<p><strong>Lembrete (3 dias após o vencimento)<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], friendly reminder that invoice [#] for [value] was due on [date]. Could you let me know when I can expect the payment? Happy to help if there's any issue with the transfer.<\/p>\n<p><em>Oi [Nome], lembrete amigável de que a fatura [#] de [valor] venceu em [data]. Pode me dizer quando devo esperar o pagamento? Posso ajudar se houver algum problema com a transferência.<\/em><\/p>\n<\/blockquote>\n<h3 id=\"s16--pedido-de-depoimento-e-indicação\">S16 — Pedido de depoimento e indicação<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], I really enjoyed working on [project]. Two small favors, only if you're comfortable: (1) could you answer 3 quick questions for a short testimonial — what was the challenge, what changed, would you recommend me? (2) Do you know one other brand that might need fresh ad creatives? An intro would mean a lot.<\/p>\n<\/blockquote>\n<p><strong>PT (clientes brasileiros — inclui autorização de caso)<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome], adorei trabalhar em [projeto]. Dois pedidos, só se você se sentir à vontade: (1) posso usar os resultados da campanha num estudo de caso? Posso deixar anônimo (\"um restaurante em Goiânia\"). (2) Você responderia 3 perguntas rápidas para um depoimento — qual era o desafio, o que mudou, você me recomendaria? E se conhecer alguém que precise de anúncios, uma indicação ajuda muito.<\/p>\n<\/blockquote>\n<h3 id=\"s21--frases-para-inglês-ainda-em-evolução\">S21 — Frases para inglês ainda em evolução<\/h3>\n<p>Ver tabela em <a href=\"#doc/ingles/frases-de-sobrevivência-inglês-ainda-em-evolução\">04-INGLES/plano-de-ingles.md<\/a>. Regra: confirme tudo por escrito depois da call.<\/p>\n<h3 id=\"s22--boas-vindas--onboarding\">S22 — Boas-vindas / onboarding<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Welcome aboard, [Name]! Here's how we'll get started:\n1. Brief form (10 min): [link]\n2. Shared folder for your assets (logo, product photos, brand guidelines, past ads): [link]\n3. Timeline: first drafts on [date], final files on [date].\n4. Feedback: comment directly on the files or reply here. Two rounds of revisions are included.\nAny questions, just reply. Excited to get this going!<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Bem-vindo(a), [Nome]! Para começarmos: 1) formulário de briefing (10 min): [link]; 2) pasta compartilhada para seus materiais (logo, fotos do produto, manual da marca, anúncios anteriores): [link]; 3) cronograma: primeiros rascunhos em [data], arquivos finais em [data]; 4) feedback: comente direto nos arquivos ou responda aqui. Duas rodadas de revisão inclusas.<\/p>\n<\/blockquote>\n<h3 id=\"s23--entrega-de-rascunho--pedido-de-feedback\">S23 — Entrega de rascunho / pedido de feedback<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], first drafts are ready: [link]. Inside: [X] ads, [formats]. To keep this efficient, could you answer: (1) Which concept feels closest to your brand? (2) Anything factually wrong about the product? (3) Any must-change before final? Feedback by [date] keeps us on schedule for [final date].<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome], os primeiros rascunhos estão prontos: [link]. Dentro: [X] anúncios, [formatos]. Para agilizar: (1) qual conceito está mais próximo da marca? (2) algo incorreto sobre o produto? (3) alguma mudança obrigatória antes do final? Feedback até [data] mantém a entrega final em [data].<\/p>\n<\/blockquote>\n<h3 id=\"s24--aviso-de-atraso\">S24 — Aviso de atraso<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], I want to give you a heads-up early: the [deliverable] will be ready on [new date] instead of [old date]. The reason: [short, honest reason]. To make up for it, [what you'll do — e.g., \"I'll include one extra hook variation\"]. Sorry for the change — it won't affect the rest of the timeline.<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome], quero avisar com antecedência: [entrega] fica pronta em [nova data] em vez de [data antiga]. Motivo: [motivo curto e honesto]. Para compensar, [o que você fará]. Desculpe pela mudança — não afeta o restante do cronograma.<\/p>\n<\/blockquote>\n<h3 id=\"s25--proposta-de-recorrência-depois-do-piloto\">S25 — Proposta de recorrência (depois do piloto)<\/h3>\n<p><strong>EN<\/strong><\/p>\n<blockquote>\n<p>Hi [Name], here's a quick wrap-up of the pilot: [1–2 results or learnings, e.g., \"Hook B had a 2x higher hook rate; the
