'demo' concept got the lowest CPA\"].<\/p>\n<p>Ads fatigue fast, so the brands that win keep testing new concepts every month. I'd suggest the <strong>Creative Sprint<\/strong>: [X] new ads per month across [Y] concepts + a monthly report with what to test next — [price]/month. Or the lighter option: [smaller scope] for [price]/month.<\/p>\n<p>Want me to set up next month's first concepts based on what we learned?<\/p>\n<\/blockquote>\n<p><strong>PT<\/strong><\/p>\n<blockquote>\n<p>Oi [Nome], um resumo rápido do piloto: [1–2 resultados ou aprendizados]. Anúncio cansa rápido, por isso as marcas que ganham testam novos conceitos todo mês. Sugiro o <strong>Creative Sprint<\/strong>: [X] anúncios novos por mês em [Y] conceitos + relatório mensal com o que testar em seguida — [preço]/mês. Ou a opção mais leve: [escopo menor] por [preço]/mês. Quer que eu prepare os primeiros conceitos do próximo mês com base no que aprendemos?<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"mercado-ponte-em-português\">Mercado-ponte (em português)<\/h2>\n<h3 id=\"s17--portugal-português-de-portugal\">S17 — Portugal (português de Portugal)<\/h3>\n<blockquote>\n<p>Olá, [Nome]. Estive a ver o Instagram e os anúncios do [Negócio] e reparei que [observação específica — ex.: \"os anúncios ativos usam sempre a mesma fotografia do prato do dia\"].<\/p>\n<p>Trabalho com anúncios no Instagram e Facebook para restaurantes e negócios locais, incluindo vídeos curtos feitos com IA e edição profissional. Preparei uma ideia de anúncio para o [Negócio] — posso enviar-lhe um vídeo de 2 minutos a explicar?<\/p>\n<p>Com os melhores cumprimentos, [Nome]<\/p>\n<\/blockquote>\n<p><em>Notas:<\/em> \"telemóvel\", \"equipa\", \"marcação\", \"fotografia\"; evite \"você\" em excesso (use o nome); tom cordial e formal.<\/p>\n<h3 id=\"s18--negócios-de-brasileiros-nos-eua\">S18 — Negócios de brasileiros nos EUA<\/h3>\n<blockquote>\n<p>Oi, [Nome]! Vi o perfil do [Negócio] aqui em [cidade] e notei que [observação específica — ex.: \"vocês postam muito bem, mas não encontrei anúncios ativos na Biblioteca de Anúncios\"].<\/p>\n<p>Eu trabalho com anúncios no Instagram/Facebook para negócios da comunidade brasileira nos EUA — gestão de tráfego + vídeos curtos com IA. Fiz uma ideia rápida de anúncio para vocês. Posso te mandar?<\/p>\n<\/blockquote>\n<h2 id=\"brasil-mm\">Brasil (MM)<\/h2>\n<h3 id=\"s19--prospecção-br-whatsappinstagram\">S19 — Prospecção BR (WhatsApp/Instagram)<\/h3>\n<blockquote>\n<p>Oi, [Nome], tudo bem? Sou [seu nome], da MM, aqui de Goiânia. Vi os anúncios do [Negócio] e reparei que [observação específica — ex.: \"o mesmo vídeo está rodando há meses e não tem legenda\"].<\/p>\n<p>Hoje eu faço gestão de tráfego e também produzo os criativos (vídeos curtos com IA e edição profissional). Posso te mandar uma ideia de anúncio que eu faria para vocês? Leva 1 minuto para ver.<\/p>\n<\/blockquote>\n<p><strong>Follow-up (2 dias):<\/strong> \"Oi, [Nome]! Fiz a ideia que comentei — posso te mandar aqui mesmo?\"<\/p>\n<h3 id=\"s20--upsell-para-clientes-atuais\">S20 — Upsell para clientes atuais<\/h3>\n<blockquote>\n<p>[Nome], queria marcar 20 minutos para revisar os resultados dos últimos 90 dias e mostrar uma novidade: agora eu produzo os criativos também, com IA e edição profissional. A ideia é aumentar o número de anúncios testados por mês, que é o que mais tem feito diferença no Meta hoje.<\/p>\n<p>Na conversa eu queria te propor: (1) testar 1 ou 2 criativos novos na campanha atual, para comparar com o que está rodando; (2) se funcionar, incluir 4 criativos por mês no pacote. Pode ser [dia/horário]?<\/p>\n<\/blockquote>"}, "templates": {"title": "Templates comerciais", "group": "Vendas", "html": "<h2 id=\"t01--proposta-comercial-1-página-en\">T01 — Proposta comercial (1 página, EN)<\/h2>\n<pre><code>PROPOSAL — [Brand] × [Your name / studio]\nDate: [ ]   ·   Valid until: [date + 7 days]\n\n1. YOUR GOAL\n   [Repeat the client's goal in their words, 1–2 lines.]\n\n2. WHAT I'LL DELIVER\n   Option A — Pilot\n   • 3 video ads (15–30 s), 3 different concepts\n   • 2 hooks per ad (6 files total)\n   • Formats: 9:16 and 4:5 · captions included\n   • 1 round of revisions\n   • Timeline: first drafts in [X] business days, finals in [Y]\n   • Investment: US$ [ ] — 100% upfront\n\n   Option B — Creative Sprint (monthly)\n   • [8–12] new ads per month across [3–4] concepts\n   • Statics: [optional]\n   • Monthly creative testing report (what won, what to test next)\n   • 2 rounds of revisions per batch\n   • Investment: US$ [ ]/month — billed monthly in advance · 30-day notice to cancel\n\n3. HOW WE'LL WORK\n   Brief form → concepts for approval → production → drafts → revisions → final delivery (shared folder).\n   Communication: email/Slack, async. Optional 15-min weekly call.\n\n4. WHAT I NEED FROM YOU\n   Product photos/footage, logo, brand guidelines, current best ads, access to ad results (for reports).\n\n5. AI &amp; USAGE\n   Visuals may combine real footage and AI-generated shots (see my AI Use Policy). No real people are\n   generated without consent; no fake testimonials. You get full usage rights to the final files for\n   advertising once paid in full. Project files and raw generations are not included unless agreed.\n\n6. NOT INCLUDED\n   Ad spend, media buying (unless Option C), music licenses beyond the included library, extra formats.\n\n7. NEXT STEP\n   Reply &quot;go&quot; with the option you choose → I send the invoice and the brief form → we start.\n<\/code><\/pre>\n<p><strong>Versão PT:<\/strong> mesmos blocos (Seu objetivo · O que vou entregar · Como vamos trabalhar · O que preciso de você · IA e direitos de uso · Não incluído · Próximo passo).<\/p>\n<p><strong>Change order (pedido de mudança) — modelo curto:<\/strong><\/p>\n<blockquote>\n<p>\"Happy to add [request]. It's outside the current scope, so it would be US$ [ ] and add [X] days. Reply 'approved' and I'll include it in this batch.\"<\/p>\n<\/blockquote>\n<h2 id=\"t03--relatório-mensal-de-criativos-5-slides\">T03 — Relatório mensal de criativos (5 slides)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Slide<\/th>\n<th>Conteúdo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Summary<\/td>\n<td>Período · nº de anúncios testados · conceitos · 3 números principais (ex.: melhor hook rate, menor CPA, ROAS) · 1 frase de conclusão<\/td>\n<\/tr>\n<tr>\n<td>2. Winners<\/td>\n<td>Top 3 anúncios: thumbnail, métrica principal, por que achamos que venceu<\/td>\n<\/tr>\n<tr>\n<td>3. Losers &amp; learnings<\/td>\n<td>O que não funcionou e o aprendizado (vale tanto quanto o vencedor)<\/td>\n<\/tr>\n<tr>\n<td>4. Next tests<\/td>\n<td>3–5 hipóteses para o próximo mês (conceito, ângulo, formato)<\/td>\n<\/tr>\n<tr>\n<td>5. Asks<\/td>\n<td>O que você precisa do cliente (acesso, produto, aprovações, datas)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Métricas: hook rate (reproduções de 3 s ÷ impressões), hold rate (ThruPlays ÷ reproduções de 3 s), CTR de link, CPC, custo por resultado, ROAS (se houver dado de compra). <strong>Sempre<\/strong> com a data e o período; nunca compare períodos de tamanhos diferentes sem avisar.<\/p>\n<h2 id=\"t04--formulário-de-briefing-google-forms-en\">T04 — Formulário de briefing (Google Forms, EN)<\/h2>\n<ol>\n<li>Brand name and website<\/li>\n<li>Product(s) for these ads (links)<\/li>\n<li>Main goal (sales, leads, launch, awareness)<\/li>\n<li>Target customer (who buys, why, what they worry about)<\/li>\n<li>Top 3 benefits — and any claims we <strong>cannot<\/strong> make (legal/compliance)<\/li>\n<li>Current offer (discount, bundle, free shipping…)<\/li>\n<li>Best-performing ads so far (links) and why you think they worked<\/li>\n<li>Ads you like from other brands (links)<\/li>\n<li>Brand guidelines (fonts, colors, tone) — upload<\/li>\n<li>Product photos/footage — upload or folder link<\/li>\n<li>Platforms and placements (Meta Feed/Reels/Stories, TikTok, YouTube)<\/li>\n<li>Languages and markets<\/li>\n<li>Deadline and who approves<\/li>\n<li>Anything we must avoid (competitors, words, visuals)<\/li>\n<\/ol>\n<h2 id=\"t05--checklist-de-qa-antes-de-toda-entrega\">T05 — Checklist de QA (antes de toda entrega)<\/h2>\n<p><strong>Mensagem<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:1\"> O gancho funciona nos 2 primeiros segundos, inclusive sem som.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:2\"> 1 ideia principal por anúncio; benefício claro; CTA concreto.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:3\"> Nenhuma alegação que o cliente não pode comprovar (saúde, \"melhor do mundo\", números inventados).<\/li>\n<\/ul>\n<p><strong>Visual<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:4\"> Produto correto (cor, forma, rótulo, nome) — nenhuma característica inventada pela IA.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:5\"> Sem artefatos de IA visíveis (mãos, texto deformado, objetos que mudam).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:6\"> Cor consistente entre planos.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:7\"> Texto e legendas dentro das zonas seguras de cada formato.<\/li>\n<\/ul>\n<p><strong>Áudio<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:8\"> Voz 100% compreensível no alto-falante do celular.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:9\"> Música sem \"estouro\", ducking sob a voz, final no tempo.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:10\"> Todas as músicas/efeitos com licença para uso comercial.<\/li>\n<\/ul>\n<p><strong>Técnico<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:11\"> Formatos e resoluções pedidos (9:16 1080x1920 · 4:5 1080x1350 · 1:1 1080x1080 · 16:9 1920x1080).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:12\"> Nomenclatura: <code>CLIENTE_CONCEITO_GANCHO_FORMATO_vX_AAAAMMDD<\/code>.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:13\"> Arquivo .srt incluso quando houver fala.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:14\"> Assistido do início ao fim no celular antes de enviar.<\/li>\n<\/ul>\n<p><strong>Conformidade (ver T06)<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:15\"> Sem pessoa real gerada sem consentimento; sem depoimento falso.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:templates:16\"> Aviso de conteúdo gerado/alterado por IA quando a plataforma ou a lei exigir.<\/li>\n<\/ul>\n<p>Meta: ≥ 85% dos itens em todas as entregas.<\/p>\n<h2 id=\"t06--política-de-uso-de-ia-modelo-para-o-site-en\">T06 — Política de uso de IA (modelo para o site, EN)<\/h2>\n<pre><code>AI USE POLICY\n\nHow I use AI\nI use generative AI tools (for example, Google Veo via Flow, Kling and image models) to create\nproduct shots, B-roll, backgrounds and visual concepts. Every ad is edited, sound-designed and\ncolor-graded by me, and reviewed by a human before delivery.\n\nWhat I never do\n• Generate real, identifiable people without their written consent.\n• Create fake testimonials or reviews, or show AI characters as real customers.\n• Alter a real product or property to look better or different than it really is.\n• Copy other brands' trademarks, characters or creative work.\n\nTransparency\n• Portfolio pieces are labeled as AI-generated, hybrid, or real footage.\n• When a platform or law requires disclosure of AI-generated or altered content\n  (for example, deepfake disclosure under the EU AI Act, or Meta's disclosure rules for\n  social issue, electoral and political ads), I flag it to the client and help apply it.\n\nLicenses\nI use only tools and assets whose terms allow commercial use on my plan, and I keep a record\nof the tools used in each project.\n\nQuestions? [email]\nLast reviewed: [date] — reviewed every 3 months.\n<\/code><\/pre>"}, "ferramentas": {"title": "Ferramentas e custos", "group": "Recursos", "html": "<blockquote>\n<p>Preços pesquisados em 07/11/2026, em sua maioria em fontes secundárias (comparadores e blogs) e em dólar. Os vendedores mudam planos com frequência e cobram preços regionais — <strong>confira a página oficial antes de assinar<\/strong>. Câmbio de referência: US$ 1 ≈ R$ 5,51 (06/11/2026). Fontes em <a href=\"#doc/pesquisa/5-ferramentas--situação-atual-resumo-tabela-completa-em-06-ferramentas\">00-DIAGNOSTICO/pesquisa-de-mercado.md<\/a>.<\/p>\n<\/blockquote>\n<h2 id=\"1-regras-de-compra\">1. Regras de compra<\/h2>\n<ol>\n<li><strong>Mês 1 = R$ 0.<\/strong> Só planos gratuitos.<\/li>\n<li><strong>Uma assinatura de IA por vez.<\/strong> A primeira só depois do Dia 30, e só se você usou os créditos grátis em ≥ 10 dias e terminou ≥ 4 anúncios.<\/li>\n<li><strong>Ferramenta nova precisa pagar com o próximo projeto.<\/strong> Custo de ferramentas por projeto ≤ 10–15% do preço.<\/li>\n<li><strong>Teto mensal:<\/strong> até R$ 200 nos Meses 2–3 sem receita internacional; depois, até 15% da receita do mês.<\/li>\n<li><strong>Cancele o que não usou em 7 dias<\/strong> antes da renovação.<\/li>\n<li><strong>Não dependa de um modelo de IA.<\/strong> O Sora foi descontinuado em 2026; outras ferramentas podem mudar. Seu valor está no processo (roteiro, edição, teste), não na ferramenta.<\/li>\n<\/ol>\n<h2 id=\"2-tabela-de-ferramentas\">2. Tabela de ferramentas<\/h2>\n<h3 id=\"geração-de-vídeo-por-ia\">Geração de vídeo por IA<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Ferramenta<\/th>\n<th>O que faz<\/th>\n<th>Por que você precisa<\/th>\n<th>Quando aprender<\/th>\n<th>Preço (referência)<\/th>\n<th>Alternativa grátis<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Google Flow (Veo 3.1)<\/strong> — via Google AI Pro<\/td>\n<td>Texto/imagem → vídeo, frames inicial/final, referências<\/td>\n<td>Qualidade alta + vem junto com Gemini (imagem e texto) e armazenamento<\/td>\n<td>Dia 6 (grátis), assinatura no Dia 31<\/td>\n<td>Google AI Pro: US$ 19,99/mês nos EUA, ~1.000 créditos Flow/mês; Lite ~10 créditos, Fast ~20, Quality ~100 por geração<\/td>\n<td>~50 créditos grátis/dia para não assinantes, resolução menor (fontes secundárias)<\/td>\n<td><strong>Indispensável a partir do Mês 2<\/strong> (1º plano pago)<\/td>\n<\/tr>\n<tr>\n<td><strong>Kling (3.0)<\/strong><\/td>\n<td>Imagem → vídeo, bom em movimento e referências<\/td>\n<td>Segunda opção quando o Veo não obedece; comparar resultados<\/td>\n<td>Dia 6 (grátis)<\/td>\n<td>Plano de entrada ~US$ 7–10/mês; cobra por segundo (fontes divergem)<\/td>\n<td>Créditos grátis diários, com marca d'água e uso não comercial<\/td>\n<td>Opcional (grátis para treino; pago só com cliente)<\/td>\n<\/tr>\n<tr>\n<td>Runway<\/td>\n<td>Vídeo com IA + ferramentas de edição<\/td>\n<td>Alternativa; alguns recursos de controle de câmera<\/td>\n<td>Opcional<\/td>\n<td>Standard ~US$ 15/mês · Pro ~US$ 35<\/td>\n<td>125 créditos únicos<\/td>\n<td>Opcional<\/td>\n<\/tr>\n<tr>\n<td>Higgsfield<\/td>\n<td>Agregador (vários modelos numa assinatura)<\/td>\n<td>Acesso a vários modelos quando a demanda crescer<\/td>\n<td>Mês 4+ (se fizer sentido)<\/td>\n<td>~US$ 15–129/mês (muda com frequência)<\/td>\n<td>Plano grátis limitado<\/td>\n<td>Opcional<\/td>\n<\/tr>\n<tr>\n<td>Seedance (via Dreamina)<\/td>\n<td>Vídeo com IA (ByteDance)<\/td>\n<td>Alternativa de custo por segundo<\/td>\n<td>Opcional<\/td>\n<td>~US$ 18–84/mês (fonte secundária)<\/td>\n<td>Créditos de teste<\/td>\n<td>Opcional<\/td>\n<\/tr>\n<tr>\n<td>~~Sora~~<\/td>\n<td>—<\/td>\n<td><strong>Descontinuado<\/strong> (app abr/2026, API set/2026)<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>Não usar<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"geração-de-imagens\">Geração de imagens<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Ferramenta<\/th>\n<th>O que faz<\/th>\n<th>Por que<\/th>\n<th>Quando<\/th>\n<th>Preço<\/th>\n<th>Alternativa grátis<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Gemini (Nano Banana)<\/strong><\/td>\n<td>Geração e edição de imagem com referências<\/td>\n<td>Packshots, cenas, frames iniciais para vídeo, estáticos<\/td>\n<td>Dia 5<\/td>\n<td>Incluso no Google AI Pro (limites maiores)<\/td>\n<td>Uso grátis com limite diário (limites mudam)<\/td>\n<td><strong>Indispensável<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Midjourney<\/td>\n<td>Imagens estéticas de alta qualidade<\/td>\n<td>Moodboards e estéticas específicas<\/td>\n<td>Opcional, Mês 4+<\/td>\n<td>Basic ~US$ 10/mês; sem plano grátis<\/td>\n<td>Gemini<\/td>\n<td>Opcional<\/td>\n<\/tr>\n<tr>\n<td>Canva<\/td>\n<td>Layout de estáticos, one-pagers, decks<\/td>\n<td>Estáticos e materiais de venda<\/td>\n<td>Dia 17<\/td>\n<td>Grátis (Pro opcional)<\/td>\n<td>Photopea<\/td>\n<td><strong>Indispensável (grátis)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Photopea<\/td>\n<td>Editor de imagem no navegador<\/td>\n<td>Ajustes rápidos, recortes<\/td>\n<td>Quando precisar<\/td>\n<td>Grátis (com anúncios)<\/td>\n<td>—<\/td>\n<td>Opcional<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"edição-de-vídeo\">Edição de vídeo<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Ferramenta<\/th>\n<th>O que faz<\/th>\n<th>Por que<\/th>\n<th>Quando<\/th>\n<th>Preço<\/th>\n<th>Alternativa grátis<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>DaVinci Resolve (grátis)<\/strong><\/td>\n<td>Edição, cor, áudio (Fairlight), motion (Fusion), exportação<\/td>\n<td>Nível profissional sem custo; padrão de cor do mercado<\/td>\n<td>Dia 1<\/td>\n<td>R$ 0 (exporta até UHD, a câmera traseira já basta para o UGC híbrido e para filmagem de produto.<\/li>\n<\/ul>"}, "recursos": {"title": "Cursos e recursos", "group": "Recursos", "html": "<blockquote>\n<p>Regra: nenhum curso caro neste plano. Todo recurso é consumido <strong>dentro<\/strong> de um bloco de prática — você assiste 20–40 min e produz no mesmo dia. Quando um link mudar, busque o nome indicado. Os canais do YouTube citados são de criadores conhecidos na área; veja sempre o vídeo mais recente sobre o tema, porque as ferramentas mudam.<\/p>\n<\/blockquote>\n<h2 id=\"edição-davinci-resolve\">Edição (DaVinci Resolve)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Recurso<\/th>\n<th>Formato<\/th>\n<th>Custo<\/th>\n<th>Usado em<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Blackmagic Design — treinamento oficial (vídeos e guias em PDF: edição, cor, Fairlight, Fusion) — blackmagicdesign.com/products/davinciresolve/training<\/td>\n<td>Vídeo + PDF<\/td>\n<td>Grátis<\/td>\n<td>Dias 2, 11, 18, 32, 37, 44, 51, 99<\/td>\n<\/tr>\n<tr>\n<td>Casey Faris (YouTube) — tutoriais de DaVinci do básico ao avançado<\/td>\n<td>Vídeo (EN)<\/td>\n<td>Grátis<\/td>\n<td>Dias 2, 8<\/td>\n<\/tr>\n<tr>\n<td>MrAlexTech (YouTube) — dicas de edição e Fusion<\/td>\n<td>Vídeo (EN)<\/td>\n<td>Grátis<\/td>\n<td>Dias 8, 99<\/td>\n<\/tr>\n<tr>\n<td>Darren Mostyn (YouTube) — cor no DaVinci<\/td>\n<td>Vídeo (EN)<\/td>\n<td>Grátis<\/td>\n<td>Dias 32, 95<\/td>\n<\/tr>\n<tr>\n<td>Cullen Kelly (YouTube/podcast) — conceitos de cor<\/td>\n<td>Vídeo (EN)<\/td>\n<td>Grátis<\/td>\n<td>Dias 32, 95<\/td>\n<\/tr>\n<tr>\n<td>Subtitle Edit — documentação (Whisper)<\/td>\n<td>Texto<\/td>\n<td>Grátis<\/td>\n<td>Dia 9<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"vídeo-e-imagem-com-ia\">Vídeo e imagem com IA<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Recurso<\/th>\n<th>Formato<\/th>\n<th>Custo<\/th>\n<th>Usado em<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google — Central de Ajuda do Flow e guia de prompts do V >\n<tr>\n<td>Dara Denney (YouTube) — criativos de performance, ganchos, métricas<\/td>\n<td>Vídeo (EN)<\/td>\n<td>Grátis<\/td>\n<td>Dias 4, 22, inglês Semanas 9–17<\/td>\n<\/tr>\n<tr>\n<td>Motion (motionapp.com) — blog e materiais sobre analytics de criativos<\/td>\n<td>Texto/Vídeo (EN)<\/td>\n<td>Grátis<\/td>\n<td>Dias 22, 74<\/td>\n<\/tr>\n<tr>\n<td>Foreplay (foreplay.co) — blog sobre estratégia criativa e swipe files<\/td>\n<td>Texto (EN)<\/td>\n<td>Grátis (ferramenta paga não é necessária)<\/td>\n<td>Dias 92<\/td>\n<\/tr>\n<tr>\n<td>Swiped.co — arquivo de anúncios clássicos<\/td>\n<td>Texto (EN)<\/td>\n<td>Grátis<\/td>\n<td>Dia 43<\/td>\n<\/tr>\n<tr>\n<td>CXL / Unbounce (blogs) — landing pages e \"message match\"<\/td>\n<td>Texto (EN)<\/td>\n<td>Grátis<\/td>\n<td>Dia 127<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"vendas-prospecção-e-negócio\">Vendas, prospecção e negócio<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Recurso<\/th>\n<th>Formato<\/th>\n<th>Custo<\/th>\n<th>Usado em<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Upwork Help Center (perfil, propostas, Connects, taxas)<\/td>\n<td>Texto<\/td>\n<td>Grátis<\/td>\n<td>Dia 39<\/td>\n<\/tr>\n<tr>\n<td>HubSpot Academy — cursos gratuitos de vendas<\/td>\n<td>Curso<\/td>\n<td>Grátis<\/td>\n<td>Opcional (Semana 11)<\/td>\n<\/tr>\n<tr>\n<td>\"$100M Offers\" — Alex Hormozi<\/td>\n<td>Livro<\/td>\n<td>Barato<\/td>\n<td>Opcional (montagem de oferta, Mês 3)<\/td>\n<\/tr>\n<tr>\n<td>\"Never Split the Difference\" — Chris Voss<\/td>\n<td>Livro<\/td>\n<td>Barato<\/td>\n<td>Opcional (negociação, Semana 12)<\/td>\n<\/tr>\n<tr>\n<td>05-PROSPECCAO (scripts e templates deste plano)<\/td>\n<td>Texto<\/td>\n<td>—<\/td>\n<td>Todo o plano<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"inglês\">Inglês<\/h2>\n<p>Ver <a href=\"#doc/ingles/recursos\">04-INGLES/plano-de-ingles.md<\/a>: EF SET, BBC Learning English, VOA, YouGlish, ChatGPT Voice/Gemini Live, Tandem/HelloTalk, Anki, Cambly/Preply (opcional).<\/p>\n<h2 id=\"finanças-impostos-e-mobilidade-fontes-oficiais-para-confirmar\">Finanças, impostos e mobilidade (fontes oficiais para confirmar)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Recurso<\/th>\n<th>Para quê<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Receita Federal (gov.br/receitafederal)<\/td>\n<td>Carnê-leão, IRPF, regras de rendimentos do exterior<\/td>\n<\/tr>\n<tr>\n<td>Portal do Empreendedor (gov.br/mei)<\/td>\n<td>Ocupações permitidas ao MEI e limites<\/td>\n<\/tr>\n<tr>\n<td>Banco Central (bcb.gov.br)<\/td>\n<td>Câmbio (PTAX) e regras de câmbio<\/td>\n<\/tr>\n<tr>\n<td>Sites oficiais de imigração/consulados (Portugal — AIMA/consulados; Espanha; Colômbia — Cancillería; Argentina — Migraciones)<\/td>\n<td>Vistos e residência<\/td>\n<\/tr>\n<tr>\n<td>Numbeo<\/td>\n<td>Custo de vida por cidade (dados colaborativos, use como estimativa)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, "prompts": {"title": "Biblioteca de prompts", "group": "Recursos", "html": "<blockquote>\n<p>Modelos iniciais. Sua biblioteca real fica na aba \"Biblioteca de Prompts\" da planilha, com nota de resultado. Escreva prompts de imagem e vídeo <strong>em inglês<\/strong> (os modelos entendem melhor e você treina vocabulário).<\/p>\n<\/blockquote>\n<h2 id=\"p-img--imagem-de-produto\">P-IMG — imagem de produto<\/h2>\n<pre><code>[PRODUCT: exact description, repeated identically in every prompt — material, color, shape, label]\n[SETTING: where it is]\n[LIGHTING: soft window light / softbox from the left / golden hour / rim light / high-key / low-key]\n[CAMERA: 35mm / 50mm / 85mm / 100mm macro · angle: eye level / top-down flat lay / low angle]\n[COMPOSITION: centered hero shot / rule of thirds / negative space on the right for text]\n[STYLE: photorealistic commercial product photography, natural textures, subtle reflections]\n[CONSTRAINTS: no text, no extra logos, no people, no hands]  ← remova o que não se aplica\n<\/code><\/pre>\n<p>Exemplo:<\/p>\n<blockquote>\n<p>A matte black aluminum can of iced coffee with a minimalist white label, on a wooden breakfast table by a window, soft morning light from the left, condensation drops on the can, shot on 85mm, shallow depth of field, negative space on the right, photorealistic commercial product photography, no extra text.<\/p>\n<\/blockquote>\n<p><strong>Dicas:<\/strong> gere o packshot primeiro e use-o como referência; repita a descrição do produto palavra por palavra; texto e logos gerados por IA costumam sair errados — aplique na edição.<\/p>\n<h2 id=\"p-vid--image-to-video-ou-text-to-video\">P-VID — image-to-video (ou text-to-video)<\/h2>\n<pre><code>[SHOT: what happens — one action only]\n[CAMERA: slow push-in / dolly out / orbit left / crane up / handheld subtle / locked-off static]\n[SPEED: slow, subtle, smooth]\n[LIGHT/ATMOSPHERE: if it changes]\n[DURATION: 5–8 seconds]\n[AVOID: morphing, text changes, extra objects, camera shake]  ← se a ferramenta aceitar prompt negativo\n<\/code><\/pre>\n<p>Exemplos:<\/p>\n<ul>\n<li>Hero shot: \"Slow orbit around the bottle on a dark glossy surface, thin rim light outlining the edges, tiny particles floating, smooth and premium, 6 seconds.\"<\/li>\n<li>Comida: \"Extreme close-up of melted cheese stretching as a burger is pulled apart, steam rising, warm light, slow motion, 5 seconds.\"<\/li>\n<li>Imóvel: \"Very slow dolly forward through the living room, natural daylight from the windows, no changes to furniture or architecture, 6 seconds.\"<\/li>\n<li>Splash: \"Orange slices and water splash around the serum bottle in slow motion, studio lighting, clean white background, 5 seconds.\"<\/li>\n<\/ul>\n<p><strong>Regra:<\/strong> em image-to-video descreva <strong>movimento e ação<\/strong>, não o visual (a imagem já define o visual).<\/p>\n<h2 id=\"p-roteiro--roteiro-de-anúncio\">P-ROTEIRO — roteiro de anúncio<\/h2>\n<pre><code>You are a senior performance creative strategist for e-commerce brands.\nProduct: [ ] · Price/offer: [ ] · Customer: [ ] · Main pain: [ ] · Proof we can legally use: [ ]\nWrite 3 scripts for [15/20/30]-second [platform] video ads, each with a DIFFERENT concept:\n(1) problem-solution, (2) product demo, (3) &quot;3 reasons&quot;.\nFor each: hook (first 2 seconds, works without sound), on-screen text, voiceover (max [45] words\nfor 20 s), shot list (5–6 shots), CTA. No health claims, no fake testimonials, no invented numbers.\n<\/code><\/pre>\n<h2 id=\"p-critica--crítica-de-roteiroanúncio\">P-CRITICA — crítica de roteiro/anúncio<\/h2>\n<pre><code>Act as a skeptical head of growth at a DTC brand who reviews 50 ads a week.\nCritique this ad script/storyboard: [ ].\nScore 1–10 for: hook strength, clarity of benefit, believability, differentiation from typical ads, CTA.\nThen give me the 3 most important changes, and rewrite only the hook in 3 stronger ways.\n<\/code><\/pre>\n<h2 id=\"p-pesquisa--mineração-de-avaliações-dia-92\">P-PESQUISA — mineração de avaliações (Dia 92)<\/h2>\n<pre><code>Below are customer reviews and comments about [category/product].\nGroup them into themes. For each theme give: persona, pain or desire, the exact customer quote\n(copy literally), the objection it reveals, and one ad hook idea based on the quote.\nReturn a table. Do not invent quotes.\nReviews: &quot;&quot;&quot;[cole os trechos com a fonte]&quot;&quot;&quot;\n<\/code><\/pre>\n<h2 id=\"p-ing-1-p-ing-2-p-ing-3--inglês\">P-ING-1, P-ING-2, P-ING-3 — inglês<\/h2>\n<p>Ver <a href=\"#doc/ingles/prompts-de-ia-para-inglês\">04-INGLES/plano-de-ingles.md<\/a>.<\/p>\n<h2 id=\"p-loom--tópicos-para-teardown-dia-67\">P-LOOM — tópicos para teardown (Dia 67)<\/h2>\n<pre><code>I'm recording a 2-minute Loom for [Brand]'s founder about their Meta ads.\nHere's what I observed: [observações].\nGive me bullet points (not a script) for: 10-second intro, what's working (2 points),\n2 opportunities, 1 concrete ad idea, 10-second invitation. Simple English (B1–B2), friendly, specific.\n<\/code><\/pre>"}, "financeiro": {"title": "Plano financeiro", "group": "Finanças", "html": "<blockquote>\n<p><strong>Aviso:<\/strong> isto é planejamento, não consultoria tributária, jurídica ou de investimentos. Regras fiscais e de imigração foram pesquisadas em fontes de 2026 que <strong>divergem em pontos importantes<\/strong>; confirme com um contador especializado em exportação de serviços e nos sites oficiais. Câmbio de referência: US$ 1 ≈ R$ 5,51 (06/11/2026) · € 1 ≈ R$ 6,14 (média de 05/11/2026).<\/p>\n<\/blockquote>\n<h2 id=\"1-ponto-de-partida-preencha-no-dia-1\">1. Ponto de partida (preencha no Dia 1)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Valor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Renda mensal atual<\/td>\n<td>R$ 1.500 (2 clientes)<\/td>\n<\/tr>\n<tr>\n<td>Custo de vida mensal real (média dos últimos 3 extratos)<\/td>\n<td>R$ ______<\/td>\n<\/tr>\n<tr>\n<td>Reserva atual<\/td>\n<td>R$ ______ (= ____ meses de custo de vida)<\/td>\n<\/tr>\n<tr>\n<td>Dívidas (valor e parcela)<\/td>\n<td>R$ ______<\/td>\n<\/tr>\n<tr>\n<td>Forma jurídica da MM<\/td>\n<td>MEI / ME / informal: ______<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Regras de ouro da transição<\/strong><\/p>\n<ol>\n<li><strong>Não abandone a renda brasileira antes do Marco 3.<\/strong> Gestão de tráfego é remota por natureza — clientes brasileiros podem continuar com você mesmo viajando.<\/li>\n<li><strong>Contas separadas:<\/strong> uma conta só para o negócio (receitas e ferramentas) e outra pessoal.<\/li>\n<li><strong>Guarde 25–30% de toda receita internacional<\/strong> numa conta separada até o contador definir o regime — melhor sobrar do que faltar.<\/li>\n<li><strong>Reinvista com teto:<\/strong> ferramentas ≤ 15% da receita do mês (ver <a href=\"#doc/ferramentas\">06-FERRAMENTAS<\/a>).<\/li>\n<\/ol>\n<h2 id=\"2-custos-da-transição\">2. Custos da transição<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Mês 1<\/th>\n<th>Mês 2<\/th>\n<th>Mês 3<\/th>\n<th>Meses 4–6<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>IA (Google AI Pro; outros só com cliente)<\/td>\n<td>R$ 0<\/td>\n<td>~R$ 100–130 (confira o preço em reais)<\/td>\n<td>idem<\/td>\n<td>idem + eventual 2ª ferramenta<\/td>\n<\/tr>\n<tr>\n<td>Upwork Connects<\/td>\n<td>R$ 0<\/td>\n<td>~R$ 30–55<\/td>\n<td>~R$ 30–80<\/td>\n<td>~R$ 30–80<\/td>\n<\/tr>\n<tr>\n<td>Domínio + e-mail profissional<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>~R$ 40–80<\/td>\n<td>idem<\/td>\n<\/tr>\n<tr>\n<td>Voz (ElevenLabs Starter), só com cliente<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>~R$ 35<\/td>\n<\/tr>\n<tr>\n<td>Professor de inglês (opcional)<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>variável<\/td>\n<td>variável<\/td>\n<\/tr>\n<tr>\n<td>Cursos<\/td>\n<td>R$ 0<\/td>\n<td>R$ 0<\/td>\n<td>R$ 0<\/td>\n<td>R$ 0<\/td>\n<\/tr>\n<tr>\n<td><strong>Total estimado<\/strong><\/td>\n<td><strong>R$ 0<\/strong><\/td>\n<td><strong>~R$ 110–180<\/strong><\/td>\n<td><strong>~R$ 200–350<\/strong><\/td>\n<td><strong>≤ 15% da receita<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Equipamento (notebook, SSD, microfone) só entra depois do Dia 158, com lista e preço, e pago com receita — não com reserva.<\/p>\n<h2 id=\"3-cenários-de-renda-estimativas--não-são-promessas\">3. Cenários de renda (estimativas — não são promessas)<\/h2>\n<p>Valores brutos mensais (antes de impostos, taxas e câmbio). Conversão a US$ 1 = R$ 5,51.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mês<\/th>\n<th>Conservador<\/th>\n<th>Realista<\/th>\n<th>Ambicioso<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>BR R$ 1.500 + US$ 0 = <strong>R$ 1.500<\/strong><\/td>\n<td>BR R$ 2.000 + US$ 0 = <strong>R$ 2.000<\/strong><\/td>\n<td>BR R$ 2.500 + US$ 100 ≈ <strong>R$ 3.050<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>BR R$ 1.650 + US$ 0 = <strong>R$ 1.650<\/strong><\/td>\n<td>BR R$ 2.200 + US$ 50 ≈ <strong>R$ 2.475<\/strong><\/td>\n<td>BR R$ 3.000 + US$ 300 ≈ <strong>R$ 4.655<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>BR R$ 1.800 + US$ 0 = <strong>R$ 1.800<\/strong><\/td>\n<td>BR R$ 2.500 + US$ 200 ≈ <strong>R$ 3.600<\/strong><\/td>\n<td>BR R$ 3.500 + US$ 700 ≈ <strong>R$ 7.355<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>BR R$ 2.000 + US$ 75 ≈ <strong>R$ 2.415<\/strong><\/td>\n<td>BR R$ 3.000 + US$ 450 ≈ <strong>R$ 5.480<\/strong><\/td>\n<td>BR R$ 4.000 + US$ 1.200 ≈ <strong>R$ 10.610<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>BR R$ 2.200 + US$ 225 ≈ <strong>R$ 3.440<\/strong><\/td>\n<td>BR R$ 3.000 + US$ 750 ≈ <strong>R$ 7.130<\/strong><\/td>\n<td>BR R$ 4.500 + US$ 2.000 ≈ <strong>R$ 15.520<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>BR R$ 2.500 + US$ 400 ≈ <strong>R$ 4.705<\/strong><\/td>\n<td>BR R$ 3.500 + US$ 1.100 ≈ <strong>R$ 9.560<\/strong><\/td>\n<td>BR R$ 5.000 + US$ 3.000 ≈ <strong>R$ 21.530<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Como esses números foram pensados:<\/strong><\/p>\n<ul>\n<li>Brasil: +1 cliente ou upsell a cada 1–2 meses no realista, com ticket subindo de ~R$ 750 para ~R$ 1.200–1.800 com criativos.<\/li>\n<li>Internacional: preços-guia de entrada (Pilot US$ 250–400; Sprint US$ 800–1.200/mês) e faixas de mercado da <a href=\"#doc/pesquisa\">pesquisa<\/a>. O realista assume ~1 piloto no Mês 3 e 1 cliente recorrente entre os Meses 4–6.<\/li>\n<li><strong>Limite de capacidade:<\/strong> com 3 h/dia, sobram ~10–14 h/semana para entrega nos Meses 4–6. O cenário ambicioso exige preço maior <strong>ou<\/strong> mais horas — é uma decisão sua, não uma meta obrigatória.<\/li>\n<li><strong>Cenário de falha honesto:<\/strong> é possível chegar ao Dia 120 sem cliente internacional. O plano prevê a estratégia alternativa (Dia 90/120) e o Brasil como base. Isso não invalida a transição — só a atrasa.<\/li>\n<\/ul>\n<h2 id=\"4-reserva-financeira\">4. Reserva financeira<\/h2>\n<p><strong>Ordem de prioridade:<\/strong><\/p>\n<ol>\n<li>Reserva de emergência no Brasil: <strong>3 meses de custo de vida<\/strong> (antes de qualquer gasto com equipamento).<\/li>\n<li>Reserva de transição: <strong>6 meses de custo de vida no destino<\/strong> + passagem de volta + seguro.<\/li>\n<\/ol>\n<p><strong>Regra de distribuição do que você ganhar acima da renda-base (R$ 1.500 + ferramentas):<\/strong><\/p>\n<ul>\n<li>50% → reserva<\/li>\n<li>30% → reinvestimento (ferramentas, equipamento, professor de inglês)<\/li>\n<li>20% → qualidade de vida (sim, isso evita burnout)<\/li>\n<\/ul>\n<p>Mantenha a reserva em aplicação de liquidez diária e, quando a receita internacional começar, uma parte em dólar/euro para reduzir o efeito do câmbio. Para escolher produtos de investimento, procure orientação específica.<\/p>\n<h2 id=\"5-os-4-marcos-diferenças-importantes\">5. Os 4 marcos (diferenças importantes)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Marco<\/th>\n<th>Definição objetiva<\/th>\n<th>Estimativa (realista)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Começar a receber em moeda forte<\/strong><\/td>\n<td>Primeiro pagamento ≥ US$/€ 50 recebido e sacado, com contrato/fatura/comprovante guardados<\/td>\n<td>Meses 2–3<\/td>\n<\/tr>\n<tr>\n<td><strong>2. Renda recorrente internacional<\/strong><\/td>\n<td>≥ 1 cliente pagando todo mês por ≥ 2 meses seguidos, somando ≥ US$ 500/mês<\/td>\n<td>Meses 5–7<\/td>\n<\/tr>\n<tr>\n<td><strong>3. Sustentar suas despesas<\/strong><\/td>\n<td>Renda <strong>líquida<\/strong> total (após impostos e ferramentas) ≥ 100% do custo de vida por 3 meses seguidos <strong>e<\/strong> renda internacional ≥ 50% do custo de vida<\/td>\n<td>Meses 5–9 (depende do seu custo de vida)<\/td>\n<\/tr>\n<tr>\n<td><strong>4. Preparado para viajar<\/strong><\/td>\n<td>Todos os itens abaixo<\/td>\n<td>Meses 9–15<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Checklist do Marco 4 — \"preparado para viajar\":<\/strong><\/p>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:financeiro:1\"> Renda internacional líquida ≥ 1,3× o custo de vida no destino, por 3 meses seguidos.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:financeiro:2\"> ≥ 3 clientes e nenhum com mais de 40% da receita internacional.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:financeiro:3\"> Reserva ≥ 6 meses de custo de vida no destino + passagem de volta.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:financeiro:4\"> Situação fiscal regular, com contador acompanhando.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:financeiro:5\"> Rota legal de estada confirmada no site oficial (visto/residência/prazo de turismo).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:financeiro:6\"> Seguro saúde válido no destino.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:financeiro:7\"> Kit de trabalho remoto pronto e \"teste nômade\" (1–2 semanas fora de casa) concluído com entregas no prazo.<\/li>\n<\/ul>\n<p><strong>Quando considerar a rotina nômade:<\/strong><\/p>\n<ul>\n<li>Antes do Marco 3: só o teste nômade dentro do Brasil.<\/li>\n<li>Marco 3 atingido: viagens curtas (≤ 30 dias) para destinos próximos e baratos, mantendo os clientes brasileiros.<\/li>\n<li>Marco 4 atingido: planejar a primeira base de 3 meses.<\/li>\n<\/ul>\n<h2 id=\"6-impostos-e-obrigações-que-você-deve-pesquisar-com-o-contador\">6. Impostos e obrigações que você deve pesquisar (com o contador)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tema<\/th>\n<th>O que as fontes de 2026 dizem<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MEI<\/strong><\/td>\n<td>Gestão de tráfego <strong>não<\/strong> é ocupação permitida ao MEI (CNAE 6319-4/00 citado). \"Editor(a) de vídeo independente\" consta como permitida (CNAE 5912-0/99), mas fontes divergem sobre o alcance. Limite de faturamento: R$ 81 mil/ano em 2026; uma fonte cita a LC 238/2026 elevando para R$ 110 mil (2027) e R$ 140 mil (2028).<\/td>\n<td>Confirmar no Portal do Empreendedor<\/td>\n<\/tr>\n<tr>\n<td><strong>ME no Simples Nacional<\/strong><\/td>\n<td>Caminho mais citado para marketing digital. CNAE 7319-0/03 (marketing direto) aparece no Anexo III (alíquota inicial 6%); fontes divergem se está sujeito ao Fator R (se estiver: Fator R ≥ 28% → Anexo III; &lt; 28% → Anexo V, a partir de 15,5%).<\/td>\n<td>Confirmar com contador<\/td>\n<\/tr>\n<tr>\n<td><strong>Exportação de serviços<\/strong><\/td>\n<td>ISS não incide quando o resultado do serviço ocorre no exterior (LC 116/2003, art. 2º, I). No Simples, PIS/Cofins não incidem sobre receita de exportação com entrada de divisas; a receita é segregada no PGDAS-D (o DAS diminui, não zera). Isenção de ISS pode depender da análise da prefeitura.<\/td>\n<td>Confirmar regras de Goiânia<\/td>\n<\/tr>\n<tr>\n<td><strong>Nota fiscal<\/strong><\/td>\n<td>NFS-e de exportação; uma fonte cita o padrão nacional obrigatório para ME/EPP do Simples a partir de 01/11/2026 (Resolução CGSN 191/2026).<\/td>\n<td>Confirmar<\/td>\n<\/tr>\n<tr>\n<td><strong>Pessoa física (sem CNPJ)<\/strong><\/td>\n<td>Recebimentos do exterior: carnê-leão mensal pela tabela progressiva. A Lei 15.270/2025 (vigente desde 01/01/2026) zera o IR para rendimentos tributáveis de até R$ 5 mil/mês, mas uma fonte indica que o desconto não é automático no carnê-leão — ponto incerto.<\/td>\n<td>Confirmar na Receita<\/td>\n<\/tr>\n<tr>\n<td><strong>IOF<\/strong><\/td>\n<td>Entrada (conversão de dólar recebido): a maioria das fontes indica 0,38%; uma cita 1,1%. Saída para conta própria no exterior: 3,5% (Decreto 12.466/2025, segundo as fontes). Isso importa quando você for gastar no exterior.<\/td>\n<td>Confirmar<\/td>\n<\/tr>\n<tr>\n<td><strong>Reforma tributária (CBS/IBS)<\/strong><\/td>\n<td>2026 é fase de teste (alíquota informativa de ~1%: 0,9% CBS + 0,1% IBS); fontes dizem que o Simples fica dispensado de destacar em 2026. Exportações tendem a seguir desoneradas — confirme no texto da LC 214/2025.<\/td>\n<td>Acompanhar em 2027<\/td>\n<\/tr>\n<tr>\n<td><strong>Saldo no exterior (Wise etc.)<\/strong><\/td>\n<td>Declarar em \"Bens e Direitos\" no IRPF; a Lei 14.754/2023 trata de aplicações financeiras no exterior — confirme como se aplica a saldos em conta.<\/td>\n<td>Confirmar<\/td>\n<\/tr>\n<tr>\n<td><strong>Residência fiscal ao morar fora<\/strong><\/td>\n<td>Ao sair do Brasil por longos períodos, existem regras de saída definitiva e risco de dupla tributação.<\/td>\n<td>Pesquisar antes do Marco 4<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Quando procurar o contador:<\/strong> no primeiro recebimento internacional relevante (&gt; US$ 500) ou no Dia 148, o que vier primeiro. Leve: receitas por mês e origem, contratos, faturas, comprovantes, atividades exercidas.<\/p>\n<h2 id=\"7-recebimentos-internacionais--opções-e-cuidados\">7. Recebimentos internacionais — opções e cuidados<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Meio<\/th>\n<th>Quando usar<\/th>\n<th>Custos/observações<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Upwork<\/strong><\/td>\n<td>Clientes do Upwork<\/td>\n<td>Taxa de 0–15% por contrato + custo de saque; proteção de pagamento (escrow)<\/td>\n<\/tr>\n<tr>\n<td><strong>Wise<\/strong><\/td>\n<td>Clientes diretos (transferência ACH/SEPA para seus dados de conta em USD/EUR)<\/td>\n<td>Taxa de conversão + IOF; compare o custo total com outras opções<\/td>\n<\/tr>\n<tr>\n<td><strong>Payoneer<\/strong><\/td>\n<td>Marketplaces e cobrança de clientes<\/td>\n<td>Cobrança por cartão tem taxa alta (um guia cita 3,99% + US$ 0,49); prefira transferência<\/td>\n<\/tr>\n<tr>\n<td>PayPal<\/td>\n<td>Evite para valores altos<\/td>\n<td>Taxas + câmbio desfavorável + risco de estorno<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Cuidados:<\/strong><\/p>\n<ul>\n<li>Pagamento <strong>antes<\/strong> (100% no Pilot de cliente novo; 50% nos demais); entregue versões com marca d'água até o pagamento final.<\/li>\n<li>Fatura em inglês com moeda, vencimento e quem paga as taxas de transferência.<\/li>\n<li>Guarde contrato + fatura + comprovante de câmbio de <strong>todo<\/strong> recebimento (prova de exportação).<\/li>\n<li>Golpes comuns: cheque/sobrepagamento (\"pagamos a mais, devolva a diferença\"), \"compre o equipamento do nosso fornecedor\", cliente que pede para sair do Upwork logo no início (viola os termos e tira sua proteção).<\/li>\n<li>Nunca use conta de terceiros para receber.<\/li>\n<\/ul>\n<h2 id=\"8-destinos-e-rotas-legais-pesquisa-inicial--confirme-nos-sites-oficiais\">8. Destinos e rotas legais (pesquisa inicial — confirme nos sites oficiais)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Destino<\/th>\n<th>Rota para brasileiros<\/th>\n<th>Exigência de renda (2026)<\/th>\n<th>Em reais<\/th>\n<th>Observações<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Argentina, Uruguai, Paraguai e outros do Mercosul<\/td>\n<td>Acordo de Residência do Mercosul (residência temporária → permanente) e entrada como turista com documento de identidade<\/td>\n<td>Não é um visto de renda; exige documentação (confirmar por país)<\/td>\n<td>—<\/td>\n<td>Fuso próximo do Brasil (bom para clientes da costa leste dos EUA). <strong>Não pesquisado em detalhe — confirme nos consulados<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Colômbia<\/td>\n<td>Visto de nômade digital (até 2 anos)<\/td>\n<td>3 salários mínimos colombianos: COP 5.252.715/mês<\/td>\n<td>conversão do dia<\/td>\n<td>Fuso UTC-5, igual ao leste dos EUA<\/td>\n<\/tr>\n<tr>\n<td>Espanha<\/td>\n<td>Visto de nômade digital<\/td>\n<td>200% do salário mínimo: ~€ 2.849/mês (uma fonte mantém € 2.762)<\/td>\n<td>≈ R$ 17.500<\/td>\n<td>No máximo 20% da renda de fontes espanholas<\/td>\n<\/tr>\n<tr>\n<td>Portugal<\/td>\n<td>Visto D8 (nômade digital)<\/td>\n<td>4× salário mínimo: ~€ 3.680/mês (média dos últimos 3 meses)<\/td>\n<td>≈ R$ 22.600<\/td>\n<td>Mercado-ponte e idioma; poupança sugerida ~€ 11 mil<\/td>\n<\/tr>\n<tr>\n<td>Espaço Schengen (turismo)<\/td>\n<td>Sem visto, 90 dias a cada 180; ETIAS previsto, data ainda incerta (fim de 2026 ou 2027)<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>Estada de turista não equivale a autorização de trabalho; confirme as regras de cada país<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Leitura:<\/strong> os vistos de nômade europeus exigem renda bem acima do cenário realista do Mês 6. Os primeiros passos mais viáveis tendem a ser América do Sul (Mercosul/Colômbia) e estadas curtas de turismo — com confirmação oficial antes.<\/p>\n<h2 id=\"9-planilha-financeira-crie-no-google-sheets-no-dia-1-e-atualize-toda-revisão-mensal\">9. Planilha financeira (crie no Google Sheets no Dia 1 e atualize toda revisão mensal)<\/h2>\n<p>Colunas: mês · receita BR · receita USD · receita EUR · câmbio usado · receita total R$ · impostos estimados · taxas (plataformas/câmbio) · ferramentas · lucro líquido · custo de vida · sobra · reserva acumulada · reserva em meses · % receita em moeda forte · maior cliente (% da receita) · status dos 4 marcos.<\/p>"}, "checklist": {"title": "Checklist diário", "group": "Revisões", "html": "<h2 id=\"antes-de-começar-2-min\">Antes de começar (2 min)<\/h2>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:1\"> Abri o arquivo do mês no dia de hoje (02-CRONOGRAMA).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:2\"> Celular no modo foco / fora do alcance.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:3\"> Sei qual é a <strong>entrega concreta<\/strong> de hoje (arquivo exportado ou mensagem enviada).<\/li>\n<\/ul>\n<h2 id=\"durante-3-h--ou-2-h-no-domingo\">Durante (3 h — ou 2 h no domingo)<\/h2>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:4\"> <strong>Bloco de inglês<\/strong> feito (30 min).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:5\"> <strong>Bloco principal<\/strong> feito (conceito + prática / projeto / prospecção).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:6\"> <strong>Bloco comercial<\/strong> feito quando houver (a partir do Mês 3, todo dia útil).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:7\"> Se houve cliente pago: entrega do cliente no lugar da prática, com checklist T05.<\/li>\n<\/ul>\n<h2 id=\"ao-terminar-5-min\">Ao terminar (5 min)<\/h2>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:8\"> Entrega salva na pasta certa com nome padrão.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:9\"> Linha do dia preenchida no PLANO-NOMADE-180.html (ou no CSV): status, minutos, minutos de inglês, criativos, leads, abordagens, follow-ups, respostas, calls, propostas, fechamentos, receita, energia (1–5).<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:10\"> CRM: todo lead tocado hoje tem próxima ação com data.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:11\"> 1 linha no \"Diário de aprendizado\": o que aprendi / o que travou.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:12\"> Li o objetivo de amanhã (campo \"Próxima ação\").<\/li>\n<\/ul>\n<h2 id=\"sinais-de-alerta-se-marcar-2-ou-mais-use-o-modo-mínimo-amanhã-e-fale-disso-na-revisão-de-domingo\">Sinais de alerta (se marcar 2 ou mais, use o Modo Mínimo amanhã e fale disso na revisão de domingo)<\/h2>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:13\"> Energia ≤ 2 por 3 dias seguidos.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:14\"> Dormi menos de 6 h duas noites seguidas.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:15\"> Pulei o inglês 3 dias seguidos.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:16\"> Passei o bloco inteiro assistindo tutorial sem produzir.<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:checklist:17\"> Evitei a prospecção a semana toda.<\/li>\n<\/ul>\n<p><strong>Modo Mínimo:<\/strong> 30 min de inglês + 15 min de registro. Sem culpa, sem compensação no dia seguinte.<\/p>"}, "rev-semanal": {"title": "Modelo de revisão semanal", "group": "Revisões", "html": "<blockquote>\n<p>60 min, todo domingo. Copie este template para um Google Doc por semana (ou adicione uma aba na planilha). Seja específico: números antes de opiniões.<\/p>\n<\/blockquote>\n<h2 id=\"1-números-da-semana-do-csv--15-min\">1. Números da semana (do CSV) — 15 min<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Indicador<\/th>\n<th>Meta (metas-semanais.csv)<\/th>\n<th>Realizado<\/th>\n<th>Δ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dias concluídos (de 7)<\/td>\n<td>7<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Minutos totais<\/td>\n<td>~1.200<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Minutos de inglês<\/td>\n<td>~210<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Criativos finalizados<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Contatos Brasil<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Contatos mercado-ponte<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Contatos em inglês (e-mail + LinkedIn + Upwork + agências)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Respostas / respostas positivas<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Calls<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Propostas enviadas<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Fechamentos<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Receita (R$ / US$ / €)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Custos de ferramentas<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Energia média (1–5)<\/td>\n<td>≥ 3<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"2-qualitativo--20-min\">2. Qualitativo — 20 min<\/h2>\n<p><strong>3 vitórias da semana:<\/strong>\n1.\n2.\n3.<\/p>\n<p><strong>3 gargalos (o que travou e por quê):<\/strong>\n1.\n2.\n3.<\/p>\n<p><strong>Qual mensagem/canal teve mais resposta? Por quê?<\/strong><\/p>\n<p><strong>Qual entrega ficou abaixo do padrão? O que muda no processo?<\/strong><\/p>\n<p><strong>Inglês: o que ficou mais fácil? Qual situação ainda trava?<\/strong><\/p>\n<h2 id=\"3-decisões--15-min\">3. Decisões — 15 min<\/h2>\n<ul>\n<li><strong>1 coisa para cortar ou reduzir:<\/strong><\/li>\n<li><strong>1 coisa para dobrar (o que funcionou):<\/strong><\/li>\n<li><strong>3 metas numéricas da próxima semana:<\/strong>\n  1.\n  2.\n  3.<\/li>\n<li><strong>Foco específico da semana<\/strong> (está no cronograma, no domingo): resposta:<\/li>\n<\/ul>\n<h2 id=\"4-saúde-e-energia--10-min\">4. Saúde e energia — 10 min<\/h2>\n<ul>\n<li>Dormiu bem? Fez alguma atividade física? Teve um momento de lazer real?<\/li>\n<li>Algum sinal de alerta do checklist diário apareceu? O que vai fazer diferente?<\/li>\n<li>Os 2 horários fixos estão funcionando? Precisa mudar?<\/li>\n<\/ul>"}, "rev-mensal": {"title": "Modelo de revisão mensal", "group": "Revisões", "html": "<blockquote>\n<p>90 min de revisão + 60 min de ajuste (o cronograma já reserva esse tempo). Nos Dias 90 e 180, inclua a comparação com a linha de base do Dia 1.<\/p>\n<\/blockquote>\n<h2 id=\"1-números-do-mês\">1. Números do mês<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Indicador<\/th>\n<th>Meta conservadora<\/th>\n<th>Meta realista<\/th>\n<th>Meta ambiciosa<\/th>\n<th>Realizado<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Receita Brasil (R$)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Receita internacional (US$/€)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Receita total (R$)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>% da receita em moeda forte<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Clientes ativos (BR / internacional)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Maior cliente (% da receita)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Custos de ferramentas (R$) e % da receita<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Reserva (R$ e meses de custo de vida)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Criativos finalizados<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tempo médio para produzir um anúncio de 15 s<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Contatos por canal / respostas / calls / propostas / fechamentos<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dias concluídos / minutos de inglês / conversas com humanos<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>As metas de cada mês estão no topo do arquivo mensal e no <a href=\"#doc/financeiro\">07-FINANCEIRO<\/a>.<\/p>\n<h2 id=\"2-critérios-de-passagem\">2. Critérios de passagem<\/h2>\n<p>Copie os critérios do topo do arquivo do mês e marque:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Critério<\/th>\n<th>Cumprido? (S/N)<\/th>\n<th>Evidência (link/arquivo/número)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Percentual cumprido:<\/strong> ___% → <strong>≥ 80%: avançar<\/strong> · <strong>&lt; 80%: usar a 1ª semana do próximo mês para fechar lacunas (sem conteúdo novo).<\/strong><\/p>\n<h2 id=\"3-funil-por-canal-o-que-manter-o-que-cortar\">3. Funil por canal (o que manter, o que cortar)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Canal<\/th>\n<th>Contatos<\/th>\n<th>Respostas<\/th>\n<th>Calls<\/th>\n<th>Propostas<\/th>\n<th>Fechamentos<\/th>\n<th>Minutos gastos<\/th>\n<th>Resposta positiva por hora<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Brasil (MM)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Mercado-ponte<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Cold e-mail<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>LinkedIn<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Upwork<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Agências<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Indicações<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"4-marcos-financeiros\">4. Marcos financeiros<\/h2>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:rev-mensal:1\"> Marco 1 — primeiro recebimento em moeda forte<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:rev-mensal:2\"> Marco 2 — renda recorrente internacional<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:rev-mensal:3\"> Marco 3 — renda líquida cobre o custo de vida (3 meses seguidos)<\/li>\n<li class=\"task\"><input type=\"checkbox\" class=\"tk\" data-k=\"doc:rev-mensal:4\"> Marco 4 — preparado para viajar<\/li>\n<\/ul>\n<h2 id=\"5-decisão-e-ajustes-máximo-3\">5. Decisão e ajustes (máximo 3)<\/h2>\n<p>1.\n2.\n3.<\/p>\n<p><strong>Nos Dias 90 e 120:<\/strong> aplicar a tabela \"Gatilhos para ativar a alternativa\" do <a href=\"#doc/estrategia/21-gatilhos-para-ativar-a-alternativa\">01-ESTRATEGIA<\/a> e registrar a decisão com o motivo.<\/p>\n<h2 id=\"6-comemorar\">6. Comemorar<\/h2>\n<p>O que você consegue fazer hoje que não conseguia há 30 dias? Escreva 3 coisas.<\/p>"}}, "docorder": ["diagnostico", "pesquisa", "estrategia", "portfolio", "ingles", "prospeccao", "scripts", "templates", "ferramentas", "recursos", "prompts", "financeiro", "checklist", "rev-semanal", "rev-mensal"], "crono": "<p>Este arquivo é o mapa. O detalhe de cada dia (tarefa exata, ferramenta, material, exercício, entrega, tempo por bloco, verificação e próxima ação) está nos 6 arquivos mensais:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mês<\/th>\n<th>Dias<\/th>\n<th>Fase<\/th>\n<th>Arquivo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>1–30<\/td>\n<td>Fundação: sistema, editor, IA e primeiros criativos<\/td>\n<td><a href=\"#mes/1\">mes-01-fundacao.md<\/a><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>31–60<\/td>\n<td>Produção comercial + mercado-ponte<\/td>\n<td><a href=\"#mes/2\">mes-02-producao-e-mercado-ponte.md<\/a><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>61–90<\/td>\n<td>Nicho e-commerce + prospecção em inglês<\/td>\n<td><a href=\"#mes/3\">mes-03-nicho-ecommerce-e-prospeccao.md<\/a><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>91–120<\/td>\n<td>Primeiros contratos e recorrência<\/td>\n<td><a href=\"#mes/4\">mes-04-contratos-e-recorrencia.md<\/a><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>121–150<\/td>\n<td>Escala de aquisição e posicionamento<\/td>\n<td><a href=\"#mes/5\">mes-05-escala-e-posicionamento.md<\/a><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>151–180<\/td>\n<td>Consolidação e prontidão nômade<\/td>\n<td><a href=\"#mes/6\">mes-06-consolidacao-e-prontidao-nomade.md<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>As datas sugeridas consideram início na <strong>segunda-feira, 09/11/2026<\/strong>. Se começar em outra data, mantenha a sequência dos dias e o ritmo semanal (Dia 1 sempre numa segunda-feira).<\/p>\n<h2 id=\"plano-geral-dos-6-meses\">Plano geral dos 6 meses<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mês<\/th>\n<th>Objetivo<\/th>\n<th>Entregas principais<\/th>\n<th>Renda internacional (realista, estimativa)<\/th>\n<th>Critério-chave para avançar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Sair do zero para produção<\/td>\n<td>4 anúncios + 5 ganchos, LinkedIn EN, Contra, Caso 01, oferta MM \"tráfego + criativos\"<\/td>\n<td>US$ 0<\/td>\n<td>Anúncio de 15 s em ≤ 2 h; ≥ 40 abordagens BR<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Qualidade de entrega + mercado-ponte<\/td>\n<td>8 anúncios em 3 verticais, site v1, Upwork, contas Wise/Payoneer, Caso 02<\/td>\n<td>até US$/€ 100<\/td>\n<td>≥ 40 contatos no mercado-ponte; anúncio em ≤ 90 min<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Nicho e-commerce + outbound em inglês<\/td>\n<td>Sample Sprint, 4 specs, 6 Looms EN, estáticos, kit de onboarding, portfólio v2<\/td>\n<td>US$ 100–300<\/td>\n<td>≥ 150 contatos em inglês; ≥ 3 calls; 1 piloto ou 2 propostas<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Contratos e recorrência<\/td>\n<td>Matriz de ângulos, relatório mensal, motion, localização, CRM, caso de processo<\/td>\n<td>US$ 300–600<\/td>\n<td>1 cliente internacional pago + 1 proposta de retainer<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Escala e posicionamento<\/td>\n<td>TikTok/YouTube, página de nicho, preço novo, deck de agências, narrativo 30 s, contador<\/td>\n<td>US$ 500–1.000<\/td>\n<td>≥ US$ 500/mês ou 1 cliente recorrente<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Consolidação e prontidão nômade<\/td>\n<td>3 pacotes fixos, SOPs, política de IA, kit remoto, destinos, showreel, plano 181–360<\/td>\n<td>US$ 700–1.500<\/td>\n<td>Marcos financeiros medidos; decisão de viagem com critério<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Metas conservadoras e ambiciosas de cada mês estão no topo de cada arquivo mensal e no <a href=\"#doc/financeiro\">07-FINANCEIRO/plano-financeiro.md<\/a>. <strong>Nenhuma meta de renda é garantida<\/strong> — elas existem para você comparar o real com o esperado e ajustar.<\/p>\n<h2 id=\"ritmo-semanal\">Ritmo semanal<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dia<\/th>\n<th>Tipo de dia<\/th>\n<th>O que acontece<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Segunda<\/td>\n<td>Habilidade<\/td>\n<td>Conceito novo + prática pesada (IA, edição, estratégia). A partir do Mês 3, + 30 min comerciais.<\/td>\n<\/tr>\n<tr>\n<td>Terça<\/td>\n<td>Habilidade<\/td>\n<td>Continuação/aplicação do conceito. A partir do Mês 3, + 30 min comerciais.<\/td>\n<\/tr>\n<tr>\n<td>Quarta<\/td>\n<td>Comercial<\/td>\n<td>Prospecção (Brasil no início; inglês a partir do Mês 3) + produção.<\/td>\n<\/tr>\n<tr>\n<td>Quinta<\/td>\n<td>Habilidade<\/td>\n<td>Conceito/prática ou material de venda.<\/td>\n<\/tr>\n<tr>\n<td>Sexta<\/td>\n<td>Comercial<\/td>\n<td>Prospecção, propostas, follow-ups, conteúdo.<\/td>\n<\/tr>\n<tr>\n<td>Sábado<\/td>\n<td>Projeto<\/td>\n<td>Peça de portfólio (ou entrega de cliente) de 2 h + publicação.<\/td>\n<\/tr>\n<tr>\n<td>Domingo<\/td>\n<td>Revisão + descanso<\/td>\n<td>30 min de conversa em inglês + 60 min de revisão semanal + 30 min de buffer. <strong>Máximo 2 h.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"distribuição-de-tempo-por-fase-3-hdia\">Distribuição de tempo por fase (3 h/dia)<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Fase<\/th>\n<th>Inglês<\/th>\n<th>Teoria<\/th>\n<th>Prática/produção<\/th>\n<th>Comercial<\/th>\n<th>Portfólio/registro<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Mês 1<\/td>\n<td>30 min<\/td>\n<td>30–40 min<\/td>\n<td>80–90 min<\/td>\n<td>0–30 min (60 na quarta)<\/td>\n<td>30 min<\/td>\n<\/tr>\n<tr>\n<td>Mês 2<\/td>\n<td>30 min<\/td>\n<td>30 min<\/td>\n<td>75–90 min<\/td>\n<td>45–150 min nos dias comerciais<\/td>\n<td>30 min<\/td>\n<\/tr>\n<tr>\n<td>Mês 3<\/td>\n<td>30 min<\/td>\n<td>20 min<\/td>\n<td>100 min<\/td>\n<td>30 min/dia + dias comerciais inteiros<\/td>\n<td>dentro da prática<\/td>\n<\/tr>\n<tr>\n<td>Meses 4–6<\/td>\n<td>30 min<\/td>\n<td>20 min<\/td>\n<td>90–120 min (ou cliente)<\/td>\n<td>≥ 45 min/dia útil<\/td>\n<td>dentro da prática<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A proporção teoria × prática fica em ~20/80 ao longo do plano: todo conceito vira uma entrega no mesmo dia.<\/p>\n<h2 id=\"regras-de-execução\">Regras de execução<\/h2>\n<ol>\n<li><strong>Cliente pago tem prioridade no bloco de prática.<\/strong> Quando houver entrega, o bloco de prática vira a entrega. Inglês e prospecção continuam.<\/li>\n<li><strong>Modo Mínimo<\/strong> (doença, feriado, dia caótico): 30 min de inglês + 15 min de registro. Não compense no dia seguinte — o domingo absorve.<\/li>\n<li><strong>Feriados no calendário sugerido:<\/strong> Natal (Dias 46–47), Ano-Novo (Dias 53–54) e Carnaval 2027 (Dias 92–93). Use o Modo Mínimo e passe a entrega para o buffer do domingo.<\/li>\n<li><strong>Descanso obrigatório:<\/strong> domingo leve toda semana e o Dia 91 inteiro de descanso, depois da revisão trimestral.<\/li>\n<li><strong>Atrasou mais de 3 dias?<\/strong> Não tente \"recuperar\" tudo. Pule para o dia atual do calendário e leve só as entregas críticas (anúncios, contatos comerciais).<\/li>\n<li><strong>Toda tarefa termina num arquivo exportado ou numa mensagem enviada.<\/strong> Assistir a tutorial sem produzir não conta como dia concluído.<\/li>\n<li><strong>Registre todos os dias<\/strong> no CSV (<a href=\"#dados\">08-REVISOES/acompanhamento-180-dias.csv<\/a>) ou no arquivo <a href=\"#dados\">PLANO-NOMADE-180.html<\/a>, que salva tudo sozinho.<\/li>\n<\/ol>", "weeks": [{"semana": "1", "dias": "1-7", "mes": "1", "tema_ingles": "Apresentar-se e explicar o que você faz", "foco": "Sistema, DaVinci básico, IA imagem, Ad #1", "meta_dias_concluidos": "7", "meta_min_ingles": "210", "meta_criativos": "1", "meta_contatos_br": "5", "meta_contatos_ponte": "0", "meta_contatos_ingles": "0", "meta_propostas_upwork": "0", "meta_calls": "0", "meta_posts": "0"}, {"semana": "2", "dias": "8-14", "mes": "1", "tema_ingles": "Descrever um processo passo a passo const COLS = ["dia","data_sugerida","dia_semana","mes","semana","fase","tipo","objetivo","entrega_planejada","min_planejados","min_ingles_planejados","status","min_realizados","min_ingles_realizados","criativos_finalizados","leads_novos","abordagens","followups","respostas","calls","propostas","clientes_fechados","receita_brl","receita_usd","receita_eur","custos_brl","energia_1a5","notas"];
function toCSV(){
  const q = v => { v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const lines = [COLS.join(",")];
  D.forEach(d => { const r = peek(d.n); const mins = r.min_realizados ?? (blocksDone(d.n).m || ""); const ing = r.min_ingles_realizados ?? (blocksDone(d.n).ing || "");
    const base = {dia:d.n, data_sugerida:iso(dateOf(d.n)), dia_semana:d.wd, mes:d.m, semana:d.w, fase:d.ph, tipo:d.tipo, objetivo:d.o, entrega_planejada:d.e, min_planejados:d.tot, min_ingles_planejados:d.ing, status:r.status||"", min_realizados:mins, min_ingles_realizados:ing};
    lines.push(COLS.map(c => q(c in base ? base[c] : (r[c] ?? ""))).join(",")); });
  return lines.join("\n");
}
function parseCSV(text){
  const rows=[]; let row=[], cur="", inq=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inq){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inq=false; } else cur+=ch; }
    else if(ch==='"') inq=true; else if(ch===','){ row.push(cur); cur=""; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=ch; }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function download(name, text, type){ const blob = new Blob([text], {type}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500); }

}

/* ---------- timer */
let T = null;
function beep(){ try{ const ctx = new (window.AudioContext || window.webkitAudioContext)(); [0, .35, .7].forEach(s => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.2, ctx.currentTime + s); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + s + .3); o.start(ctx.currentTime + s); o.stop(ctx.currentTime + s + .3); }); }catch(e){} if(navigator.vibrate) navigator.vibrate([300,150,300]); }
function startTimer(n, i){ const b = D[n-1].blocks[i]; T = {n, i, left: b.min*60, end: Date.now() + b.min*60000, paused:false, label:`Dia ${n} · ${b.label}`}; $("#tLab").textContent = T.label; $("#tPause").textContent = "Pausar"; $("#timer").classList.add("show"); tick(); }
function tick(){ if(!T) return; if(!T.paused) T.left = Math.max(0, Math.round((T.end - Date.now())/1000)); const m = Math.floor(T.left/60), s = T.left%60; $("#tTime").textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; document.title = T.paused ? "Plano Nômade 180" : `${$("#tTime").textContent} · Plano Nômade 180`;
  if(T.left <= 0){ const {n, i} = T; T = null; $("#timer").classList.remove("show"); document.title = "Plano Nômade 180"; beep(); setBlock(n, i, true); toast("Tempo do bloco concluído — bloco marcado ✓"); return; }
  setTimeout(tick, 500); }
$("#tPause").onclick = () => { if(!T) return; if(T.paused){ T.paused = false; T.end = Date.now() + T.left*1000; $("#tPause").textContent = "Pausar"; } else { T.paused = true; $("#tPause").textContent = "Continuar"; } };
$("#tPlus").onclick = () => { if(!T) return; T.left += 300; T.end += 300000; };
$("#tStop").onclick = () => { T = null; $("#timer").classList.remove("show"); document.title = "Plano Nômade 180"; };

function route(){
  let h = decodeURIComponent(location.hash.replace(/^#/, "")) || "inicio";
  const [v, a, ...rest] = h.split("/"); let keep = null;
  if(v === "hoje"){ viewDay(todayN()); }
  else if(v === "dia") viewDay(parseInt(a) || 1);
  else if(v === "cronograma") viewCrono();
  else if(v === "mes") viewMonth(parseInt(a) || 1);
  else if(v === "semana") viewWeek(parseInt(a) || 1);
  else if(v === "doc") keep = viewDoc(a, rest.join("/"));
  else if(v === "painel") viewPainel();
  else if(v === "dados") viewDados();
  else viewHome();
  if(keep !== "keep") window.scrollTo(0, 0);
  markNav(); closeMenu();
}

document.addEventListener("keydown", e => { if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return; const m = location.hash.match(/^#dia\/(\d+)/); if(!m) return; if(e.key === "ArrowRight" && +m[1] < 180) location.hash = "#dia/" + (+m[1] + 1); if(e.key === "ArrowLeft" && +m[1] > 1) location.hash = "#dia/" + (+m[1] - 1); });
window.addEventListener("hashchange", route);
applyTheme(); buildNav(); route();
</script>
